# The crossplane module: the tooling through which every catalog module
# carries its own cloud IAM. It installs Crossplane here and, in the steps
# each cloud adds, that cloud's providers and their ProviderConfig — and
# nothing that belongs to a module. A module that needs a cloud service
# declares its own managed resources (on AWS an IAM Role and a
# PodIdentityAssociation, on GCP an IAM binding of its own ServiceAccount's
# principal) in the step its cloud adds to it,
# oci/clusters/<cloud>/<module>/patch.yaml; adding such a module never
# touches this one. The contract those resources follow and the
# ordering chain: docs/architecture/module-iam.md; the module:
# docs/catalog/crossplane.md.
#
# One step here, core: Crossplane and its RBAC manager, the official chart.
# From Crossplane's Helm repository over HTTPS, not OCI like the other
# modules: upstream publishes the chart to charts.crossplane.io only (its
# promote workflow pushes images to OCI registries, never the chart). A cloud
# with Crossplane providers appends its own steps after it — on aws,
# oci/clusters/aws/crossplane/patch.yaml; on gcp,
# oci/clusters/gcp/crossplane/patch.yaml (docs/decisions/socle.md, SOCLE-32).
#
# resourcesTemplate rather than resources: the values Secret is listed only
# when the client names one, and the operator's block `<< if >>`/`<< end >>`
# is text templating, which the structured resources list cannot carry (see
# opentofu/bootstrap/manifests/templates/root.yaml).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: crossplane
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  wait: true
  steps:
    - name: core
      resourcesTemplate: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: crossplane-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
        ---
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: HelmRepository
        metadata:
          name: crossplane-stable
          namespace: crossplane-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: https://charts.crossplane.io/stable
        ---
        # The socle's own values, first in valuesFrom so that everything after
        # it wins. In a ConfigMap rather than in the HelmRelease's .values
        # because helm-controller merges .values LAST, over every valuesFrom
        # entry (fluxcd/pkg chartutil.ChartValuesFromReferences): kept there,
        # the socle's keys would silently beat the client's.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: crossplane-socle-values
          namespace: crossplane-system
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            # Measured on k3s: idle with no provider, core 3m / 32Mi and RBAC
            # manager 2m / 12Mi; with the AWS provider's 71 CRDs loaded, the
            # core at 109Mi. The chart's own 100m / 256Mi each would reserve
            # half a gigabyte before anything is declared. On the GKE sandbox
            # (2026-10-07), with the GCP providers' CRDs: core 176Mi, RBAC
            # manager 18Mi working set — the core's request is 192Mi since.
            # No limits, like every socle module: a memory limit turns a CRD
            # surge into an OOM loop, and a CPU limit throttles reconciliation.
            # Disk stated too, on every cloud, or GKE Autopilot reserves 1 GiB
            # a container that states none: the core's package cache is an
            # emptyDir capped at 20Mi by the chart, its function cache stays
            # empty (no function), and logs rotate at 5 × 10Mi on GKE. The
            # init container takes the core's resources.
            # Metrics for the monitoring module's vmagent: the core and the
            # RBAC manager declare port 8080 and annotate their pods. The
            # providers' pods Crossplane annotates itself.
            metrics:
              enabled: true
            resourcesCrossplane:
              limits: null
              requests:
                cpu: 50m
                memory: 192Mi
                ephemeral-storage: 128Mi
            resourcesRBACManager:
              limits: null
              requests:
                cpu: 10m
                memory: 32Mi
                ephemeral-storage: 64Mi
        ---
        # The client's own chart values, as he wrote them in
        # kube.crossplane.values. OpenTofu refuses secrets in there.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: crossplane-client-values
          namespace: crossplane-system
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml inputs.modules.crossplane.values | nindent 4 >>
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: crossplane
          namespace: crossplane-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: crossplane
          chart:
            spec:
              chart: crossplane
              version: 2.4.2  # appVersion v2.4.2
              sourceRef:
                kind: HelmRepository
                name: crossplane-stable
              interval: 1h
          # Merged in this order, later wins: the socle's values, the client's
          # from kube.crossplane.values, then his Secret when he named one —
          # created by him in crossplane-system, never read by OpenTofu,
          # optional so the release does not wait for it. No .values, on
          # purpose.
          valuesFrom:
            - kind: ConfigMap
              name: crossplane-socle-values
              valuesKey: values.yaml
            - kind: ConfigMap
              name: crossplane-client-values
              valuesKey: values.yaml
            << if inputs.modules.crossplane.values_secret >>
            - kind: Secret
              name: << inputs.modules.crossplane.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
          # The chart ships no crds/ folder: Crossplane's init container
          # applies its core CRDs at every start, so an upgrade of the chart is
          # an upgrade of the CRDs, and Helm's CRD policy does not apply.
          install:
            remediation:
              retries: 3
          upgrade:
            remediation:
              retries: 3
        << $monitored := and inputs.modules.crossplane.enabled inputs.modules.monitoring.enabled ->>
        ---
        # The module's monitoring — its alert rules and its dashboard, from
        # monitoring/ in the socle artifact: VMRules and a ConfigMap Grafana's
        # sidecar loads. Present only while both this module and the monitoring
        # module are on: monitoring brings the VMRule CRD, and until it has the
        # Kustomization fails and retries every minute
        # (docs/decisions/monitoring.md, MONITORING-12).
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: crossplane-monitoring
          namespace: flux-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if $monitored >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          retryInterval: 1m
          sourceRef:
            kind: OCIRepository
            name: socle
          path: ./catalog/crossplane/monitoring
          targetNamespace: crossplane-system
          prune: true
          wait: true
          timeout: 2m
