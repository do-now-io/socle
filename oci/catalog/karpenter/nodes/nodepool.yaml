# The one NodePool the socle renders: what every pod that does not fit on the
# bootstrap group gets a node from. The module's patches put
# kube.karpenter.node_pool in it (docs/catalog/karpenter.md); a client writes
# more NodePools beside it.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # Karpenter launches the cheapest instance that fits among these:
        # Spot before on demand, Graviton before x86, as for the bootstrap
        # group. A pod whose image is x86 only says so with a nodeSelector on
        # kubernetes.io/arch.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # General purpose, compute and memory optimised, recent generations:
        # Karpenter's own default, which keeps out GPU, storage and
        # previous-generation families.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
      # Cilium's agent removes it once it runs on the node: no pod lands
      # before the node has a network. A startup taint, so Karpenter does not
      # count it against scheduling (docs.cilium.io, Karpenter).
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      # A node lives 30 days at most: replaced on the latest AMI and patches.
      expireAfter: 720h
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    # Empty nodes go, and nodes whose pods fit elsewhere for less; at most
    # one node in ten at a time, Karpenter's default budget.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"
