# The private and public EC2NodeClasses and NodePools of the karpenter
# module, applied by its karpenter-nodes Kustomization, whose patches put in
# what is the cluster's and what kube.karpenter.private_pool and public_pool
# say
# (oci/catalog/karpenter/resourceset.yaml, step nodes). As written here they
# are the catalog's defaults for a cluster named `socle`: valid objects, so
# CI validates them against Karpenter's schemas.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ec2nodeclass-private.yaml
  - ec2nodeclass-public.yaml
  - nodepool-private.yaml
  - nodepool-public.yaml
