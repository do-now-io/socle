# The velero module: backup and restore of what GitOps cannot restore — the
# data in the applications' volumes, with their objects — into the module's
# own bucket. docs/catalog/velero.md and docs/decisions/velero.md hold the
# design; the rules of docs/reference/catalog-module-standard.md apply:
# inputsFrom the one provider, the reconcile toggle on EACH resource, values
# tested never presence.
#
# What is the same on every cloud. velero is offered on aws only
# (catalog_clouds); what is aws's is oci/clusters/aws/velero/patch.yaml, a
# step named cloud inserted before workload (docs/decisions/socle.md,
# SOCLE-32). A cloud step provides, in the ConfigMap velero-cloud-values:
# the object-store plugin, the backupStorageLocation named default that
# every Schedule below writes to, and configMaps.volume-policy — the
# velero-volume-policy every Schedule references, which says how each of
# that cloud's CSI drivers is backed up. With them, the bucket and the
# module's own access to it, and the VolumeSnapshotClass Velero snapshots
# with.
#
# Values, in the order helm-controller merges them, later winning
# (docs/decisions/socle.md#socle-06-the-clients-values-win): the socle's
# velero-socle-values, the cloud step's velero-cloud-values, the client's
# velero-client-values (kube.velero.values), then the client's Secret when
# they name one. No inline `values:` on the HelmRelease.
#
# Steps, each applied once the one before is healthy: namespace, then
# workload — the chart, the Schedules and the admission policy. The cloud's
# step between them is healthy only once the bucket and the module's access
# are ready: EKS Pod Identity injects the credentials at pod admission only.
#
# What an application does: its chart labels every object of its release
# with socle.do-now.io/backup-frequency and socle.do-now.io/backup-retention.
# Each entry of kube.velero.policies is one such pair, one Schedule selecting
# it. An application never writes into the velero namespace: Velero runs with
# cluster-admin rights, and a Schedule or a Restore there reads or rewrites
# any namespace.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: velero
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  wait: true
  steps:
    - name: namespace
      resourcesTemplate: |
        << $on := inputs.modules.velero.enabled >>
        apiVersion: v1
        kind: Namespace
        metadata:
          name: velero
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
          labels:
            # The server and its jobs run non-root, read-only, no capabilities:
            # restricted holds. The node-agent mounts the kubelet's pod volumes
            # from the host to read them, so with it the namespace is privileged.
            pod-security.kubernetes.io/enforce: << if inputs.modules.velero.node_agent >>privileged<< else >>restricted<< end >>
    - name: workload
      resourcesTemplate: |
        << $on := inputs.modules.velero.enabled >>
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: HelmRepository
        metadata:
          name: vmware-tanzu
          namespace: velero
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: https://vmware-tanzu.github.io/helm-charts
        ---
        # The socle's defaults. Everything the client may override through values.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: velero-socle-values
          namespace: velero
          labels:
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            fullnameOverride: velero
            serviceAccount:
              server:
                create: true
                # The subject the module's Pod Identity association binds.
                name: velero-server
            # Turning the module off keeps the CRDs: a re-enable re-syncs the
            # Backup objects from the bucket, and they need their kind.
            upgradeCRDs: true
            cleanUpCRDs: false
            # CSI snapshots need no VolumeSnapshotLocation: the
            # VolumeSnapshotClass the cloud's step renders is what Velero
            # picks, by its label.
            snapshotsEnabled: false
            deployNodeAgent: << inputs.modules.velero.node_agent >>
            configuration:
              # CSI snapshots only where the snapshot controller and its CRDs
              # are: without them every backup ends PartiallyFailed on the
              # missing VolumeSnapshot kinds (measured on k3s, 2026-10-01).
              << if inputs.storage.snapshots >>
              features: EnableCSI
              << end >>
              uploaderType: kopia
              defaultVolumesToFsBackup: false
            # One Schedule per (frequency, retention) pair, named after it,
            # selecting the two labels across every namespace. The volume
            # policy decides each volume's method.
            schedules:
              << range $p := inputs.modules.velero.policies >>
              << $p.frequency >>-<< $p.retention >>:
                schedule: << $p.schedule | quote >>
                template:
                  # Velero takes hours: 7d is 168h.
                  << $hours := $p.retention >>
                  << if hasSuffix "d" $p.retention >><< $hours = printf "%dh" (mul (trimSuffix "d" $p.retention | atoi) 24) >><< end >>
                  ttl: << $hours >>
                  includedNamespaces: ["*"]
                  storageLocation: default
                  labelSelector:
                    matchLabels:
                      socle.do-now.io/backup-frequency: << $p.frequency | quote >>
                      socle.do-now.io/backup-retention: << $p.retention | quote >>
                  resourcePolicy:
                    kind: configmap
                    name: velero-volume-policy
              << end >>
            # Pod Security restricted, for the server, the CRD upgrade job
            # and the repository maintenance jobs it starts.
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            # A read-only root filesystem: Kopia writes its repository
            # configuration under /udmrepo and its cache under $HOME, which is /
            # for the image's user: "mkdir /udmrepo" and "mkdir /.cache: read-only
            # file system" otherwise, measured. The chart mounts /scratch itself.
            extraVolumes:
              - name: udmrepo
                emptyDir: {}
              - name: cache
                emptyDir: {}
            extraVolumeMounts:
              - name: udmrepo
                mountPath: /udmrepo
              - name: cache
                mountPath: /.cache
            kubectl:
              containerSecurityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            nodeAgent:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
        ---
        # The client's own chart values, as written in kube.velero.values.
        # OpenTofu refuses secrets in there.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: velero-client-values
          namespace: velero
          labels:
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml inputs.modules.velero.values | nindent 8 >>
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: velero
          namespace: velero
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: velero
          install:
            strategy:
              name: RetryOnFailure
              retryInterval: 2m
          upgrade:
            strategy:
              name: RetryOnFailure
              retryInterval: 2m
          chart:
            spec:
              chart: velero
              version: 12.2.0  # appVersion 1.18.2
              sourceRef:
                kind: HelmRepository
                name: vmware-tanzu
          valuesFrom:
            - kind: ConfigMap
              name: velero-socle-values
              valuesKey: values.yaml
            # The cloud step's: the plugin, the storage location, the volume
            # policy.
            - kind: ConfigMap
              name: velero-cloud-values
              valuesKey: values.yaml
              optional: true
            - kind: ConfigMap
              name: velero-client-values
              valuesKey: values.yaml
            << if inputs.modules.velero.values_secret >>
            - kind: Secret
              name: << inputs.modules.velero.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
        ---
        # A pair that is not one of kube.velero.policies backs nothing up, in
        # silence. Warned at admission — never refused: a backup label must not
        # be able to block a deployment. Matched on the objects a chart writes
        # (workloads, claims) that carry the frequency label.
        apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicy
        metadata:
          name: velero-backup-labels
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        spec:
          failurePolicy: Ignore
          matchConstraints:
            objectSelector:
              matchExpressions:
                - key: socle.do-now.io/backup-frequency
                  operator: Exists
            resourceRules:
              - apiGroups: [apps]
                apiVersions: [v1]
                operations: [CREATE, UPDATE]
                resources: [deployments, statefulsets, daemonsets]
              - apiGroups: [""]
                apiVersions: [v1]
                operations: [CREATE, UPDATE]
                resources: [persistentvolumeclaims]
          variables:
            - name: pair
              expression: >-
                object.metadata.labels['socle.do-now.io/backup-frequency'] + '-' +
                ('socle.do-now.io/backup-retention' in object.metadata.labels
                ? object.metadata.labels['socle.do-now.io/backup-retention'] : '')
          validations:
            # One string per pair, from kube.velero.policies.
            - expression: >-
                variables.pair in [
                << range $i, $p := inputs.modules.velero.policies >>
                << if $i >>,<< end >>'<< $p.frequency >>-<< $p.retention >>'
                << end >>
                ]
              messageExpression: >-
                'socle.do-now.io/backup-frequency and -retention name ' + variables.pair +
                ', which is not a backup policy of this cluster: this object is not backed up' +
                ' (docs/catalog/velero.md)'
        ---
        apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicyBinding
        metadata:
          name: velero-backup-labels
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        spec:
          policyName: velero-backup-labels
          validationActions: [Warn, Audit]
        << $monitored := and inputs.modules.velero.enabled inputs.modules.monitoring.enabled ->>
        ---
        # The module's monitoring — its alert rules and its dashboard, from
        # monitoring/ in the socle artifact: VMRules and a ConfigMap Grafana's
        # sidecar loads. Present only while both this module and the monitoring
        # module are on: monitoring brings the VMRule CRD, and until it has the
        # Kustomization fails and retries every minute
        # (docs/decisions/monitoring.md, MONITORING-12).
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: velero-monitoring
          namespace: flux-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if $monitored >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          retryInterval: 1m
          sourceRef:
            kind: OCIRepository
            name: socle
          path: ./catalog/velero/monitoring
          targetNamespace: velero
          prune: true
          wait: true
          timeout: 2m
