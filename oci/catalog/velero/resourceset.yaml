# The velero module: backup and restore of what GitOps cannot restore — the
# data in the applications' volumes (EBS and EFS on AWS, Persistent Disk on
# GCP), with their objects — into the module's own bucket.
# docs/catalog/velero.md holds the design; the rules of docs/flux-catalog.md
# §6 apply: inputsFrom the one provider, the reconcile toggle on EACH
# resource, values tested never presence.
#
# Values, in the order helm-controller merges them, later winning: the
# socle's velero-socle-values, the client's velero-client-values
# (kube.velero.values), then the client's Secret when they name one. No
# inline `values:` on the HelmRelease.
#
# Two layers, as external-dns (docs/catalog/external-dns.md, Ordering):
# - this ResourceSet: the Namespace and, with Crossplane on, the module's
#   bucket and its access (docs/catalog/crossplane.md §3) — on AWS the
#   bucket's settings, its IAM Role and the Pod Identity association binding
#   it to velero/velero-server; on GCP the bucket and one BucketIAMMember
#   binding velero/velero-server's own principal;
# - velero-workload, a child ResourceSet holding the chart, the
#   VolumeSnapshotClass and the admission policy, which dependsOn those being
#   Ready: EKS Pod Identity injects the credentials at pod admission only,
#   and on GCP a server started before its binding fails its storage
#   location until the next validation.
# This ResourceSet dependsOn the crossplane one, which always exists and is
# Ready trivially when Crossplane is off.
#
# What an application does: its chart labels every object of its release
# with socle.do-now.io/backup-frequency and socle.do-now.io/backup-retention.
# Each entry of kube.velero.policies is one such pair, one Schedule selecting
# it. An application never writes into the velero namespace: Velero runs with
# cluster-admin rights, and a Schedule or a Restore there reads or rewrites
# any namespace.
#
# The bucket is never deleted by the socle: its managed resources carry
# managementPolicies without Delete (namespaced managed resources have no
# deletionPolicy in Crossplane v2), and Crossplane's own identity has no
# s3:Delete* action at all (opentofu/aws/iam.tf), nor storage.buckets.delete
# (opentofu/gcp/iam.tf). Turning the module off, or uninstalling the socle,
# leaves the bucket and every backup in it; a cluster rebuilt under the same
# name adopts it by its external name.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: velero
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: crossplane
      namespace: flux-system
      ready: true
  wait: true
  resourcesTemplate: |
    << $on := inputs.modules.velero.enabled >>
    << $gcp := eq inputs.cloud "gcp" >>
    << $bucket := printf "%s-velero-%s" inputs.cluster.name inputs.cluster.accountId >>
    << if $gcp >><< $bucket = printf "%s-velero-%s" inputs.cluster.name inputs.cluster.projectNumber >><< end >>
    << $access := and (eq inputs.cloud "aws") inputs.modules.crossplane.enabled >>
    << $gcpAccess := and (eq inputs.cloud "gcp") inputs.modules.crossplane.enabled >>
    # The project's keys exist on gcp only until every cloud's inputs carry
    # them: read under the cloud's condition.
    << $principal := "" >>
    << if $gcp >><< $principal = printf "principal://iam.googleapis.com/projects/%s/locations/global/workloadIdentityPools/%s.svc.id.goog/subject/ns/%s/sa/%s" inputs.cluster.projectNumber inputs.cluster.projectId "velero" "velero-server" >><< end >>
    << $provider := "aws" >>
    << if $gcp >><< $provider = "gcp" >><< end >>
    # Autopilot refuses the node-agent's hostPath: the plan refuses
    # node_agent on gcp, and nothing of it renders there.
    << $nodeAgent := and inputs.modules.velero.node_agent (not $gcp) >>
    apiVersion: v1
    kind: Namespace
    metadata:
      name: velero
      annotations:
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      labels:
        # The server and its jobs run non-root, read-only, no capabilities:
        # restricted holds. The node-agent mounts the kubelet's pod volumes
        # from the host to read them, so with it the namespace is privileged.
        pod-security.kubernetes.io/enforce: << if $nodeAgent >>privileged<< else >>restricted<< end >>
    << if $access >>
    ---
    # The module's bucket. External name = the S3 name: global, so it carries
    # the account; under the cluster's prefix, the only one Crossplane's own
    # identity may create. Observe, Create, Update, LateInitialize — no
    # Delete: deleting this object releases it and leaves the bucket.
    apiVersion: s3.aws.m.upbound.io/v1beta1
    kind: Bucket
    metadata:
      name: velero
      namespace: velero
      annotations:
        crossplane.io/external-name: << $bucket >>
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      managementPolicies: [Observe, Create, Update, LateInitialize]
      forProvider:
        region: << inputs.cluster.region >>
        tags:
          socle-cluster: << inputs.cluster.name | quote >>
          socle-module: velero
    ---
    # Versioning: Velero deleting a backup at its TTL leaves its objects as
    # noncurrent versions, expired 30 days later by the lifecycle below — a
    # deletion, by mistake or by whoever got the role, is recoverable for a
    # month.
    apiVersion: s3.aws.m.upbound.io/v1beta1
    kind: BucketVersioning
    metadata:
      name: velero
      namespace: velero
      annotations:
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      managementPolicies: [Observe, Create, Update, LateInitialize]
      forProvider:
        region: << inputs.cluster.region >>
        bucketRef:
          name: velero
        versioningConfiguration:
          status: Enabled
    ---
    apiVersion: s3.aws.m.upbound.io/v1beta1
    kind: BucketServerSideEncryptionConfiguration
    metadata:
      name: velero
      namespace: velero
      annotations:
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      managementPolicies: [Observe, Create, Update, LateInitialize]
      forProvider:
        region: << inputs.cluster.region >>
        bucketRef:
          name: velero
        rule:
          - applyServerSideEncryptionByDefault:
              sseAlgorithm: AES256
    ---
    apiVersion: s3.aws.m.upbound.io/v1beta1
    kind: BucketPublicAccessBlock
    metadata:
      name: velero
      namespace: velero
      annotations:
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      managementPolicies: [Observe, Create, Update, LateInitialize]
      forProvider:
        region: << inputs.cluster.region >>
        bucketRef:
          name: velero
        blockPublicAcls: true
        blockPublicPolicy: true
        ignorePublicAcls: true
        restrictPublicBuckets: true
    ---
    apiVersion: s3.aws.m.upbound.io/v1beta1
    kind: BucketLifecycleConfiguration
    metadata:
      name: velero
      namespace: velero
      annotations:
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      managementPolicies: [Observe, Create, Update, LateInitialize]
      forProvider:
        region: << inputs.cluster.region >>
        bucketRef:
          name: velero
        rule:
          - id: noncurrent-30d
            status: Enabled
            filter:
              - prefix: ""
            noncurrentVersionExpiration:
              - noncurrentDays: 30
            abortIncompleteMultipartUpload:
              - daysAfterInitiation: 7
    ---
    # The module's own AWS access, docs/catalog/crossplane.md §3: S3 object
    # actions on its bucket, nothing else. No EC2: in CSI mode Velero creates
    # VolumeSnapshot objects and the EBS CSI driver takes the snapshots with
    # its own role (opentofu/bootstrap/eks_addons.tf).
    apiVersion: iam.aws.m.upbound.io/v1beta1
    kind: Role
    metadata:
      name: velero-server
      namespace: velero
      annotations:
        crossplane.io/external-name: << inputs.cluster.name >>-velero
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        path: /socle/<< inputs.cluster.name >>/
        << if inputs.modules.crossplane.permissions_boundary >>
        permissionsBoundary: << inputs.modules.crossplane.permissions_boundary | quote >>
        << end >>
        assumeRolePolicy: |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Service": "pods.eks.amazonaws.com"},
              "Action": ["sts:AssumeRole", "sts:TagSession"]
            }]
          }
        inlinePolicy:
          - name: bucket
            policy: |
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "ListTheBucket",
                    "Effect": "Allow",
                    "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
                    "Resource": "arn:aws:s3:::<< $bucket >>"
                  },
                  {
                    "Sid": "ObjectsInTheBucket",
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject",
                      "s3:PutObjectTagging",
                      "s3:AbortMultipartUpload",
                      "s3:ListMultipartUploadParts"
                    ],
                    "Resource": "arn:aws:s3:::<< $bucket >>/*"
                  }
                ]
              }
    ---
    apiVersion: eks.aws.m.upbound.io/v1beta1
    kind: PodIdentityAssociation
    metadata:
      name: velero-server
      namespace: velero
      annotations:
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        region: << inputs.cluster.region >>
        clusterName: << inputs.cluster.name >>
        namespace: velero
        serviceAccount: velero-server
        roleArnRef:
          name: velero-server
    << end >>
    << if $gcpAccess >>
    ---
    # The module's bucket on GCS. External name = the bucket's name: global,
    # so it carries the project number; under the cluster's prefix, the only
    # one Crossplane's bucket role may create (opentofu/gcp/iam.tf). Observe,
    # Create, Update, LateInitialize — no Delete, and that role has no
    # storage.buckets.delete either: deleting this object releases it and
    # leaves the bucket.
    #
    # Uniform bucket-level access is what makes the binding below safe. The
    # foundations refuse every predefined admin role in allowed_roles but
    # roles/storage.objectAdmin, because its one IAM-granting permission,
    # storage.objects.setIamPolicy, writes object ACLs — and a bucket with
    # uniform access has none. Without it, Velero's principal could hand any
    # backup to anyone. Encrypted at rest by GCS's default, Google-managed
    # keys: nothing to declare, as SSE-S3 on AWS.
    #
    # Versioning: Velero deleting a backup at its TTL leaves its objects as
    # noncurrent versions, deleted 30 days later by the lifecycle rule — a
    # deletion, by mistake or by whoever got the role, is recoverable for a
    # month.
    apiVersion: storage.gcp.m.upbound.io/v1beta2
    kind: Bucket
    metadata:
      name: velero
      namespace: velero
      annotations:
        crossplane.io/external-name: << $bucket >>
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      managementPolicies: [Observe, Create, Update, LateInitialize]
      forProvider:
        location: << upper inputs.cluster.region >>
        uniformBucketLevelAccess: true
        publicAccessPrevention: enforced
        versioning:
          enabled: true
        lifecycleRule:
          - condition:
              withState: ARCHIVED
              daysSinceNoncurrentTime: 30
            action:
              type: Delete
        labels:
          socle-cluster: << inputs.cluster.name | quote >>
          socle-module: velero
    ---
    # The module's own GCP access, docs/catalog/crossplane.md §3: object
    # actions on its bucket, nothing else, granted to velero/velero-server's
    # own principal — Workload Identity Federation, no Google service
    # account. No compute role: in CSI mode Velero creates VolumeSnapshot
    # objects and GKE's PD CSI driver takes the snapshots with its own
    # identity. Crossplane writes this binding only if the client listed
    # roles/storage.objectAdmin in gcp.crossplane.allowed_roles; otherwise it
    # stays not Ready on the IAM error, and the workload waits for it.
    apiVersion: storage.gcp.m.upbound.io/v1beta1
    kind: BucketIAMMember
    metadata:
      name: velero-server
      namespace: velero
      annotations:
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        bucketRef:
          name: velero
        role: roles/storage.objectAdmin
        member: << $principal >>
    << end >>
    ---
    apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSet
    metadata:
      name: velero-workload
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
    spec:
      << if $access >>
      dependsOn:
        - apiVersion: s3.aws.m.upbound.io/v1beta1
          kind: Bucket
          name: velero
          namespace: velero
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        - apiVersion: iam.aws.m.upbound.io/v1beta1
          kind: Role
          name: velero-server
          namespace: velero
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        - apiVersion: eks.aws.m.upbound.io/v1beta1
          kind: PodIdentityAssociation
          name: velero-server
          namespace: velero
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      << else if $gcpAccess >>
      dependsOn:
        - apiVersion: storage.gcp.m.upbound.io/v1beta2
          kind: Bucket
          name: velero
          namespace: velero
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        - apiVersion: storage.gcp.m.upbound.io/v1beta1
          kind: BucketIAMMember
          name: velero-server
          namespace: velero
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      << end >>
      wait: true
      resources:
      - apiVersion: source.toolkit.fluxcd.io/v1
        kind: HelmRepository
        metadata:
          name: vmware-tanzu
          namespace: velero
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: https://vmware-tanzu.github.io/helm-charts
      # The socle's defaults. Everything the client may override through values.
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: velero-socle-values
          namespace: velero
          labels:
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            fullnameOverride: velero
            serviceAccount:
              server:
                create: true
                <<- if $gcp >>
                # The subject of the principal the module's BucketIAMMember
                # binds: no annotation, no Google service account.
                <<- else >>
                # The subject the module's Pod Identity association binds.
                <<- end >>
                name: velero-server
            <<- if $gcp >>
            # Application Default Credentials, from the GKE metadata server:
            # the token of velero-server's own principal. No key anywhere.
            <<- else >>
            # The AWS SDK's default chain: the Pod Identity credentials of
            # the module's own role. No key anywhere.
            <<- end >>
            credentials:
              useSecret: false
            # Pinned with the chart: 1.14.x is the line for Velero 1.18.
            initContainers:
              - name: velero-plugin-for-<< $provider >>
                image: docker.io/velero/velero-plugin-for-<< $provider >>:v1.14.4
                imagePullPolicy: IfNotPresent
                volumeMounts:
                  - mountPath: /target
                    name: plugins
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
            # Turning the module off keeps the CRDs: a re-enable re-syncs the
            # Backup objects from the bucket, and they need their kind.
            upgradeCRDs: true
            cleanUpCRDs: false
            # CSI snapshots need no VolumeSnapshotLocation: the
            # VolumeSnapshotClass of the workload ResourceSet is what Velero
            # picks, by its label.
            snapshotsEnabled: false
            deployNodeAgent: << $nodeAgent >>
            configuration:
              # CSI snapshots only where the snapshot controller and its CRDs
              # are: without them every backup ends PartiallyFailed on the
              # missing VolumeSnapshot kinds (measured on k3s, 2026-10-01).
              << if inputs.storage.snapshots >>
              features: EnableCSI
              << end >>
              uploaderType: kopia
              defaultVolumesToFsBackup: false
              backupStorageLocation:
                - name: default
                  provider: << $provider >>
                  bucket: << $bucket >>
                  default: true
                  config:
                    <<- if $gcp >>
                    # Required, and a placeholder on purpose. With the
                    # metadata server's credentials, velero-plugin-for-gcp
                    # v1.14.4 refuses to start without a serviceAccount
                    # (object_store.go, initFromComputeEngine), and uses it
                    # for one thing: signing download URLs through IAM
                    # signBlob, as that Google service account. The socle
                    # creates none, so `velero backup logs`, `download` and
                    # what `describe` reads from the bucket fail; backups and
                    # restores sign nothing (docs/catalog/velero.md §2). No
                    # region: the plugin refuses any key it does not know.
                    serviceAccount: no-google-service-account
                    <<- else >>
                    region: << inputs.cluster.region | quote >>
                    <<- end >>
            # One Schedule per (frequency, retention) pair, named after it,
            # selecting the two labels across every namespace. The volume
            # policy decides each volume's method.
            schedules:
              << range $p := inputs.modules.velero.policies >>
              << $p.frequency >>-<< $p.retention >>:
                schedule: << $p.schedule | quote >>
                template:
                  # Velero takes hours: 7d is 168h.
                  << $hours := $p.retention >>
                  << if hasSuffix "d" $p.retention >><< $hours = printf "%dh" (mul (trimSuffix "d" $p.retention | atoi) 24) >><< end >>
                  ttl: << $hours >>
                  includedNamespaces: ["*"]
                  storageLocation: default
                  labelSelector:
                    matchLabels:
                      socle.do-now.io/backup-frequency: << $p.frequency | quote >>
                      socle.do-now.io/backup-retention: << $p.retention | quote >>
                  resourcePolicy:
                    kind: configmap
                    name: velero-volume-policy
              << end >>
            <<- if $gcp >>
            # The volume policy every Schedule references: Persistent Disk
            # by CSI snapshot. No file-system backup: Autopilot refuses the
            # node-agent's hostPath. Any other volume — Filestore included —
            # gets Velero's fallback: no snapshot location and no fs-backup
            # annotation, so it is skipped.
            <<- else >>
            # The volume policy every Schedule references: EBS by CSI
            # snapshot, EFS by file-system backup (its driver has no
            # snapshots). Any other volume gets Velero's fallback: no
            # snapshot location and no fs-backup annotation, so it is
            # skipped.
            <<- end >>
            configMaps:
              volume-policy:
                data:
                  policy.yaml: |
                    version: v1
                    volumePolicies:
                      <<- if $gcp >>
                      - conditions:
                          csi:
                            driver: pd.csi.storage.gke.io
                        action:
                          type: snapshot
                      <<- else >>
                      - conditions:
                          csi:
                            driver: ebs.csi.aws.com
                        action:
                          type: snapshot
                      - conditions:
                          csi:
                            driver: efs.csi.aws.com
                        action:
                          type: fs-backup
                      <<- end >>
            # Pod Security restricted, for the server, the CRD upgrade job
            # and the repository maintenance jobs it starts.
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            # A read-only root filesystem: Kopia writes its repository
            # configuration under /udmrepo and its cache under $HOME, which is /
            # for the image's user: "mkdir /udmrepo" and "mkdir /.cache: read-only
            # file system" otherwise, measured. The chart mounts /scratch itself.
            extraVolumes:
              - name: udmrepo
                emptyDir: {}
              - name: cache
                emptyDir: {}
            extraVolumeMounts:
              - name: udmrepo
                mountPath: /udmrepo
              - name: cache
                mountPath: /.cache
            kubectl:
              containerSecurityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            <<- if $gcp >>
            # The CRD upgrade hook's Job: Autopilot gives a container without
            # requests 500m / 2Gi, and bills what is requested.
            upgradeJobResources:
              requests:
                cpu: 50m
                memory: 128Mi
            <<- else >>
            nodeAgent:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
            <<- end >>
      # The client's own chart values, as written in kube.velero.values.
      # OpenTofu refuses secrets in there.
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: velero-client-values
          namespace: velero
          labels:
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml inputs.modules.velero.values | nindent 8 >>
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: velero
          namespace: velero
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: velero
          install:
            strategy:
              name: RetryOnFailure
              retryInterval: 2m
          upgrade:
            strategy:
              name: RetryOnFailure
              retryInterval: 2m
          chart:
            spec:
              chart: velero
              version: 12.2.0  # appVersion 1.18.2
              sourceRef:
                kind: HelmRepository
                name: vmware-tanzu
          valuesFrom:
            - kind: ConfigMap
              name: velero-socle-values
              valuesKey: values.yaml
            - kind: ConfigMap
              name: velero-client-values
              valuesKey: values.yaml
            << if inputs.modules.velero.values_secret >>
            - kind: Secret
              name: << inputs.modules.velero.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
      << if and inputs.storage.snapshots $gcp >>
      # The class Velero takes Persistent Disk CSI snapshots with, by its
      # label: GKE's driver takes them with its own identity, so the module
      # needs no compute role. Retain: a snapshot outlives its VolumeSnapshot
      # objects — Velero deletes it when the backup expires, nothing else
      # does.
      - apiVersion: snapshot.storage.k8s.io/v1
        kind: VolumeSnapshotClass
        metadata:
          name: velero-pd
          labels:
            velero.io/csi-volumesnapshot-class: "true"
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        driver: pd.csi.storage.gke.io
        deletionPolicy: Retain
      << else if inputs.storage.snapshots >>
      # The class Velero takes EBS CSI snapshots with, by its label. Retain:
      # a snapshot outlives its VolumeSnapshot objects — Velero deletes it
      # when the backup expires, nothing else does.
      - apiVersion: snapshot.storage.k8s.io/v1
        kind: VolumeSnapshotClass
        metadata:
          name: velero-ebs
          labels:
            velero.io/csi-volumesnapshot-class: "true"
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        driver: ebs.csi.aws.com
        deletionPolicy: Retain
      << end >>
      # A pair that is not one of kube.velero.policies backs nothing up, in
      # silence. Warned at admission — never refused: a backup label must not
      # be able to block a deployment. Matched on the objects a chart writes
      # (workloads, claims) that carry the frequency label.
      - apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicy
        metadata:
          name: velero-backup-labels
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        spec:
          failurePolicy: Ignore
          matchConstraints:
            objectSelector:
              matchExpressions:
                - key: socle.do-now.io/backup-frequency
                  operator: Exists
            resourceRules:
              - apiGroups: [apps]
                apiVersions: [v1]
                operations: [CREATE, UPDATE]
                resources: [deployments, statefulsets, daemonsets]
              - apiGroups: [""]
                apiVersions: [v1]
                operations: [CREATE, UPDATE]
                resources: [persistentvolumeclaims]
          variables:
            - name: pair
              expression: >-
                object.metadata.labels['socle.do-now.io/backup-frequency'] + '-' +
                ('socle.do-now.io/backup-retention' in object.metadata.labels
                ? object.metadata.labels['socle.do-now.io/backup-retention'] : '')
          validations:
            # One string per pair, from kube.velero.policies.
            - expression: >-
                variables.pair in [
                << range $i, $p := inputs.modules.velero.policies >>
                << if $i >>,<< end >>'<< $p.frequency >>-<< $p.retention >>'
                << end >>
                ]
              messageExpression: >-
                'socle.do-now.io/backup-frequency and -retention name ' + variables.pair +
                ', which is not a backup policy of this cluster: this object is not backed up' +
                ' (docs/catalog/velero.md §3)'
      - apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicyBinding
        metadata:
          name: velero-backup-labels
          annotations:
            fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
        spec:
          policyName: velero-backup-labels
          validationActions: [Warn, Audit]
