# Applied by the kube-state-metrics-rules Kustomization the module's
# ResourceSet renders, into the kube-state-metrics namespace, and pruned with
# it. The alerting module's rules sidecar reads every ConfigMap labelled
# vmalert_rules there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-state-metrics.yaml
