# kyverno's own alert rules: what awesome-prometheus-alerts does not cover
# for it (it has no Kyverno section), on the metrics it exposes — names read
# on a live cluster or in its source at the pinned version. The chart's own
# examples (prometheusRule.spec in kyverno 3.9.1's values), as written
# there; thresholds are Kyverno's.
# Checked in CI with vmalert -dryRun (.github/scripts/check-rules.sh).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: socle-kyverno
spec:
  groups:
    - name: kyverno.admission
      rules:
        - alert: KyvernoAdmissionHighLatency
          expr: >-
            histogram_quantile(0.99,
              sum(rate(kyverno_admission_review_duration_seconds_bucket[5m])) by (le)) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Kyverno admission review p99 latency is elevated
            description: >-
              Admission review p99 latency is {{ $value | humanizeDuration }},
              above the 1s threshold. Kubernetes webhooks hard-timeout at 10s.
            runbook_url: https://kyverno.io/docs/guides/monitoring/#admission-latency-high
        - alert: KyvernoAdmissionCriticalLatency
          expr: >-
            histogram_quantile(0.99,
              sum(rate(kyverno_admission_review_duration_seconds_bucket[5m])) by (le)) > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Kyverno admission review p99 latency is critically high
            description: >-
              Admission review p99 latency is {{ $value | humanizeDuration }},
              above 5s. Kubernetes webhooks hard-timeout at 10s.
            runbook_url: https://kyverno.io/docs/guides/monitoring/#admission-latency-high
    - name: kyverno.policy
      rules:
        - alert: KyvernoPolicyExecutionHighLatency
          expr: >-
            histogram_quantile(0.99,
              sum(rate(kyverno_policy_execution_duration_seconds_bucket[5m])) by (le, rule_type)) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Kyverno policy execution p99 latency is elevated
            description: >-
              {{ $labels.rule_type }} rule p99 execution latency is
              {{ $value | humanizeDuration }}.
            runbook_url: https://kyverno.io/docs/guides/monitoring/#policy-execution-latency-high
