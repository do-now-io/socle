# The controller. crds.enabled=false is the chart's documented mode for a
# cluster whose CRDs are managed elsewhere: it drops the bundled Gateway API
# CRDs (experimental channel), the bundled Envoy Gateway CRDs and the
# safe-upgrade admission policy, all of which the socle applies from their
# own vendored release files. The CRDs are applied by the Flux Kustomization
# that applies this folder, before this object.
#
# valuesFrom (the client's ConfigMap, then his Secret) is added by that
# Kustomization's patch (../resourceset.yaml). helm-controller merges
# valuesFrom in order and spec.values last, so the value below stays the
# socle's even if a client sets it — OpenTofu refuses it there anyway.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 10m
  timeout: 10m
  releaseName: envoy-gateway
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    crds:
      enabled: false
