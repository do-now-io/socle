# The Envoy Gateway controller. No inline values, by the catalog's
# convention (docs/flux-catalog.md §6): helm-controller merges spec.values
# last, over valuesFrom, so an inline default would beat the client's. The
# socle's values (crds.enabled=false among them) and the client's arrive
# through valuesFrom, which the Flux Kustomization applying this folder adds
# as a patch (../resourceset.yaml). The CRDs are applied by that same
# Kustomization, before this object.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 10m
  timeout: 10m
  releaseName: envoy-gateway
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
