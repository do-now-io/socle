# The one class name every other socle module may rely on, whatever
# implements it on the cloud (docs/catalog/gateway-api.md).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: socle
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  description: The socle's Gateway API class, implemented by Envoy Gateway.
