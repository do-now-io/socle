# The gateway_api module: the Gateway API CRDs, and one implementation per
# cloud behind a stable class name, socle. Design: docs/catalog/gateway-api.md.
#
# Three Flux Kustomizations over static folders of this artifact, rather than
# the HelmReleases inline as in hello, because ordering is the whole problem
# here: a GatewayClass cannot be applied before its CRD exists, and the
# operator applies a ResourceSet's resources as one set. The CRDs folder is
# applied by the first Kustomization; the implementation folder by the second,
# which dependsOn the first whenever this module installs the CRDs. The folders
# are read from the same OCIRepository the root already pulls and verifies, so
# nothing here adds a source or a trust root.
#
# The on/off toggle stays the reconcile annotation on each resource, as every
# module: enabled is the client's switch, install_crds and implementation pick
# which of the three exist. A disabled object is garbage-collected — except
# the CRDs, whose Kustomization has prune: false (a CRD gone takes every
# Gateway and HTTPRoute of the cluster with it; removing them is a deliberate
# act, never a side effect of a toggle).
#
# resourcesTemplate rather than resources for the same reason as the root:
# the optional dependsOn and Secret blocks are added or dropped structurally.
#
# Chart values follow the catalog's convention (docs/flux-catalog.md §6): no
# inline values on the HelmRelease, and a valuesFrom listing, in this order,
# ConfigMap/gateway-api-socle-values (the socle's defaults), then
# ConfigMap/gateway-api-client-values (kube.gateway_api.values), then the
# client's Secret when named — later wins. The HelmRelease is static in
# ./envoy-gateway, so its valuesFrom is a patch the gateway-api-envoy-gateway
# Kustomization carries; the namespace is rendered here, not in the folder,
# because the ConfigMaps must exist in it before the HelmRelease reads them.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  wait: true
  resourcesTemplate: |
    << $g := inputs.modules.gateway_api >>
    apiVersion: v1
    kind: Namespace
    metadata:
      name: envoy-gateway-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if and $g.enabled (eq $g.implementation "envoy-gateway") >>enabled<< else >>disabled<< end >>
    ---
    # The socle's own Envoy Gateway chart values, first in valuesFrom.
    # crds.enabled=false is the chart's documented mode for a cluster whose
    # CRDs are managed elsewhere: it drops the bundled Gateway API CRDs
    # (experimental channel), the bundled Envoy Gateway CRDs and the
    # safe-upgrade admission policy, all of which the socle applies from
    # their own vendored release files. OpenTofu refuses crds in the client's
    # values, so nothing later in valuesFrom can turn it back on.
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: gateway-api-socle-values
      namespace: envoy-gateway-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if and $g.enabled (eq $g.implementation "envoy-gateway") >>enabled<< else >>disabled<< end >>
    data:
      values.yaml: |
        crds:
          enabled: false
    ---
    # The client's own Envoy Gateway chart values, as he wrote them in
    # kube.gateway_api.values. OpenTofu refuses secrets in there.
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: gateway-api-client-values
      namespace: envoy-gateway-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if and $g.enabled (eq $g.implementation "envoy-gateway") >>enabled<< else >>disabled<< end >>
    data:
      values.yaml: |<< toYaml $g.values | nindent 4 >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: gateway-api-crds
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if and $g.enabled $g.install_crds >>enabled<< else >>disabled<< end >>
    spec:
      interval: 10m
      retryInterval: 1m
      timeout: 5m
      sourceRef:
        kind: OCIRepository
        name: socle
      path: ./catalog/gateway-api/crds
      prune: false
      wait: true
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: gateway-api-envoy-gateway
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if and $g.enabled (eq $g.implementation "envoy-gateway") >>enabled<< else >>disabled<< end >>
    spec:
      interval: 10m
      retryInterval: 1m
      timeout: 15m
      << if $g.install_crds >>
      dependsOn:
        - name: gateway-api-crds
      << end >>
      sourceRef:
        kind: OCIRepository
        name: socle
      path: ./catalog/gateway-api/envoy-gateway
      prune: true
      wait: true
      # The socle's values, then the client's, then his Secret when he named
      # one — created by him in envoy-gateway-system, never read by OpenTofu,
      # optional so the release does not wait for it. Later wins.
      patches:
        - target:
            kind: HelmRelease
            name: envoy-gateway
          patch: |
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: envoy-gateway
              namespace: envoy-gateway-system
            spec:
              valuesFrom:
                - kind: ConfigMap
                  name: gateway-api-socle-values
                  valuesKey: values.yaml
                - kind: ConfigMap
                  name: gateway-api-client-values
                  valuesKey: values.yaml
                << if $g.values_secret >>
                - kind: Secret
                  name: << $g.values_secret | quote >>
                  valuesKey: values.yaml
                  optional: true
                << end >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: gateway-api-cilium
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if and $g.enabled (eq $g.implementation "cilium") >>enabled<< else >>disabled<< end >>
    spec:
      interval: 10m
      retryInterval: 1m
      timeout: 5m
      << if $g.install_crds >>
      dependsOn:
        - name: gateway-api-crds
      << end >>
      sourceRef:
        kind: OCIRepository
        name: socle
      path: ./catalog/gateway-api/cilium
      prune: true
      wait: true
