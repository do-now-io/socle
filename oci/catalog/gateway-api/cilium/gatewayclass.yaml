# The class every template targets on aws and azure (inputs.gateway.className).
# Created here and not by the Cilium chart: the bootstrap module installs
# Cilium before these CRDs exist, with gatewayAPI.gatewayClass.create=false.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
  description: Gateway API on aws and azure, served by the socle's Cilium.
