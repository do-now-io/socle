# The external-secrets module: External Secrets Operator, which turns an
# ExternalSecret into a Kubernetes Secret read from the cloud's own secret
# manager, and keeps it in step when the value rotates there. Pair it with the
# reloader module for the pods that read those Secrets to roll.
# docs/catalog/external-secrets.md holds the design; the rules of
# docs/flux-catalog.md §6 apply: inputsFrom the one provider, the reconcile
# toggle on EACH resource, values tested never presence.
#
# Values, in the order helm-controller merges them, later winning
# (docs/flux-catalog.md §6): external-secrets-socle-values, the socle's
# defaults below; external-secrets-client-values, kube.external_secrets.values;
# then the client's Secret when they name one. No inline `values:` on the
# HelmRelease — helm-controller merges it last, so it would beat the client on
# every key.
#
# Cloud access (docs/catalog/external-secrets.md): on AWS with Crossplane on
# and at least one prefix, the module declares its own IAM role through
# Crossplane (docs/catalog/crossplane.md §3) — READ-ONLY, GetSecretValue and
# DescribeSecret on secret:<prefix>/* in the cluster's region for each prefix
# in kube.external_secrets.prefixes (default: the cluster name), never `*`,
# no write, no ListSecrets — bound by Pod Identity to the controller's
# ServiceAccount, and one ClusterSecretStore named secret-manager on it. On
# GCP, the same with Crossplane on and a prefix: roles/secretmanager.
# secretAccessor (versions.access, no list, no write) granted to the
# controller's own Workload Identity principal, one project-level binding per
# prefix under an IAM condition on the secret's name — no Google service
# account — and the same store on Secret Manager. Anywhere else the operator is installed alone
# and the client brings his stores.
#
# Three layers, so that each object is applied once what it needs exists:
# - this ResourceSet: the Namespace and, on AWS, the Role and the Pod
#   Identity association binding it to external-secrets/external-secrets; on
#   GCP, the ProjectIAMMembers binding that ServiceAccount's principal;
# - external-secrets-workload, a child ResourceSet holding the chart, which
#   dependsOn the Role and the association being Ready: EKS Pod Identity
#   injects the credentials at pod admission, and a pod admitted before its
#   association never gets them (docs/catalog/external-dns.md). On GCP it
#   dependsOn each binding being Ready, so that the controller never starts
#   on a principal that reads nothing yet;
# - external-secrets-store, a child ResourceSet holding the ClusterSecretStore,
#   which dependsOn the HelmRelease being Ready: the store's CRD is one the
#   chart installs, and ESO's validating webhook must answer for it to apply.
# This ResourceSet dependsOn the crossplane one, which always exists and is
# Ready trivially when Crossplane is off.
#
# resourcesTemplate rather than resources: the role, the store and the
# optional Secret entry are conditional text.
#
# Fixed by decision, not exposed through a named attribute (values can still
# override any of it):
# - the chart, from the project's own OCI repository on GHCR, pinned exactly.
# - the CRDs are kept on uninstall (helm.sh/resource-policy: keep): turning the
#   module off removes the operator, never the client's ExternalSecrets and
#   SecretStores, as the Gateway API CRDs survive gateway_api.
# - PushSecret and ClusterPushSecret are not reconciled: the socle's role is
#   read-only, and writing to the cloud from the cluster is out of v1.
# - the ServiceAccount is external-secrets in namespace external-secrets: the
#   subject the module's own cloud identity is bound to. The webhook and the
#   cert controller talk to no cloud.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  # The crossplane ResourceSet exists on every cloud; Ready when Crossplane
  # is off, and once its providers and their CRDs are Healthy when it is on.
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: crossplane
      namespace: flux-system
      ready: true
  wait: true
  resourcesTemplate: |
    << $aws := and (eq inputs.cloud "aws") inputs.modules.crossplane.enabled inputs.modules.external_secrets.prefixes ->>
    << $gcp := and (eq inputs.cloud "gcp") inputs.modules.crossplane.enabled inputs.modules.external_secrets.prefixes ->>
    << $access := or $aws $gcp ->>
    # One binding per prefix, named after it. A prefix may hold "_" and
    # capitals, which an object name may not: those, a trailing "-" and a
    # long prefix get a short hash of the prefix, so that two prefixes never
    # share a name. The default, the cluster's name, is a valid name as it
    # stands.
    << $members := list ->>
    << if $gcp ->>
    << range $p := inputs.modules.external_secrets.prefixes ->>
    << $n := $p | lower | replace "_" "-" ->>
    << if or (ne $n $p) (hasSuffix "-" $p) (gt (len $p) 40) ->>
    << $n = printf "%s-%s" ($n | trunc 37) ($p | sha1sum | trunc 8) ->>
    << end ->>
    << $members = append $members (dict "name" (printf "external-secrets-%s" $n) "prefix" $p) ->>
    << end ->>
    << end ->>
    apiVersion: v1
    kind: Namespace
    metadata:
      name: external-secrets
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
      labels:
        # The three pods run non-root, read-only, no capabilities, default
        # seccomp (the chart's own security contexts): restricted holds, and
        # pins it.
        pod-security.kubernetes.io/enforce: restricted
    << if $aws >>
    ---
    # The module's own AWS access, docs/catalog/crossplane.md §3. Under
    # /socle/<cluster>/ and carrying Crossplane's boundary when the root wired
    # one: Crossplane's own policy refuses any other role. Inline policy only.
    #
    # Read-only and scoped by name: the two calls an ExternalSecret's
    # remoteRef makes (GetSecretValue for the value, DescribeSecret for the
    # version and the metadata), on the secrets under each prefix in the
    # cluster's region. The account id is not among the inputs, so the ARN
    # names any account: the role can only ever be used in the account it
    # lives in. ListSecrets and BatchGetSecretValue are left out — they take
    # no resource scope, so they would list every secret of the account —
    # and with them dataFrom.find.
    << $arns := list ->>
    << range $p := inputs.modules.external_secrets.prefixes ->>
    << $arns = append $arns (printf "arn:aws:secretsmanager:%s:*:secret:%s/*" inputs.cluster.region $p) ->>
    << end ->>
    << $actions := list "secretsmanager:GetSecretValue" "secretsmanager:DescribeSecret" ->>
    << $read := dict "Sid" "ReadSecretsUnderThePrefixes" "Effect" "Allow" "Action" $actions "Resource" $arns ->>
    apiVersion: iam.aws.m.upbound.io/v1beta1
    kind: Role
    metadata:
      name: external-secrets
      namespace: external-secrets
      annotations:
        # IAM names are account-wide and two clusters may share an account.
        crossplane.io/external-name: << inputs.cluster.name >>-external-secrets
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        path: /socle/<< inputs.cluster.name >>/
        << if inputs.modules.crossplane.permissions_boundary >>
        permissionsBoundary: << inputs.modules.crossplane.permissions_boundary | quote >>
        << end >>
        assumeRolePolicy: |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Service": "pods.eks.amazonaws.com"},
              "Action": ["sts:AssumeRole", "sts:TagSession"]
            }]
          }
        inlinePolicy:
          - name: secretsmanager
            policy: << dict "Version" "2012-10-17" "Statement" (list $read) | toJson | quote >>
    ---
    apiVersion: eks.aws.m.upbound.io/v1beta1
    kind: PodIdentityAssociation
    metadata:
      name: external-secrets
      namespace: external-secrets
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        # Required: the socle's ClusterProviderConfig names no region, and
        # OpenTofu refuses this combination with an empty one.
        region: << inputs.cluster.region >>
        clusterName: << inputs.cluster.name >>
        namespace: external-secrets
        serviceAccount: external-secrets
        roleArnRef:
          name: external-secrets
    << end >>
    << if $gcp >>
    << $principal := printf "%s/projects/%s/locations/global/workloadIdentityPools/%s.svc.id.goog/subject/ns/%s/sa/%s"
      "principal://iam.googleapis.com" inputs.cluster.projectNumber inputs.cluster.projectId
      "external-secrets" "external-secrets" ->>
    << range $m := $members >>
    ---
    # The module's own GCP access, docs/catalog/crossplane.md §2: a binding
    # of the controller's own principal, Workload Identity on
    # external-secrets/external-secrets, no Google service account.
    # Crossplane may grant only the roles the client listed in
    # gcp.crossplane.allowed_roles: without roles/secretmanager.secretAccessor
    # there, IAM refuses this binding and it never turns Ready.
    #
    # Read-only and scoped by name, as on AWS: secretAccessor is
    # versions.access — the value, never the metadata, never a write — on
    # the secrets whose name starts with the prefix. Its other two
    # permissions, resourcemanager.projects.get and list, act on the project,
    # whose name never starts with a secret's path: the condition voids them.
    # A secret's binding cannot name a prefix (a SecretIAMMember is one
    # secret), so the role is bound on the project under an IAM condition on
    # resource.name, which Secret Manager presents as
    # projects/<number>/secrets/<name>[/versions/<version>] — the project's
    # number, not its id — so that the condition holds for a secret and every
    # version of it. ListSecrets is not there, and with it dataFrom.find, as
    # on AWS.
    #
    # One binding per prefix rather than one condition ORing them: a
    # binding's condition cannot change in place, so adding a prefix would
    # otherwise remove and re-create the module's whole access.
    apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
    kind: ProjectIAMMember
    metadata:
      name: << $m.name >>
      namespace: external-secrets
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        project: << inputs.cluster.projectId >>
        role: roles/secretmanager.secretAccessor
        member: << $principal >>
        condition:
          # Titles need not be unique; the cluster's name tells two clusters'
          # bindings apart in the project's policy.
          title: << printf "socle-%s-%s" inputs.cluster.name $m.prefix | trunc 100 | quote >>
          expression: << printf "resource.name.startsWith('projects/%s/secrets/%s')" inputs.cluster.projectNumber $m.prefix | quote >>
    << end >>
    << end >>
    ---
    # The workload, in a child ResourceSet so that it can wait on the
    # association (on GCP, the bindings) explicitly: a managed resource not
    # yet created carries no Ready condition at all, which a step's health
    # check reads as healthy.
    apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSet
    metadata:
      name: external-secrets-workload
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
    spec:
      << if $aws >>
      dependsOn:
        - apiVersion: iam.aws.m.upbound.io/v1beta1
          kind: Role
          name: external-secrets
          namespace: external-secrets
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        - apiVersion: eks.aws.m.upbound.io/v1beta1
          kind: PodIdentityAssociation
          name: external-secrets
          namespace: external-secrets
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      << else if $gcp >>
      dependsOn:
        << range $m := $members >>
        - apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
          kind: ProjectIAMMember
          name: << $m.name >>
          namespace: external-secrets
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        << end >>
      << end >>
      wait: true
      resources:
      - apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: external-secrets-chart
          namespace: external-secrets
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: oci://ghcr.io/external-secrets/charts/external-secrets
          layerSelector:
            mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
            operation: copy
          ref:
            tag: 2.11.0  # appVersion v2.11.0
      # The socle's defaults. Everything the client may override through values.
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: external-secrets-socle-values
          namespace: external-secrets
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            fullnameOverride: external-secrets
            installCRDs: true
            crds:
              annotations:
                helm.sh/resource-policy: keep
            serviceAccount:
              create: true
              name: external-secrets
            # The role is read-only; nothing in the cluster writes to the cloud.
            processPushSecret: false
            processClusterPushSecret: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            # Scraped by the otel_gateway module, which reads these annotations.
            podAnnotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8080"
            webhook:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
            certController:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
      # The client's own chart values, as written in kube.external_secrets.values.
      # OpenTofu refuses secrets in there.
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: external-secrets-client-values
          namespace: external-secrets
          labels:
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml inputs.modules.external_secrets.values | nindent 8 >>
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: external-secrets
          namespace: external-secrets
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: external-secrets
          chartRef:
            kind: OCIRepository
            name: external-secrets-chart
          # Merged in this order, later wins; nothing inline after them. The
          # client's Secret needs the reconcile.fluxcd.io/watch: Enabled label
          # too for a change to apply before the next interval.
          valuesFrom:
            - kind: ConfigMap
              name: external-secrets-socle-values
              valuesKey: values.yaml
            - kind: ConfigMap
              name: external-secrets-client-values
              valuesKey: values.yaml
            << if inputs.modules.external_secrets.values_secret >>
            - kind: Secret
              name: << inputs.modules.external_secrets.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
          install:
            remediation:
              retries: 3
          upgrade:
            remediation:
              retries: 3
    << if $access >>
    ---
    # The socle's one store, on the module's own access: no auth block, so
    # the controller's default credential chain — the Pod Identity
    # association above, or on GCP the pod's own Workload Identity principal
    # through the metadata server. A ClusterSecretStore, so every namespace
    # may reference it: the IAM prefixes, not the store, bound what it reads
    # (docs/catalog/external-secrets.md). Per-namespace SecretStores, and
    # stores on other backends, are the client's.
    apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSet
    metadata:
      name: external-secrets-store
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
    spec:
      dependsOn:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          name: external-secrets
          namespace: external-secrets
          ready: true
      wait: true
      resources:
      - apiVersion: external-secrets.io/v1
        kind: ClusterSecretStore
        metadata:
          name: secret-manager
        spec:
          provider:
            << if $aws >>
            aws:
              service: SecretsManager
              region: << inputs.cluster.region >>
            << else >>
            # Global secrets: no location, as the bindings' condition names
            # projects/<number>/secrets/…, never a regional secret's
            # projects/<number>/locations/<region>/secrets/….
            gcpsm:
              projectID: << inputs.cluster.projectId >>
            << end >>
    << end >>
