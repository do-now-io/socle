# The external-secrets module: External Secrets Operator, which turns an
# ExternalSecret into a Kubernetes Secret read from the cloud's own secret
# manager, and keeps it in step when the value rotates there. Pair it with the
# reloader module for the pods that read those Secrets to roll.
# docs/catalog/external-secrets.md is the module's page; the rules of
# docs/reference/catalog-module-standard.md apply: inputsFrom the one provider, the reconcile
# toggle on EACH resource, values tested never presence.
#
# What is the same on every cloud. On aws the module's own IAM role and the
# socle's ClusterSecretStore on it are aws's, in
# oci/clusters/aws/external-secrets/patch.yaml; on gcp its Secret Manager
# bindings for the controller's own principal and the same store, in
# oci/clusters/gcp/external-secrets/patch.yaml: each a step named cloud
# inserted before workload, and a step named store after it
# (docs/decisions/socle.md, SOCLE-32). Anywhere else the operator is
# installed alone and the client brings his stores
# (docs/catalog/external-secrets.md).
#
# Values, in the order helm-controller merges them, later winning
# (docs/decisions/socle.md#socle-06-the-clients-values-win): external-secrets-socle-values, the socle's
# defaults below; external-secrets-cloud-values, the cloud step's;
# external-secrets-client-values, kube.external_secrets.values; then the
# client's Secret when they name one. No inline `values:` on the
# HelmRelease — helm-controller merges it last, so it would beat the client on
# every key.
#
# Steps, each applied once the one before is healthy: namespace, then
# workload — the chart. A cloud's step between them is healthy only once
# what the pod needs from the cloud is there.
#
# resourcesTemplate rather than resources: the optional Secret entry is
# conditional text.
#
# Fixed by decision, not exposed through a named attribute (values can still
# override any of it):
# - the chart, from the project's own OCI repository on GHCR, pinned exactly.
# - the CRDs are kept on uninstall (helm.sh/resource-policy: keep): turning the
#   module off removes the operator, never the client's ExternalSecrets and
#   SecretStores, as the Gateway API CRDs survive gateway_api.
# - PushSecret and ClusterPushSecret are not reconciled: the socle's role is
#   read-only, and writing to the cloud from the cluster is out of v1.
# - the ServiceAccount is external-secrets in namespace external-secrets: the
#   subject the module's own cloud identity is bound to. The webhook and the
#   cert controller talk to no cloud.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  wait: true
  steps:
    - name: namespace
      resourcesTemplate: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: external-secrets
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
          labels:
            # The three pods run non-root, read-only, no capabilities, default
            # seccomp (the chart's own security contexts): restricted holds, and
            # pins it.
            pod-security.kubernetes.io/enforce: restricted
    - name: workload
      resourcesTemplate: |
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: external-secrets-chart
          namespace: external-secrets
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: oci://ghcr.io/external-secrets/charts/external-secrets
          layerSelector:
            mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
            operation: copy
          ref:
            tag: 2.13.0  # appVersion v2.13.0
        ---
        # The socle's defaults. Everything the client may override through values.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: external-secrets-socle-values
          namespace: external-secrets
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            fullnameOverride: external-secrets
            installCRDs: true
            crds:
              annotations:
                helm.sh/resource-policy: keep
            serviceAccount:
              create: true
              name: external-secrets
            # The role is read-only; nothing in the cluster writes to the cloud.
            processPushSecret: false
            processClusterPushSecret: false
            # Each of the three containers states cpu, memory and
            # ephemeral-storage, on every cloud: GKE Autopilot reserves
            # 500m, 2Gi and 1Gi for a container that leaves one out. 64Mi of
            # disk, a long-running container's, none writes to an emptyDir.
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
                ephemeral-storage: 64Mi
              limits:
                memory: 256Mi
            # The controller's, the webhook's and the cert controller's metrics
            # Services, scraped by monitoring/scrape.yaml while the monitoring
            # module is on: the series carry service, which the chart's
            # dashboard filters on.
            metrics:
              service:
                enabled: << inputs.modules.monitoring.enabled >>
            # The chart's own dashboard, a ConfigMap labelled for Grafana's
            # sidecar; only while Grafana runs to read it.
            grafanaDashboard:
              enabled: << and inputs.modules.monitoring.enabled inputs.modules.monitoring.grafana.enabled >>
              sidecarLabel: grafana_dashboard
              sidecarLabelValue: "1"
            webhook:
              metrics:
                service:
                  enabled: << inputs.modules.monitoring.enabled >>
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 64Mi
                limits:
                  memory: 128Mi
            certController:
              metrics:
                service:
                  enabled: << inputs.modules.monitoring.enabled >>
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 64Mi
                limits:
                  memory: 128Mi
        ---
        # The client's own chart values, as written in kube.external_secrets.values.
        # OpenTofu refuses secrets in there.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: external-secrets-client-values
          namespace: external-secrets
          labels:
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml inputs.modules.external_secrets.values | nindent 8 >>
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: external-secrets
          namespace: external-secrets
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: external-secrets
          chartRef:
            kind: OCIRepository
            name: external-secrets-chart
          # Merged in this order, later wins; nothing inline after them. The
          # client's Secret needs the reconcile.fluxcd.io/watch: Enabled label
          # too for a change to apply before the next interval.
          valuesFrom:
            - kind: ConfigMap
              name: external-secrets-socle-values
              valuesKey: values.yaml
            # The cloud step's, when the cloud has values for the chart.
            - kind: ConfigMap
              name: external-secrets-cloud-values
              valuesKey: values.yaml
              optional: true
            - kind: ConfigMap
              name: external-secrets-client-values
              valuesKey: values.yaml
            << if inputs.modules.external_secrets.values_secret >>
            - kind: Secret
              name: << inputs.modules.external_secrets.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
          install:
            remediation:
              retries: 3
          upgrade:
            remediation:
              retries: 3
        << $monitored := and inputs.modules.external_secrets.enabled inputs.modules.monitoring.enabled ->>
        ---
        # The module's monitoring — its alert rules and its dashboard, from
        # monitoring/ in the socle artifact: VMRules and a ConfigMap Grafana's
        # sidecar loads. Present only while both this module and the monitoring
        # module are on: monitoring brings the VMRule CRD, and until it has the
        # Kustomization fails and retries every minute
        # (docs/decisions/monitoring.md, MONITORING-12).
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: external-secrets-monitoring
          namespace: flux-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if $monitored >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          retryInterval: 1m
          sourceRef:
            kind: OCIRepository
            name: socle
          path: ./catalog/external-secrets/monitoring
          targetNamespace: external-secrets
          prune: true
          wait: true
          timeout: 2m
