# The external_dns module's proof (docs/catalog/external-dns.md). Off by
# default, so `health` proves the disabled shape only. The `module` phase, on
# aws, in two halves:
#
# 1. Against floci's Route 53, with Crossplane off: a fake hosted zone and
#    the external-dns-aws Secret (static test keys, floci's endpoint as a pod
#    sees it: $values.floci_ip) — the seam a client without Crossplane uses
#    too; then the module on through a patch of the ResourceSetInputProvider,
#    as kube.external_dns would set it. kube.external_dns.values overrides the
#    socle's txtOwnerId (a key the socle sets, so the precedence is proven),
#    an Ingress becomes an A record and an ExternalName Service a CNAME, each
#    with a socle- TXT naming the client's owner; upsert-only keeps a record
#    whose source is gone; policy = "sync" deletes it and keeps the CNAME.
#    Reading a record back from floci's Route 53 is the one `script` here.
# 2. The module's own AWS access, with Crossplane on: its Role reaches
#    floci's IAM under /socle/<cluster>/ with the route53 policy scoped to
#    domain_filters — proven from what Crossplane reports — and the workload
#    is withheld while the association is not Ready. The two floci seams
#    (providerConfigRef: floci, the association never syncing) are steps of
#    their own, to delete the day floci serves Pod Identity.
#
# Not provable on floci: the association reaching EKS, the pod getting the
# role's credentials, IAM enforcing the policy and the boundary — the
# sandbox's (docs/catalog/external-dns.md).
#
# On gcp, the module's own access and a record in Cloud DNS are proven by
# hand on the sandbox's GKE: external-dns-module-gcp, last in this file.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-dns-health
  labels:
    phase: health
    cloud: any
    platform: any
spec:
  description: Off by default, the ResourceSet is Ready and renders nothing.
  timeouts:
    assert: 3m
    error: 1m
  steps:
    - name: the ResourceSet is Ready with nothing in its inventory
      try:
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: external-dns
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries || `[]`)): 0
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: external-dns
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: external-dns
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-dns-module-aws
  labels:
    phase: module
    cloud: aws
    platform: any
spec:
  description: >-
    Records into a fake Route 53 with the client's owner, kept under upsert-only,
    deleted under sync; then the module's own IAM role through Crossplane.
  timeouts:
    assert: 5m
    error: 3m
    exec: 3m
    delete: 3m
  steps:
    - name: a fake hosted zone, and the external-dns-aws Secret pointing the pod at floci
      try:
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: ZONE
                value: ($values.zone)
            content: |
              id="$(aws route53 list-hosted-zones-by-name --dns-name "$ZONE" --query "HostedZones[?Name=='$ZONE.'].Id | [0]" --output text)"
              [ "$id" != None ] || aws route53 create-hosted-zone --name "$ZONE" --caller-reference "socle-e2e-$(date +%s)" > /dev/null
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: external-dns
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: external-dns-aws
                namespace: external-dns
              stringData:
                AWS_ACCESS_KEY_ID: test
                AWS_SECRET_ACCESS_KEY: test
                AWS_ENDPOINT_URL: (join('', ['http://', $values.floci_ip, ':4566']))
    # Crossplane off, stated: with it on, the module renders its Role and
    # association first and withholds the chart until the association is
    # Ready — which floci never grants (second half of this test).
    - name: enabled through kube, the client's txtOwnerId wins over the socle's
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    crossplane:
                      enabled: false
                    external_dns:
                      enabled: true
                      domain_filters:
                        - ($values.zone)
                      values:
                        txtOwnerId: ($values.owner)
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: external-dns
                namespace: external-dns
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                template:
                  spec:
                    (containers[?name == 'external-dns'] || `[]`):
                      - (contains(args || `[]`, '--policy=upsert-only')): true
                        (contains(args || `[]`, join('', ['--txt-owner-id=', $values.owner]))): true
                        (contains(args || `[]`, join('', ['--domain-filter=', $values.zone]))): true
                        (contains(args || `[]`, '--txt-prefix=socle-')): true
                        # gateway_api is on: the HTTPRoute source is added.
                        (contains(args || `[]`, '--source=gateway-httproute')): true
                        (contains(args || `[]`, '--source=ingress')): true
                        (contains(args || `[]`, '--source=service')): true
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: external-dns
            name: external-dns
        - events:
            namespace: external-dns
        - podLogs:
            namespace: external-dns
            tail: 40
    # external-dns 0.22 reads external-dns.kubernetes.io/ annotations; the
    # older external-dns.alpha.kubernetes.io/ prefix is ignored.
    - name: an Ingress becomes an A record and an ExternalName Service a CNAME, each with the client's TXT
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: e2e-dns
        - apply:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: app
                namespace: e2e-dns
                annotations:
                  external-dns.kubernetes.io/target: 203.0.113.10
              spec:
                rules:
                  - host: (join('.', ['app', $values.zone]))
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: app
                              port:
                                number: 80
        - apply:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: legacy
                namespace: e2e-dns
                annotations:
                  external-dns.kubernetes.io/hostname: (join('.', ['legacy', $values.zone]))
              spec:
                type: ExternalName
                externalName: backend.example.org
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: ZONE
                value: ($values.zone)
              - name: OWNER
                value: ($values.owner)
            content: |
              . ./records.sh
              want app A 203.0.113.10
              want legacy CNAME backend.example.org
              want socle-a-app TXT "external-dns/owner=$OWNER"
              want socle-cname-legacy TXT "external-dns/owner=$OWNER"
      catch:
        - podLogs:
            namespace: external-dns
            tail: 40
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: ZONE
                value: ($values.zone)
            content: |
              . ./records.sh
              aws route53 list-resource-record-sets --hosted-zone-id "$(zone_id)" --output table
    # One full interval (1m) and more: with upsert-only nothing is deleted,
    # however many loops run.
    - name: upsert-only keeps a record whose source is gone
      try:
        - delete:
            ref:
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              name: app
              namespace: e2e-dns
        - sleep:
            duration: 75s
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: ZONE
                value: ($values.zone)
            content: |
              . ./records.sh
              [ -n "$(record app A)" ] || { echo "upsert-only deleted app.$ZONE"; exit 1; }
              echo "app.$ZONE A kept under upsert-only: $(record app A)"
    # A new policy reaches the chart through the socle-values ConfigMap
    # (labelled for helm-controller's watch), so the Deployment's args change.
    - name: policy = "sync" deletes it, and keeps the CNAME whose source still exists
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    external_dns:
                      policy: sync
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                template:
                  spec:
                    (containers[?name == 'external-dns'] || `[]`):
                      - (contains(args || `[]`, '--policy=sync')): true
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        # The upgrade itself must have returned before the module is turned
        # off below: helm-controller honours a deletion only once the running
        # action does, and Helm's --wait was still watching this rollout when
        # the namespace went — five minutes, to the second, on three runs
        # (docs/flux-catalog.md §8). A client flipping a module off right
        # after a values change sees the same.
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: external-dns
                namespace: external-dns
              status:
                lastAttemptedReleaseAction: upgrade
                (conditions[?type == 'Released'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (history[0].version): 2
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: ZONE
                value: ($values.zone)
            content: |
              . ./records.sh
              want app A absent
              want socle-a-app TXT absent
              want legacy CNAME backend.example.org
      catch:
        - podLogs:
            namespace: external-dns
            tail: 40
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: external-dns
            name: external-dns
    # The order of valuesFrom, proven whole (docs/flux-catalog.md §6): the
    # socle's document, then kube.external_dns.values, then the Secret the client
    # names in values_secret — created by him in the module's namespace, never
    # read by OpenTofu, merged last. 80Mi in values and 96Mi in the Secret:
    # the live object carries the Secret's; both cleared, the socle's 64Mi.
    - name: kube.external_dns.values_secret is merged last, over values and the socle
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: external-dns-e2e-values
                namespace: external-dns
                labels:
                  reconcile.fluxcd.io/watch: Enabled
              stringData:
                values.yaml: |
                  resources:
                    requests:
                      memory: 96Mi
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    external_dns:
                      values_secret: external-dns-e2e-values
                      values:
                        resources:
                          requests:
                            memory: 80Mi
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                template:
                  spec:
                    (containers[?name == 'external-dns'] || `[]`):
                      - resources:
                          requests:
                            memory: 96Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    external_dns:
                      values_secret: ''
                      values:
                        resources: null
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                template:
                  spec:
                    (containers[?name == 'external-dns'] || `[]`):
                      - resources:
                          requests:
                            memory: 64Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - delete:
            ref:
              apiVersion: v1
              kind: Secret
              name: external-dns-e2e-values
              namespace: external-dns
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: external-dns
            name: external-dns
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
    # The named attribute behind the socle's default: txt_owner_id feeds
    # txtOwnerId in the socle's document (the cluster name by default). With
    # the client's values override gone, it is what the pod runs with.
    - name: kube.external_dns.txt_owner_id reaches the Deployment once values no longer override it
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    external_dns:
                      txt_owner_id: socle-e2e-owner
                      values:
                        txtOwnerId: null
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                template:
                  spec:
                    (containers[?name == 'external-dns'] || `[]`):
                      - (contains(args || `[]`, '--txt-owner-id=socle-e2e-owner')): true
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    external_dns:
                      txt_owner_id: ($values.socle_owner)
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                template:
                  spec:
                    (containers[?name == 'external-dns'] || `[]`):
                      - (contains(args || `[]`, join('', ['--txt-owner-id=', $values.socle_owner]))): true
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: external-dns
            name: external-dns
    # The namespace goes last: its HelmRelease is uninstalled first, then
    # the pod terminates. 73 s on one run, over 3 minutes on the next (run
    # 36776210485): 5 minutes, and the catch says what held it.
    - name: enabled = false garbage-collects the module
      timeouts:
        error: 5m
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: e2e-dns
        # The release must be idle before the module goes: helm-controller
        # honours a deletion only once the running action returns, and the
        # values steps above have just driven an upgrade — turned off under
        # Helm's --wait, the namespace is garbage-collected, the rollout can
        # never finish, and the deletion waits the release's whole timeout
        # (five minutes, measured four times on external-dns).
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: external-dns
                namespace: external-dns
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Released'] || `[]`):
                  - status: 'True'
                (length(conditions[?type == 'Reconciling'] || `[]`)): 0
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    external_dns:
                      enabled: false
                      policy: upsert-only
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: external-dns
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries || `[]`)): 0
        - error:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: external-dns
                namespace: external-dns
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: external-dns
      catch:
        - describe:
            apiVersion: v1
            kind: Namespace
            name: external-dns
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: external-dns
            name: external-dns
        - describe:
            apiVersion: v1
            kind: Pod
            namespace: external-dns
        - events:
            namespace: external-dns
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: external-dns
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
        - podLogs:
            namespace: flux-system
            selector: app.kubernetes.io/name=flux-operator
            tail: 40
      # Printed on success too: the step took 10 s on one run and 5 minutes
      # on the next (36780176320), and helm-controller's log is the one place
      # that says what the release was doing meanwhile.
      finally:
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 60
    # Second half: the module's own AWS access (docs/catalog/crossplane.md
    # §3), with Crossplane on and the client's domain_filters.
    - name: with Crossplane on, the module declares its Role and its association
      # 99 s cold (docs/catalog/crossplane.md §7); ~5 min when the providers
      # re-adopt CRDs a previous install left behind.
      timeouts:
        assert: 8m
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    crossplane:
                      enabled: true
                      # The boundary the root wires from the foundations: the
                      # Role must carry it. floci ignores it at IAM; the object
                      # is what is asserted (docs/catalog/crossplane.md §7).
                      permissions_boundary: arn:aws:iam::000000000000:policy/socle-e2e-catalog-crossplane-boundary
                    external_dns:
                      enabled: true
                      values:
                        txtOwnerId: null
        # In the order their CRDs appear — an assert on a kind whose CRD is
        # not there yet fails at once: the release (core, which applies the
        # pkg CRDs), the IAM provider Healthy (which applies the iam CRDs),
        # then the module's objects. The ResourceSet's Ready is stale right
        # after the patch, so it is not what is waited on.
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: crossplane
                namespace: crossplane-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: pkg.crossplane.io/v1
              kind: Provider
              metadata:
                name: provider-aws-iam
              status:
                (conditions[?type == 'Healthy'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: pkg.crossplane.io/v1
              kind: Provider
              metadata:
                name: provider-aws-eks
              status:
                (conditions[?type == 'Healthy'] || `[]`):
                  - status: 'True'
        # A Provider is Healthy before every CRD it brings is served, and an
        # assert on a kind not served yet fails at once (run 36983797132,
        # once the S3 provider joined the family): the CRDs Established first.
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: roles.iam.aws.m.upbound.io
              status:
                (conditions[?type == 'Established'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: podidentityassociations.eks.aws.m.upbound.io
              status:
                (conditions[?type == 'Established'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: external-dns
                namespace: external-dns
                annotations:
                  crossplane.io/external-name: (join('', [$values.socle_owner, '-external-dns']))
              spec:
                forProvider:
                  path: (join('', ['/socle/', $values.socle_owner, '/']))
                  permissionsBoundary: arn:aws:iam::000000000000:policy/socle-e2e-catalog-crossplane-boundary
        - assert:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: external-dns
                namespace: external-dns
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
        - describe:
            apiVersion: pkg.crossplane.io/v1
            kind: Provider
        - events:
            namespace: crossplane-system
        - podLogs:
            namespace: crossplane-system
            tail: 40
    # floci seam: the module leaves providerConfigRef at its default, the
    # socle's Pod Identity ClusterProviderConfig, which floci cannot serve.
    # floci's own is named after the fact. Deleted the day floci serves Pod
    # Identity.
    # skipDelete: the last step removes these two itself, before Crossplane
    # goes — Chainsaw's own cleanup would run after, when no provider is left
    # to release the ClusterProviderConfig, and time out.
    - name: 'floci seam: a ClusterProviderConfig with static keys, and the module''s resources pointed at it'
      skipDelete: true
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: floci-credentials
                namespace: crossplane-system
              stringData:
                credentials: |
                  [default]
                  aws_access_key_id = test
                  aws_secret_access_key = test
        - apply:
            resource:
              apiVersion: aws.m.upbound.io/v1beta1
              kind: ClusterProviderConfig
              metadata:
                name: floci
              spec:
                credentials:
                  source: Secret
                  secretRef:
                    namespace: crossplane-system
                    name: floci-credentials
                    key: credentials
                endpoint:
                  hostnameImmutable: true
                  services: [iam, eks, sts]
                  url:
                    type: Static
                    static: (join('', ['http://', $values.floci_ip, ':4566']))
                skip_credentials_validation: true
                skip_metadata_api_check: true
                skip_region_validation: true
                skip_requesting_account_id: true
        - patch:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: floci
        - patch:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: floci
    - name: the Role becomes an IAM role under /socle/<cluster>/ with the route53 policy scoped to domain_filters
      try:
        - assert:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: external-dns
                namespace: external-dns
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                atProvider:
                  arn: arn:aws:iam::000000000000:role/socle/socle-e2e-catalog/socle-e2e-catalog-external-dns
                  (contains(assumeRolePolicy || '', 'pods.eks.amazonaws.com')): true
                  (inlinePolicy[?name == 'route53'] || `[]`):
                    - (contains(policy || '', 'route53:ChangeResourceRecordSetsNormalizedRecordNames')): true
                      (contains(policy || '', join('', ['"*.', $values.zone, '"']))): true
                      (contains(policy || '', 'route53:ListHostedZones')): true
      catch:
        - describe:
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            namespace: external-dns
            name: external-dns
        - podLogs:
            namespace: crossplane-system
            selector: pkg.crossplane.io/provider=provider-aws-iam
            tail: 40
    # floci seam, second half: the association never syncs (floci 2.1.0 has
    # no association API), so the workload's dependsOn is never met and the
    # chart must never have been applied: one full minute after the Role
    # turned into IAM, still no HelmRelease. Asserted as such so that the day
    # it syncs this step fails and goes with the seam above.
    - name: 'floci seam: the association cannot sync, so the workload is withheld'
      try:
        - assert:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: external-dns
                namespace: external-dns
              status:
                (conditions[?type == 'Synced'] || `[]`):
                  - status: 'False'
        - sleep:
            duration: 60s
        - error:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: external-dns
                namespace: external-dns
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: external-dns-workload
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'False'
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: external-dns-workload
        - describe:
            apiVersion: eks.aws.m.upbound.io/v1beta1
            kind: PodIdentityAssociation
            namespace: external-dns
            name: external-dns
    # The association's finalizer waits on an API floci does not have:
    # released by hand, the only thing done here a real cluster does not
    # need. Then the module off deletes the IAM role and the namespace goes;
    # Crossplane off last (docs/catalog/external-dns.md: turning both off at
    # once leaves the managed resources with no provider to delete them).
    - name: off, the IAM role is deleted and the namespace goes
      try:
        - patch:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: external-dns
                namespace: external-dns
                finalizers: []
        # No idle gate here: with Crossplane on and floci's association never
        # Ready, the workload is withheld — there is no release to wait for.
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    external_dns:
                      enabled: false
                      domain_filters: []
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: external-dns
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
            content: |
              for _ in $(seq 1 30); do
                aws iam get-role --role-name socle-e2e-catalog-external-dns > /dev/null 2>&1 || exit 0
                sleep 2
              done
              echo "IAM role socle-e2e-catalog-external-dns survived the module turned off"; exit 1
        - delete:
            ref:
              apiVersion: aws.m.upbound.io/v1beta1
              kind: ClusterProviderConfig
              name: floci
        - delete:
            ref:
              apiVersion: v1
              kind: Secret
              name: floci-credentials
              namespace: crossplane-system
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    crossplane:
                      enabled: false
                      permissions_boundary: ''
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: crossplane-system
      catch:
        - describe:
            apiVersion: v1
            kind: Namespace
            name: external-dns
        - describe:
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            namespace: external-dns
            name: external-dns
        - podLogs:
            namespace: flux-system
            selector: app.kubernetes.io/name=flux-operator
            tail: 40
---
# The GCP proof, run by hand against the sandbox's GKE Autopilot (no GKE in
# CI: floci-gcp serves neither Workload Identity nor Cloud DNS). As the
# crossplane module's GCP test does, it reads the module as the sandbox's root
# sets it and turns nothing off: kube.external_dns on with a domain filter,
# Crossplane on, and that filter's zone in the foundations'
# gcp.crossplane.dns_zones. Every name it needs — project, zone, domain — is
# read from the socle's ResourceSetInputProvider, so nothing here names the
# sandbox.
#
# What it proves: each binding is the module's own principal, Crossplane
# made it in GCP, the workload waited for them, and a name reaches Cloud DNS
# and the internet. A resolver outside the cluster is the witness, in a Job
# the test asserts Complete: `host` exits non-zero until the CNAME resolves.
# What it leaves: under upsert-only the record outlives its Service (one
# CNAME and its TXT per run, named after the run's namespace); with
# policy = "sync" on the sandbox, external-dns removes both.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-dns-module-gcp
  labels:
    phase: module
    cloud: gcp
    platform: gke
spec:
  description: >-
    The module's IAM members on its zones and its project, bound to its own
    principal; the workload on Cloud DNS after them; a name resolvable from
    the internet.
  timeouts:
    # Autopilot provisions a node for a pod that does not fit, minutes before
    # the workload can turn Ready.
    assert: 10m
    error: 3m
  bindings:
    - name: inputs
      value: (x_k8s_get($client, 'fluxcd.controlplane.io/v1', 'ResourceSetInputProvider', 'flux-system', 'socle').spec.defaultValues)
    - name: project
      value: ($inputs.cluster.projectId)
    - name: principal
      value: >-
        (join('', ['principal://iam.googleapis.com/projects/', $inputs.cluster.projectNumber,
        '/locations/global/workloadIdentityPools/', $project, '.svc.id.goog/subject/ns/external-dns/sa/external-dns']))
    # The sandbox lists one zone; the count of members is asserted below
    # against the whole list, the fields on the first.
    - name: zone
      value: ($inputs.modules.crossplane.dns_zones[0])
    - name: domain
      value: ($inputs.modules.external_dns.domain_filters[0])
    - name: hostname
      value: (join('.', [$namespace, $domain]))
  steps:
    - name: each IAM member is Ready, the module's own principal on its zone and on the project
      try:
        - assert:
            resource:
              apiVersion: dns.gcp.m.upbound.io/v1beta1
              kind: ManagedZoneIAMMember
              metadata:
                name: (join('-', ['external-dns', $zone]))
                namespace: external-dns
              spec:
                forProvider:
                  project: ($project)
                  managedZone: ($zone)
                  role: roles/dns.admin
                  member: ($principal)
              status:
                # What GCP holds, as Crossplane read it back.
                atProvider:
                  role: roles/dns.admin
                  member: ($principal)
                (conditions[?type == 'Synced'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                forProvider:
                  project: ($project)
                  role: ($inputs.modules.crossplane.dns_zone_lister_role)
                  member: ($principal)
              status:
                atProvider:
                  role: ($inputs.modules.crossplane.dns_zone_lister_role)
                  member: ($principal)
                (conditions[?type == 'Synced'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        # One member per listed zone and the project's, each waited on.
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: external-dns-workload
                namespace: flux-system
              spec:
                (length(dependsOn[?kind == 'ManagedZoneIAMMember'])): (length($inputs.modules.crossplane.dns_zones))
                (length(dependsOn[?kind == 'ProjectIAMMember'])): 1
      catch:
        - describe:
            apiVersion: dns.gcp.m.upbound.io/v1beta1
            kind: ManagedZoneIAMMember
            namespace: external-dns
        - describe:
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectIAMMember
            namespace: external-dns
        - podLogs:
            namespace: crossplane-system
            selector: pkg.crossplane.io/provider=provider-gcp-dns
            tail: 40
        - podLogs:
            namespace: crossplane-system
            selector: pkg.crossplane.io/provider=provider-gcp-cloudplatform
            tail: 40
    # No Google service account between the pod and Cloud DNS: the
    # ServiceAccount is the principal the members name, with no
    # iam.gke.io/gcp-service-account annotation to swap it for another.
    - name: the workload runs on Cloud DNS in the cluster's project, as its own ServiceAccount
      try:
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: external-dns
                namespace: external-dns
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: external-dns
                namespace: external-dns
                (contains(keys(annotations || `{}`), 'iam.gke.io/gcp-service-account')): false
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: external-dns
                namespace: external-dns
              spec:
                template:
                  spec:
                    serviceAccountName: external-dns
                    (containers[?name == 'external-dns'] || `[]`):
                      - (contains(args || `[]`, '--provider=google')): true
                        (contains(args || `[]`, join('', ['--google-project=', $project]))): true
                        (contains(args || `[]`, '--google-zone-visibility=public')): true
                        (contains(args || `[]`, join('', ['--domain-filter=', $domain]))): true
                        (contains(args || `[]`, '--registry=txt')): true
                        (contains(args || `[]`, '--txt-prefix=socle-')): true
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: external-dns
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: external-dns-workload
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: external-dns
            name: external-dns
        - events:
            namespace: external-dns
        - podLogs:
            namespace: external-dns
            tail: 40
    # An ExternalName Service becomes a CNAME, the shape every non-AWS cloud
    # gives a hostname (and the reason for the socle- TXT prefix). The name
    # is the run's namespace, so a record an earlier run left under
    # upsert-only cannot pass for this one. The wait before the lookup keeps
    # the resolver from caching an NXDOMAIN for the zone's negative TTL
    # (five minutes on Cloud DNS's default SOA); a Job that still fails is
    # retried with backoff.
    - name: a Service's name becomes a CNAME in Cloud DNS, resolvable from the internet
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: legacy
                annotations:
                  external-dns.kubernetes.io/hostname: ($hostname)
              spec:
                type: ExternalName
                externalName: backend.example.org
        - sleep:
            duration: 45s
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: resolve
              spec:
                backoffLimit: 8
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: host
                        image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.7
                        command:
                          - host
                          - -t
                          - CNAME
                          - ($hostname)
                          - 8.8.8.8
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
        - assert:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: resolve
              status:
                (conditions[?type == 'Complete'] || `[]`):
                  - status: 'True'
      catch:
        - podLogs:
            namespace: external-dns
            tail: 60
        - podLogs:
            selector: job-name=resolve
            tail: 20
        - describe:
            apiVersion: batch/v1
            kind: Job
            name: resolve
