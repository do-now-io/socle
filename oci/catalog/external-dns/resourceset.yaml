# The external-dns module: one Deployment that reads Services, Ingresses and
# Gateway API HTTPRoutes and publishes their names into the cloud's DNS zone.
# docs/catalog/external-dns.md holds the design; the rules of docs/flux-catalog.md
# §6 apply: inputsFrom the one provider, the reconcile toggle on EACH resource,
# values tested never presence.
#
# Values, in the order helm-controller merges them, later winning
# (docs/flux-catalog.md §6): external-dns-socle-values, the socle's defaults
# below; external-dns-client-values, kube.external_dns.values; then the
# client's Secret when they name one. No inline `values:` on the HelmRelease —
# helm-controller merges it last, so it would beat the client on every key.
#
# The cloud is chosen here, under `<< if eq inputs.cloud … >>` inside the
# socle-values document, not by a clusters/<cloud>/ patch: the values are a
# YAML document inside a ConfigMap string, which a JSON 6902 patch cannot
# reach by path, and one place reads better than five.
#
# Two layers, so that the pod is admitted only after its cloud access exists
# (docs/catalog/external-dns.md):
# - this ResourceSet: the Namespace and, with Crossplane on, the module's own
#   access, bound to external-dns/external-dns (docs/catalog/crossplane.md
#   §3): on AWS an IAM Role and its Pod Identity association, on GCP an IAM
#   member on each zone it may write and one on the project to list zones;
# - external-dns-workload, a child ResourceSet holding the chart, which
#   dependsOn each of those being Ready. EKS Pod Identity injects the
#   credentials at pod admission: a pod admitted before its association never
#   gets them. GCP's Workload Identity has no such moment, but a binding that
#   never turns Ready — Crossplane without its grants in the foundations —
#   must hold the workload as visibly as on AWS, rather than leave a pod that
#   writes nothing.
# This ResourceSet dependsOn the crossplane one, which always exists and is
# Ready trivially when Crossplane is off: the providers' CRDs are there
# before a Role is applied, and nothing waits when there are none.
#
# resourcesTemplate rather than resources: the per-cloud blocks and the
# optional Secret entry are conditional text, which the structured resources
# list cannot carry.
#
# Fixed by decision, not exposed through a named attribute (values can still
# override any of it):
# - the chart, from the project's own Helm repository. It is not published as
#   an OCI artifact (registry.k8s.io serves the image only — measured, 404 on
#   every chart tag), so this is an HTTPS HelmRepository, pinned exactly.
# - registry txt with a prefix: on every cloud but AWS an Ingress hostname
#   becomes a CNAME, and a TXT record cannot share a CNAME's name (RFC 1034).
#   The prefix moves the ownership record next to it instead of on it.
# - the ServiceAccount is named external-dns in namespace external-dns, on
#   every cloud: the subject the module's own cloud identity is bound to.
#
# Cloud access: on AWS and GCP the module declares its own access through
# Crossplane, the foundations never do (docs/flux-catalog.md §6). With
# Crossplane off, and on the other clouds until their Crossplane providers
# land, each cloud block below reads a credential the client brings.
# - the Gateway API source is added only when the gateway_api module is on.
#   external-dns builds an informer per source at start-up and exits when the
#   Gateway CRDs are absent (source/gateway.go WaitForCacheSync → log.Fatal in
#   controller/execute.go, measured on v0.22.0). The hasKey guard lets this
#   template render before gateway_api is in the catalog.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: external-dns
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  # The crossplane ResourceSet exists on every cloud; Ready when Crossplane
  # is off, and once its providers and their CRDs are Healthy when it is on.
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: crossplane
      namespace: flux-system
      ready: true
  wait: true
  resourcesTemplate: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: external-dns
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
      labels:
        # The chart's pod runs non-root, read-only, no capabilities, default
        # seccomp: restricted holds, and pins it.
        pod-security.kubernetes.io/enforce: restricted
    << if and (eq inputs.cloud "aws") inputs.modules.crossplane.enabled >>
    ---
    # The module's own AWS access, docs/catalog/crossplane.md §3. Under
    # /socle/<cluster>/ and carrying Crossplane's boundary when the root wired
    # one: Crossplane's own policy refuses any other role. Inline policy only.
    #
    # Scoped by record name, not by zone: ChangeResourceRecordSets is allowed
    # on every hosted zone, but only when every name in the change batch is a
    # domain_filters entry or under one (route53:
    # ChangeResourceRecordSetsNormalizedRecordNames). A zone id cannot be
    # derived from a name, and the names are what domain_filters already says;
    # the argument is in docs/catalog/external-dns.md. The reads have no
    # condition key and stay on every zone.
    apiVersion: iam.aws.m.upbound.io/v1beta1
    kind: Role
    metadata:
      name: external-dns
      namespace: external-dns
      annotations:
        # IAM names are account-wide and two clusters may share an account.
        crossplane.io/external-name: << inputs.cluster.name >>-external-dns
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        path: /socle/<< inputs.cluster.name >>/
        << if inputs.modules.crossplane.permissions_boundary >>
        permissionsBoundary: << inputs.modules.crossplane.permissions_boundary | quote >>
        << end >>
        assumeRolePolicy: |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Service": "pods.eks.amazonaws.com"},
              "Action": ["sts:AssumeRole", "sts:TagSession"]
            }]
          }
        inlinePolicy:
          - name: route53
            policy: |
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "WriteUnderTheDomainFilters",
                    "Effect": "Allow",
                    "Action": "route53:ChangeResourceRecordSets",
                    "Resource": "arn:aws:route53:::hostedzone/*",
                    "Condition": {
                      "ForAllValues:StringLike": {
                        "route53:ChangeResourceRecordSetsNormalizedRecordNames": [
                          << range $i, $d := inputs.modules.external_dns.domain_filters ->>
                          << $n := $d | trimSuffix "." | lower ->>
                          << if $i >>,<< end >><< $n | quote >>, << printf "*.%s" $n | quote >>
                          << end ->>
                        ]
                      }
                    }
                  },
                  {
                    "Sid": "ReadTheZones",
                    "Effect": "Allow",
                    "Action": [
                      "route53:GetHostedZone",
                      "route53:ListResourceRecordSets",
                      "route53:ListTagsForResource",
                      "route53:ListTagsForResources"
                    ],
                    "Resource": "arn:aws:route53:::hostedzone/*"
                  },
                  {
                    "Sid": "ListTheZones",
                    "Effect": "Allow",
                    "Action": ["route53:ListHostedZones", "route53:ListHostedZonesByName"],
                    "Resource": "*"
                  }
                ]
              }
    ---
    apiVersion: eks.aws.m.upbound.io/v1beta1
    kind: PodIdentityAssociation
    metadata:
      name: external-dns
      namespace: external-dns
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        # Required: the socle's ClusterProviderConfig names no region, and
        # OpenTofu refuses this combination with an empty one.
        region: << inputs.cluster.region >>
        clusterName: << inputs.cluster.name >>
        namespace: external-dns
        serviceAccount: external-dns
        roleArnRef:
          name: external-dns
    << end >>
    << $access := and (eq inputs.cloud "gcp") inputs.modules.crossplane.enabled >>
    << if $access >>
    << $principal := printf
         "principal://iam.googleapis.com/projects/%s/locations/global/workloadIdentityPools/%s.svc.id.goog/subject/ns/%s/sa/%s"
         inputs.cluster.projectNumber inputs.cluster.projectId "external-dns" "external-dns" >>
    # The module's own GCP access, docs/catalog/crossplane.md §3: no Google
    # service account, the ServiceAccount external-dns/external-dns is the
    # principal itself (Workload Identity Federation). Both roles are among
    # what the foundations let Crossplane grant, and nothing else is.
    #
    # Scoped by zone, not by record name as on AWS: Cloud DNS has no condition
    # on the names in a change, and a zone is a resource IAM can bind on. The
    # zones are the ones the client listed in the foundations
    # (gcp.crossplane.dns_zones), the only ones whose IAM policy Crossplane may
    # set. roles/dns.admin there is that zone's records and nothing beyond.
    #
    # No zone listed, no member: external-dns still lists the project's zones,
    # matches its domain filters, and every write it attempts is refused —
    # Forbidden in its log, nothing in Cloud DNS.
    << range $zone := inputs.modules.crossplane.dns_zones >>
    ---
    apiVersion: dns.gcp.m.upbound.io/v1beta1
    kind: ManagedZoneIAMMember
    metadata:
      name: external-dns-<< $zone >>
      namespace: external-dns
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        project: << inputs.cluster.projectId | quote >>
        managedZone: << $zone | quote >>
        role: roles/dns.admin
        member: << $principal | quote >>
    << end >>
    ---
    # external-dns lists the project's zones on every loop to find the one a
    # name belongs to (ManagedZones.List, provider/google/google.go, v0.22.0),
    # whatever zone it then writes: a project-level call, which no zone
    # binding answers. The foundations' lister role carries list and get on
    # zones, nothing on records.
    apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
    kind: ProjectIAMMember
    metadata:
      name: external-dns
      namespace: external-dns
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
    spec:
      forProvider:
        project: << inputs.cluster.projectId | quote >>
        role: << inputs.modules.crossplane.dns_zone_lister_role | quote >>
        member: << $principal | quote >>
    << end >>
    ---
    # The workload, in a child ResourceSet so that it can wait on the
    # association explicitly. A step's health check does not: a Crossplane
    # managed resource that has not been created yet carries no Ready condition
    # at all, which kstatus reads as healthy — measured on floci, where the
    # chart was applied beside an association that never synced. dependsOn with
    # a readyExpr on Ready is what the crossplane module does for its
    # ProviderConfig.
    apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSet
    metadata:
      name: external-dns-workload
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
    spec:
      << if and (eq inputs.cloud "aws") inputs.modules.crossplane.enabled >>
      dependsOn:
        - apiVersion: iam.aws.m.upbound.io/v1beta1
          kind: Role
          name: external-dns
          namespace: external-dns
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        - apiVersion: eks.aws.m.upbound.io/v1beta1
          kind: PodIdentityAssociation
          name: external-dns
          namespace: external-dns
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      << else if $access >>
      dependsOn:
        << range $zone := inputs.modules.crossplane.dns_zones >>
        - apiVersion: dns.gcp.m.upbound.io/v1beta1
          kind: ManagedZoneIAMMember
          name: external-dns-<< $zone >>
          namespace: external-dns
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        << end >>
        - apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
          kind: ProjectIAMMember
          name: external-dns
          namespace: external-dns
          ready: true
          readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      << end >>
      wait: true
      resources:
      - apiVersion: source.toolkit.fluxcd.io/v1
        kind: HelmRepository
        metadata:
          name: external-dns
          namespace: external-dns
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: https://kubernetes-sigs.github.io/external-dns/
      # The socle's defaults. Everything the client may override through values.
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: external-dns-socle-values
          namespace: external-dns
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            fullnameOverride: external-dns
            serviceAccount:
              create: true
              name: external-dns
            << if eq inputs.cloud "aws" >>
            # Route 53, served from us-east-1 in the aws partition whatever the
            # cluster's region.
            #
            # The three optional entries read a Secret named external-dns-aws that
            # the client creates: static keys, and AWS_ENDPOINT_URL for a Route
            # 53-compatible endpoint — the e2e runs external-dns against floci that
            # way (tests/e2e/chainsaw-test.yaml). An optional secretKeyRef
            # whose Secret is absent sets no variable, and the SDK falls through to
            # its default chain: with Crossplane on, the Pod Identity association
            # the access step made for the module's own role.
            provider:
              name: aws
            env:
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_ACCESS_KEY_ID
                valueFrom: { secretKeyRef: { name: external-dns-aws, key: AWS_ACCESS_KEY_ID, optional: true } }
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom: { secretKeyRef: { name: external-dns-aws, key: AWS_SECRET_ACCESS_KEY, optional: true } }
              - name: AWS_ENDPOINT_URL
                valueFrom: { secretKeyRef: { name: external-dns-aws, key: AWS_ENDPOINT_URL, optional: true } }
            << else if eq inputs.cloud "gcp" >>
            # Cloud DNS, through the metadata server's Workload Identity
            # credentials: the ServiceAccount's own principal — with Crossplane
            # on, the one the module's members above bind — or, with it off, a
            # Google service account the client binds and names through values
            # (serviceAccount.annotations, iam.gke.io/gcp-service-account).
            #
            # The project is named rather than asked of the metadata server, the
            # default when --google-project is absent (provider/google/google.go,
            # v0.22.0): the zones are the cluster's project's, which is where the
            # members are bound. Public zones only: a split-horizon private zone
            # of the same name matches the same domain filters and would get
            # every record twice; a client who wants private zones says so
            # through values. A map, not a list: a client's extraArgs map
            # merges into it, where a list would replace it whole.
            provider:
              name: google
            extraArgs:
              google-project: << inputs.cluster.projectId | quote >>
              google-zone-visibility: public
            << else if eq inputs.cloud "azure" >>
            # Azure DNS. azure.json — tenant, subscription, resource group, and
            # either a service principal or useWorkloadIdentityExtension — comes
            # from the Secret external-dns-azure the client creates
            # (docs/catalog/external-dns.md). Workload ID also needs the
            # ServiceAccount annotation and the pod label, set through values.
            provider:
              name: azure
            extraVolumes:
              - name: azure-config-file
                secret:
                  secretName: external-dns-azure
                  items:
                    - { key: azure.json, path: azure.json }
            extraVolumeMounts:
              - name: azure-config-file
                mountPath: /etc/kubernetes
                readOnly: true
            << else if eq inputs.cloud "scaleway" >>
            # Scaleway DNS, through an API key: Scaleway has no workload identity.
            # The client creates the Secret external-dns-scaleway in this namespace
            # with SCW_ACCESS_KEY and SCW_SECRET_KEY, the variables the scaleway
            # provider reads (docs/tutorials/scaleway.md, v0.22.0).
            provider:
              name: scaleway
            env:
              - name: SCW_ACCESS_KEY
                valueFrom: { secretKeyRef: { name: external-dns-scaleway, key: SCW_ACCESS_KEY } }
              - name: SCW_SECRET_KEY
                valueFrom: { secretKeyRef: { name: external-dns-scaleway, key: SCW_SECRET_KEY } }
            << end >>
            sources:
              - service
              - ingress
            << if and (hasKey inputs.modules "gateway_api") inputs.modules.gateway_api.enabled >>
              - gateway-httproute
            << end >>
            domainFilters: << inputs.modules.external_dns.domain_filters | toJson >>
            policy: << inputs.modules.external_dns.policy >>
            registry: txt
            txtOwnerId: << inputs.modules.external_dns.txt_owner_id | quote >>
            txtPrefix: socle-
            # Reconcile on change, not only on the interval: a new HTTPRoute is
            # resolvable within seconds rather than within a minute.
            triggerLoopOnEvent: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
      # The client's own chart values, as written in kube.external_dns.values.
      # OpenTofu refuses secrets in there.
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: external-dns-client-values
          namespace: external-dns
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml inputs.modules.external_dns.values | nindent 8 >>
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: external-dns
          namespace: external-dns
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: external-dns
          # A failed install is retried, not left stalled: on azure and scaleway the
          # pod cannot start until the client creates its Secret, which only
          # happens once this module has created the namespace.
          install:
            strategy:
              name: RetryOnFailure
              retryInterval: 2m
          upgrade:
            strategy:
              name: RetryOnFailure
              retryInterval: 2m
          chart:
            spec:
              chart: external-dns
              version: 1.22.0  # appVersion 0.22.0
              sourceRef:
                kind: HelmRepository
                name: external-dns
          # Merged in this order, later wins; nothing inline after them. The
          # client's Secret needs the reconcile.fluxcd.io/watch: Enabled label too
          # for a change to apply before the next interval.
          valuesFrom:
            - kind: ConfigMap
              name: external-dns-socle-values
              valuesKey: values.yaml
            - kind: ConfigMap
              name: external-dns-client-values
              valuesKey: values.yaml
            << if inputs.modules.external_dns.values_secret >>
            - kind: Secret
              name: << inputs.modules.external_dns.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
