# The external-dns module: one Deployment that reads Services, Ingresses and
# Gateway API HTTPRoutes and publishes their names into the cloud's DNS zone.
# docs/catalog/external-dns.md is the module's page; the rules of
# docs/reference/catalog-module-standard.md apply: inputsFrom the one provider, the reconcile toggle on EACH resource,
# values tested never presence.
#
# What is the same on every cloud. The DNS provider, its credentials and,
# with Crossplane on, the module's own cloud access (an IAM role on aws, an
# IAM member on the project on gcp) are each cloud's, in
# oci/clusters/<cloud>/external-dns/patch.yaml: a step named cloud that the
# cloud inserts before workload (docs/decisions/socle.md, SOCLE-32).
#
# Values, in the order helm-controller merges them, later winning
# (docs/decisions/socle.md#socle-06-the-clients-values-win): external-dns-socle-values, the socle's defaults
# below; external-dns-cloud-values, the cloud step's; external-dns-client-values,
# kube.external_dns.values; then the client's Secret when they name one. No
# inline `values:` on the HelmRelease — helm-controller merges it last, so it
# would beat the client on every key.
#
# Steps, each applied once the one before is healthy: namespace, then
# workload — the chart. A cloud's step between them is healthy only once
# what the pod needs from the cloud is there (docs/catalog/external-dns.md).
#
# resourcesTemplate rather than resources: the optional Secret entry is
# conditional text, which the structured resources list cannot carry.
#
# Fixed by decision, not exposed through a named attribute (values can still
# override any of it):
# - the chart, from the project's own Helm repository. It is not published as
#   an OCI artifact (registry.k8s.io serves the image only — measured, 404 on
#   every chart tag), so this is an HTTPS HelmRepository, pinned exactly.
# - registry txt with a prefix: on every cloud but AWS an Ingress hostname
#   becomes a CNAME, and a TXT record cannot share a CNAME's name (RFC 1034).
#   The prefix moves the ownership record next to it instead of on it.
# - the ServiceAccount is named external-dns in namespace external-dns, on
#   every cloud: the subject the module's own cloud identity is bound to.
# - the Gateway API source is added only when the gateway_api module is on.
#   external-dns builds an informer per source at start-up and exits when the
#   Gateway CRDs are absent (source/gateway.go WaitForCacheSync → log.Fatal in
#   controller/execute.go, measured on v0.22.0). The hasKey guard lets this
#   template render before gateway_api is in the catalog.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: external-dns
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  wait: true
  steps:
    - name: namespace
      resourcesTemplate: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: external-dns
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
          labels:
            # The chart's pod runs non-root, read-only, no capabilities, default
            # seccomp: restricted holds, and pins it.
            pod-security.kubernetes.io/enforce: restricted
    - name: workload
      resourcesTemplate: |
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: HelmRepository
        metadata:
          name: external-dns
          namespace: external-dns
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: https://kubernetes-sigs.github.io/external-dns/
        ---
        # The socle's defaults. Everything the client may override through values.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: external-dns-socle-values
          namespace: external-dns
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            fullnameOverride: external-dns
            serviceAccount:
              create: true
              name: external-dns
            sources:
              - service
              - ingress
            << if and (hasKey inputs.modules "gateway_api") inputs.modules.gateway_api.enabled >>
              - gateway-httproute
            << end >>
            domainFilters: << inputs.modules.external_dns.domain_filters | toJson >>
            policy: << inputs.modules.external_dns.policy >>
            registry: txt
            txtOwnerId: << inputs.modules.external_dns.txt_owner_id | quote >>
            txtPrefix: socle-
            # Reconcile on change, not only on the interval: a new HTTPRoute is
            # resolvable within seconds rather than within a minute.
            triggerLoopOnEvent: true
            # Scraped by the monitoring module's vmagent: metrics on the
            # declared http port, always on.
            podAnnotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "7979"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
                # 64Mi for a long-running container that writes nothing: GKE
                # Autopilot reserves 1Gi for a container that names none
                # (docs/clouds/gcp/limits.md).
                ephemeral-storage: 64Mi
              limits:
                memory: 128Mi
        ---
        # The client's own chart values, as written in kube.external_dns.values.
        # OpenTofu refuses secrets in there.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: external-dns-client-values
          namespace: external-dns
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml inputs.modules.external_dns.values | nindent 8 >>
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: external-dns
          namespace: external-dns
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.external_dns.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: external-dns
          # A failed install is retried, not left stalled: where the cloud's step
          # reads a credential the client brings, the pod cannot start until the
          # client creates its Secret, which only happens once this module has
          # created the namespace.
          install:
            strategy:
              name: RetryOnFailure
              retryInterval: 2m
          upgrade:
            strategy:
              name: RetryOnFailure
              retryInterval: 2m
          chart:
            spec:
              chart: external-dns
              version: 1.23.0  # appVersion 0.23.0
              sourceRef:
                kind: HelmRepository
                name: external-dns
          # Merged in this order, later wins; nothing inline after them. The
          # client's Secret needs the reconcile.fluxcd.io/watch: Enabled label too
          # for a change to apply before the next interval.
          valuesFrom:
            - kind: ConfigMap
              name: external-dns-socle-values
              valuesKey: values.yaml
            # The cloud step's, when the cloud has values for the chart.
            - kind: ConfigMap
              name: external-dns-cloud-values
              valuesKey: values.yaml
              optional: true
            - kind: ConfigMap
              name: external-dns-client-values
              valuesKey: values.yaml
            << if inputs.modules.external_dns.values_secret >>
            - kind: Secret
              name: << inputs.modules.external_dns.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
        << $monitored := and inputs.modules.external_dns.enabled inputs.modules.monitoring.enabled ->>
        ---
        # The module's monitoring — its alert rules and its dashboard, from
        # monitoring/ in the socle artifact: VMRules and a ConfigMap Grafana's
        # sidecar loads. Present only while both this module and the monitoring
        # module are on: monitoring brings the VMRule CRD, and until it has the
        # Kustomization fails and retries every minute
        # (docs/decisions/monitoring.md, MONITORING-12).
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: external-dns-monitoring
          namespace: flux-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if $monitored >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          retryInterval: 1m
          sourceRef:
            kind: OCIRepository
            name: socle
          path: ./catalog/external-dns/monitoring
          targetNamespace: external-dns
          prune: true
          wait: true
          timeout: 2m
