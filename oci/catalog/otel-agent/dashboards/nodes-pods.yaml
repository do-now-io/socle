# The nodes and pods dashboard, shipped by the otel_agent module because it
# reads that module's metrics (docs/monitoring.md §5). Written on the names
# VictoriaMetrics stores kubeletstats under -opentelemetry.usePrometheusNaming;
# the e2e parses this JSON and asserts that every metric an expression names
# has series in VictoriaMetrics. Edit it in place and keep it valid JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-dashboard-nodes-pods
  labels:
    # The grafana module's sidecar picks up every ConfigMap carrying it.
    grafana_dashboard: "1"
data:
  nodes-pods.json: |
    {
      "uid": "socle-otel-nodes-pods",
      "title": "Kubernetes / Nodes and pods",
      "description": "Shipped by the socle's otel_agent module: kubelet metrics, through OpenTelemetry, in VictoriaMetrics.",
      "tags": [
        "socle",
        "kubernetes",
        "opentelemetry"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "current": {},
            "hide": 0
          },
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(k8s_node_cpu_usage, k8s_node_name)",
              "refId": "node-var"
            },
            "definition": "label_values(k8s_node_cpu_usage, k8s_node_name)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(k8s_pod_cpu_usage, k8s_namespace_name)",
              "refId": "namespace-var"
            },
            "definition": "label_values(k8s_pod_cpu_usage, k8s_namespace_name)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Nodes",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU used, by node",
          "description": "Cores in use, from the kubelet (kubeletstats k8s.node.cpu.usage).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (k8s_node_name) (k8s_node_cpu_usage{k8s_node_name=~\"$node\"})",
              "legendFormat": "{{k8s_node_name}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memory working set, by node",
          "description": "What the kubelet counts against the node's memory before evicting.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (k8s_node_name) (k8s_node_memory_working_set_bytes{k8s_node_name=~\"$node\"})",
              "legendFormat": "{{k8s_node_name}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Filesystem used, by node",
          "description": "The node's root filesystem, used over capacity.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "k8s_node_filesystem_usage_bytes{k8s_node_name=~\"$node\"} / k8s_node_filesystem_capacity_bytes",
              "legendFormat": "{{k8s_node_name}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Network, by node",
          "description": "Bytes per second received and transmitted.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (k8s_node_name, direction) (rate(k8s_node_network_io_bytes_total{k8s_node_name=~\"$node\"}[5m]))",
              "legendFormat": "{{k8s_node_name}} {{direction}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Pods",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU used, by namespace",
          "description": "Cores in use by the pods of each namespace.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (k8s_namespace_name) (k8s_pod_cpu_usage{k8s_namespace_name=~\"$namespace\"})",
              "legendFormat": "{{k8s_namespace_name}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory working set, by namespace",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (k8s_namespace_name) (k8s_pod_memory_working_set_bytes{k8s_namespace_name=~\"$namespace\"})",
              "legendFormat": "{{k8s_namespace_name}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Top 10 pods by CPU",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, k8s_pod_cpu_usage{k8s_namespace_name=~\"$namespace\"})",
              "legendFormat": "{{k8s_namespace_name}}/{{k8s_pod_name}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Top 10 pods by memory",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 26,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, k8s_pod_memory_working_set_bytes{k8s_namespace_name=~\"$namespace\"})",
              "legendFormat": "{{k8s_namespace_name}}/{{k8s_pod_name}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Network, by namespace",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 34,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (k8s_namespace_name) (rate(k8s_pod_network_io_bytes_total{k8s_namespace_name=~\"$namespace\"}[5m]))",
              "legendFormat": "{{k8s_namespace_name}}"
            }
          ]
        }
      ]
    }
