# The nodes as otel_agent's kubeletstats receiver reports them, on the names
# VictoriaMetrics stores from OpenTelemetry. Read by the alerting module's
# sidecar, inert without it. Checked in CI with vmalert -dryRun
# (.github/scripts/check-rules.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-rules
  labels:
    vmalert_rules: "1"
data:
  otel-agent.yaml: |
    groups:
      - name: socle-nodes
        rules:
          - alert: NodeFilesystemAlmostFull
            expr: >-
              k8s_node_filesystem_available_bytes
              / k8s_node_filesystem_capacity_bytes
              < 0.10
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: >-
                Node {{ $labels.k8s_node_name }} has
                {{ $value | humanizePercentage }} of its filesystem left;
                below that the kubelet starts evicting pods.
