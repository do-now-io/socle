# The argocd-image-updater module: Argo CD Image Updater, which moves the
# client's ArgoCD Applications to the new image tags their ImageUpdater
# objects allow, without a commit. docs/catalog/argocd-image-updater.md is
# the module's page, docs/decisions/argocd-image-updater.md its decisions;
# the rules of docs/reference/catalog-module-standard.md apply: inputsFrom
# the one provider, the reconcile toggle on EACH resource, values tested
# never presence.
#
# What is the same on every cloud. On aws, the module's own IAM role and the
# socle's ECR registry entry are aws's, in
# oci/clusters/aws/argocd-image-updater/patch.yaml; on gcp, its Artifact
# Registry Reader grant and the socle's Artifact Registry entries are gcp's,
# in oci/clusters/gcp/argocd-image-updater/patch.yaml: a step named cloud
# that the cloud inserts before workload (docs/decisions/socle.md, SOCLE-32).
#
# Values, in the order helm-controller merges them, later winning
# (docs/decisions/socle.md#socle-06-the-clients-values-win):
# argocd-image-updater-socle-values, the socle's defaults below;
# argocd-image-updater-cloud-values, the cloud step's;
# argocd-image-updater-client-values, kube.argocd_image_updater.values; then
# the client's Secret when they name one. No inline `values:` on the
# HelmRelease — helm-controller merges it last, so it would beat the client.
#
# Where it runs (ARGOCD-IMAGE-UPDATER-02): its own namespace, watching
# argocd. An ImageUpdater selects Applications in its own namespace only,
# and the socle's Applications are in argocd, so the client's ImageUpdater
# objects are there too. The Role below lets the controller read argocd's
# Secrets and ConfigMaps, for git write-back credentials; reading and
# patching Applications is the chart's ClusterRole.
#
# Steps, each applied once the one before is healthy: namespace — the
# Namespace and the Role in argocd, whose namespace argocd's ResourceSet
# renders (hence the dependsOn) — then workload, the chart. A cloud's step
# between them is healthy only once what the pod needs from the cloud is
# there (docs/architecture/module-iam.md).
#
# The registry entries (ARGOCD-IMAGE-UPDATER-04, -07): the client's
# registries, as written, are config.registries here. They are one list,
# which a list in the client's values would replace whole: OpenTofu refuses
# it there. A cloud step that adds the socle's own entries — aws's, for the
# ECR registry of the cluster's account and region; gcp's, for the Artifact
# Registry host of each location named — sets the whole list, its entries
# first and the client's after them, and replaces this one.
#
# resourcesTemplate rather than resources: the optional Secret entry is
# conditional text, which the structured resources list cannot carry.
#
# Fixed by decision, not exposed through a named attribute (values can
# still override any of it):
# - the chart, the project's own from argo-helm, as an OCI artifact pinned
#   exactly;
# - the ServiceAccount is named argocd-image-updater in namespace
#   argocd-image-updater: the subject the role and the Role in argocd are
#   bound to;
# - the ImageUpdater CRD is kept on uninstall (ARGOCD-IMAGE-UPDATER-06):
#   turning the module off never deletes the client's ImageUpdater objects.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: argocd-image-updater
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  # argocd's ResourceSet renders the argocd namespace the Role lives in.
  dependsOn:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: argocd
      namespace: flux-system
      ready: true
  wait: true
  steps:
    - name: namespace
      resourcesTemplate: |
        << $m := inputs.modules.argocd_image_updater ->>
        apiVersion: v1
        kind: Namespace
        metadata:
          name: argocd-image-updater
          annotations:
            fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
          labels:
            # The chart's pod runs non-root, read-only, no capabilities, default
            # seccomp: restricted holds, and pins it.
            pod-security.kubernetes.io/enforce: restricted
        ---
        # Read access to argocd's Secrets and ConfigMaps: the git write-back's
        # credentials — ArgoCD's repository credentials for git:repocreds, or a
        # Secret the client names in an ImageUpdater — live there, beside the
        # Applications. The same access the chart's own Role would give it, had
        # it been installed in argocd.
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: argocd-image-updater
          namespace: argocd
          annotations:
            fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
        rules:
          - apiGroups: [""]
            resources: [secrets, configmaps]
            verbs: [get, list, watch]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: argocd-image-updater
          namespace: argocd
          annotations:
            fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: argocd-image-updater
        subjects:
          - kind: ServiceAccount
            name: argocd-image-updater
            namespace: argocd-image-updater
    - name: workload
      resourcesTemplate: |
        << $m := inputs.modules.argocd_image_updater ->>
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: argocd-image-updater-chart
          namespace: argocd-image-updater
          annotations:
            fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: oci://ghcr.io/argoproj/argo-helm/argocd-image-updater
          layerSelector:
            mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
            operation: copy
          ref:
            tag: 1.3.2  # appVersion v1.3.1
        ---
        # The socle's defaults. Everything the client may override through values,
        # except the registry list: theirs, or the cloud step's entry then theirs.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: argocd-image-updater-socle-values
          namespace: argocd-image-updater
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            # The identity the role and the Role in argocd are bound to.
            # Renaming it through values breaks both: a convenience, not a lock.
            fullnameOverride: argocd-image-updater
            serviceAccount:
              create: true
              name: argocd-image-updater
            crds:
              install: true
              # Kept on uninstall: the client's ImageUpdater objects outlive
              # the module (helm.sh/resource-policy: keep).
              keep: true
            # More would be standby only: the controller elects a leader.
            replicaCount: 1
            config:
              # ArgoCD and the Applications — so the client's ImageUpdater
              # objects — are in argocd, not in this namespace.
              argocd.namespace: argocd
              watch.namespaces: argocd
              registries: << $m.registries | toJson >>
            # Metrics for the monitoring module's vmagent, which scrapes the
            # annotated pod over plain HTTP: the controller serves them over
            # HTTPS with Kubernetes authentication by default
            # (--metrics-secure). metrics.enabled declares the port the
            # annotation names; it also adds a Service and a NetworkPolicy
            # letting only that port in, which closes nothing the socle uses
            # (the webhook port serves only with ingress.enabled).
            extraArgs:
              - --metrics-secure=false
            containerPorts:
              metrics: 8080
            metrics:
              enabled: true
              service:
                servicePort: 8080
            podAnnotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8080"
            # The chart sets none. Measured on EKS with one Application watched:
            # 2m CPU, 25Mi; the memory request leaves twice that. Disk, chosen:
            # the git write-back makes a depth-1 clone of the client's
            # repository in the /tmp emptyDir for each update and removes it
            # after (pkg/argocd/git.go, v1.3.0), up to ten at once
            # (--max-concurrent-apps), so 256Mi rather than the 64Mi of a
            # container that writes only its logs. Autopilot turns the request
            # into a limit: a client with larger repositories raises it in
            # values (docs/catalog/argocd-image-updater.md).
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
                ephemeral-storage: 256Mi
        ---
        # The client's own chart values, as written in
        # kube.argocd_image_updater.values. OpenTofu refuses secrets and
        # config.registries in there.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: argocd-image-updater-client-values
          namespace: argocd-image-updater
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml $m.values | nindent 8 >>
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: argocd-image-updater
          namespace: argocd-image-updater
          annotations:
            fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: argocd-image-updater
          chartRef:
            kind: OCIRepository
            name: argocd-image-updater-chart
          install:
            remediation:
              retries: 3
          upgrade:
            remediation:
              retries: 3
          # Merged in this order, later wins; nothing inline after them. The
          # client's Secret needs the reconcile.fluxcd.io/watch: Enabled label too
          # for a change to apply before the next interval.
          valuesFrom:
            - kind: ConfigMap
              name: argocd-image-updater-socle-values
              valuesKey: values.yaml
            # The cloud step's, when the cloud has values for the chart.
            - kind: ConfigMap
              name: argocd-image-updater-cloud-values
              valuesKey: values.yaml
              optional: true
            - kind: ConfigMap
              name: argocd-image-updater-client-values
              valuesKey: values.yaml
            << if $m.values_secret >>
            - kind: Secret
              name: << $m.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
        << $monitored := and $m.enabled inputs.modules.monitoring.enabled ->>
        ---
        # The module's monitoring — its alert rules and its dashboard, from
        # monitoring/ in the socle artifact: VMRules and a ConfigMap Grafana's
        # sidecar loads. Present only while both this module and the monitoring
        # module are on: monitoring brings the VMRule CRD, and until it has the
        # Kustomization fails and retries every minute
        # (docs/decisions/monitoring.md, MONITORING-12).
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: argocd-image-updater-monitoring
          namespace: flux-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if $monitored >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          retryInterval: 1m
          sourceRef:
            kind: OCIRepository
            name: socle
          path: ./catalog/argocd-image-updater/monitoring
          targetNamespace: argocd-image-updater
          prune: true
          wait: true
          timeout: 2m
