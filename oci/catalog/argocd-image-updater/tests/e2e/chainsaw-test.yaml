# The argocd-image-updater module's proof (docs/catalog/argocd-image-updater.md):
# Argo CD Image Updater, OFF by default — it does nothing until a client
# writes an ImageUpdater. Selected by label:
#   health     the disabled shape: the ResourceSet Ready with nothing
#              rendered, no namespace, no Role in argocd.
#   module     on aws, in two halves. First with Crossplane off and no
#              repository, as a client whose images are elsewhere gets it:
#              the controller Available, watching argocd; a client value
#              beating the socle's, the Secret merged last; a registry of
#              registries reaching registries.conf. Then the update loop on a
#              public registry: an Application at podinfo 6.9.0, an
#              ImageUpdater allowing 6.9.x, the Application overridden to
#              6.9.4 and its Deployment rolled — Git never touched. Then off:
#              everything garbage-collected but the CRD, the client's
#              ImageUpdater and the override, which outlive the module.
#              Second half, with Crossplane on and repositories named: the
#              module's own Role, pointed at floci (the seam, its own steps),
#              becomes an IAM role under /socle/<cluster>/ whose one policy
#              gets the registry token and reads the repositories named,
#              nothing else; the association syncs, the workload follows
#              it; off deletes the role.
#   module     on gcp (GKE, the sandbox), the module as its tfvars leave it,
#              repositories named: the ProjectIAMMember binding Artifact
#              Registry Reader to the controller's own principal, the
#              workload after it with the socle's Artifact Registry entry,
#              and the update loop on a private repository of the sandbox,
#              read with the token the login script takes from the metadata
#              server.
# No destroyed phase: off by default, the module never runs in the job that
# uninstalls the default socle, so no CRD is there to survive it; the CRD
# kept when the module turns off is proven in the module phase, as keda's.
# Not provable on floci: ECR itself — floci serves its registry by a host
# name a pod does not resolve — the association reaching EKS, the login
# script getting a token with the role's credentials, and IAM enforcing the
# policy and the boundary: the sandbox's (docs/catalog/argocd-image-updater.md).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: argocd-image-updater-health
  labels:
    phase: health
    cloud: any
    platform: any
spec:
  description: Off by default, the ResourceSet is Ready and renders nothing.
  timeouts:
    assert: 3m
    error: 1m
  steps:
    - name: the ResourceSet is Ready with nothing in its inventory
      try:
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: argocd-image-updater
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries || `[]`)): 0
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: argocd-image-updater
        - error:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: argocd-image-updater
                namespace: argocd
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: argocd-image-updater
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: argocd-image-updater-module-aws
  labels:
    phase: module
    cloud: aws
    platform: any
spec:
  description: >-
    Image Updater on without a role moves an ArgoCD Application to a new
    image tag of a public registry, without a commit; with Crossplane on and
    repositories named, its own role reads those ECR repositories only.
  timeouts:
    assert: 5m
    error: 5m
    exec: 3m
    delete: 3m
  steps:
    # 64Mi in the socle's document: the client's 160Mi on the live
    # controller, the socle's cpu request kept. A registry of the client's,
    # GHCR without a credential, in registries.conf; argocd watched. No
    # repository: no Role.
    - name: enabled = true without a repository converges, watching argocd, the client's value beats the socle's, no Role
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    argocd_image_updater:
                      enabled: true
                      registries:
                        - name: ghcr
                          prefix: ghcr.io
                          api_url: https://ghcr.io
                      values:
                        resources:
                          requests:
                            memory: 160Mi
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: argocd-image-updater-controller
                namespace: argocd-image-updater
              spec:
                template:
                  spec:
                    serviceAccountName: argocd-image-updater
                    (containers[0].resources || `{}`):
                      requests:
                        cpu: 50m
                        memory: 160Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: argocd-image-updater-config
                namespace: argocd-image-updater
              data:
                argocd.namespace: argocd
                watch.namespaces: argocd
                # registries.conf is one key: quoted, JMESPath does not read a path.
                '(contains("registries.conf", ''prefix: ghcr.io''))': true
                '(contains("registries.conf", ''dkr.ecr''))': false
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: argocd-image-updater
                namespace: argocd
              subjects:
                - kind: ServiceAccount
                  name: argocd-image-updater
                  namespace: argocd-image-updater
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: argocd-image-updater
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        # No repository named: aws's cloud step renders nothing, so no IAM role.
        - error:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: argocd-image-updater-access
                namespace: flux-system
        # The module's monitoring — rules and dashboard — applied with it,
        # the monitoring module being on.
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: argocd-image-updater-monitoring
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: argocd-image-updater
            name: argocd-image-updater
        - events:
            namespace: argocd-image-updater
        - podLogs:
            namespace: argocd-image-updater
            tail: 40
    # The order of valuesFrom, proven whole (docs/decisions/socle.md#socle-06-the-clients-values-win):
    # the socle's document, then kube.argocd_image_updater.values, then the
    # Secret the client names in values_secret, merged last; both cleared,
    # the socle's 64Mi.
    - name: kube.argocd_image_updater.values_secret is merged last, over values and the socle
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: argocd-image-updater-e2e-values
                namespace: argocd-image-updater
                labels:
                  reconcile.fluxcd.io/watch: Enabled
              stringData:
                values.yaml: |
                  resources:
                    requests:
                      memory: 176Mi
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    argocd_image_updater:
                      values_secret: argocd-image-updater-e2e-values
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: argocd-image-updater-controller
                namespace: argocd-image-updater
              spec:
                template:
                  spec:
                    (containers[0].resources || `{}`):
                      requests:
                        cpu: 50m
                        memory: 176Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    argocd_image_updater:
                      values_secret: ''
                      values:
                        resources: null
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: argocd-image-updater-controller
                namespace: argocd-image-updater
              spec:
                template:
                  spec:
                    (containers[0].resources || `{}`):
                      requests:
                        memory: 64Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - delete:
            ref:
              apiVersion: v1
              kind: Secret
              name: argocd-image-updater-e2e-values
              namespace: argocd-image-updater
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: argocd-image-updater
            name: argocd-image-updater
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
    # A client's application, as ArgoCD runs it: the podinfo chart from its
    # OCI registry, its image pinned at from_tag by a parameter, synced into
    # this test's namespace. ArgoCD reads an OCI Helm registry through a
    # repository Secret with enableOCI.
    - name: an Application deploys podinfo at the old tag
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: podinfo-e2e-charts
                namespace: argocd
                labels:
                  argocd.argoproj.io/secret-type: repository
              stringData:
                name: podinfo-e2e-charts
                type: helm
                url: ghcr.io/stefanprodan/charts
                enableOCI: 'true'
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: podinfo-e2e
                namespace: argocd
              spec:
                project: default
                source:
                  repoURL: ghcr.io/stefanprodan/charts
                  chart: podinfo
                  targetRevision: 6.15.0
                  helm:
                    parameters:
                      - name: image.tag
                        value: ($values.from_tag)
                destination:
                  server: https://kubernetes.default.svc
                  namespace: ($namespace)
                syncPolicy:
                  automated: {}
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: podinfo-e2e
                namespace: ($namespace)
              spec:
                template:
                  spec:
                    (containers[0].image): (join(':', [$values.image, $values.from_tag]))
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            namespace: argocd
            name: podinfo-e2e
        - podLogs:
            namespace: argocd
            selector: app.kubernetes.io/name=argocd-repo-server
            tail: 40
    # The loop (ARGOCD-IMAGE-UPDATER-03): an ImageUpdater the client writes,
    # in argocd beside the Application, allowing the from_tag series under
    # semver; the default argocd write-back. The controller lists the
    # registry's tags, picks to_tag, overrides the Application's parameter;
    # ArgoCD rolls the Deployment. Nothing written to any repository.
    - name: an ImageUpdater moves the Application to the newest allowed tag, and its Deployment rolls
      try:
        - apply:
            resource:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              metadata:
                name: podinfo-e2e
                namespace: argocd
              spec:
                applicationRefs:
                  - namePattern: podinfo-e2e
                    images:
                      - alias: podinfo
                        imageName: ($values.image)
                        commonUpdateSettings:
                          updateStrategy: semver
                          allowTags: regexp:^6\.9\.[0-9]+$
                        manifestTargets:
                          helm:
                            name: image.repository
                            tag: image.tag
        - assert:
            resource:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              metadata:
                name: podinfo-e2e
                namespace: argocd
              status:
                applicationsMatched: 1
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: podinfo-e2e
                namespace: argocd
              spec:
                source:
                  helm:
                    (parameters[?name == 'image.tag'] || `[]`):
                      - value: ($values.to_tag)
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: podinfo-e2e
                namespace: ($namespace)
              spec:
                template:
                  spec:
                    (containers[0].image): (join(':', [$values.image, $values.to_tag]))
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            namespace: argocd
            name: podinfo-e2e
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            namespace: argocd
            name: podinfo-e2e
        - podLogs:
            namespace: argocd-image-updater
            tail: 80
    # Off: the release, the namespace and the Role in argocd go. The CRD
    # stays (ARGOCD-IMAGE-UPDATER-06), so the client's ImageUpdater does; and
    # the override outlives the module, whatever the chart's default says.
    - name: enabled = false garbage-collects the module, the CRD, the ImageUpdater and the override stay
      try:
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Released'] || `[]`):
                  - status: 'True'
                (length(conditions[?type == 'Reconciling'] || `[]`)): 0
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    argocd_image_updater:
                      enabled: false
                      registries: []
        - error:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: argocd-image-updater
        - error:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: argocd-image-updater
                namespace: argocd
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: imageupdaters.argocd-image-updater.argoproj.io
        - assert:
            resource:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              metadata:
                name: podinfo-e2e
                namespace: argocd
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: podinfo-e2e
                namespace: argocd
              spec:
                source:
                  helm:
                    (parameters[?name == 'image.tag'] || `[]`):
                      - value: ($values.to_tag)
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: argocd-image-updater
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries || `[]`)): 0
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: argocd-image-updater
        - podLogs:
            namespace: flux-system
            selector: app.kubernetes.io/name=flux-operator
            tail: 40
    # The controller puts a finalizer on every ImageUpdater and is the only
    # one to remove it, which it does at once — its finalizer only drops the
    # object's metrics. With the module off nothing removes it: deleting an
    # ImageUpdater, or the argocd namespace around it, waits until the client
    # releases it by hand, as the page says. Done here, or Chainsaw's own
    # cleanup would wait on it.
    - name: with the module off, an ImageUpdater keeps its finalizer and is deleted once it is released
      try:
        - assert:
            resource:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              metadata:
                name: podinfo-e2e
                namespace: argocd
                (contains(finalizers || `[]`, 'resources-finalizer.argocd-image-updater.argoproj.io')): true
        - patch:
            resource:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              metadata:
                name: podinfo-e2e
                namespace: argocd
                finalizers: []
        - delete:
            ref:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              name: podinfo-e2e
              namespace: argocd
        - error:
            resource:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              metadata:
                name: podinfo-e2e
                namespace: argocd
      catch:
        - describe:
            apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            namespace: argocd
            name: podinfo-e2e
    # Second half: the controller's own AWS access
    # (docs/decisions/argocd-image-updater.md, ARGOCD-IMAGE-UPDATER-04), two
    # repositories named, one a glob. In the order their CRDs appear: the
    # release, the providers Healthy, then the module's objects.
    - name: with Crossplane on and repositories named, the module declares its Role and its association
      timeouts:
        assert: 8m
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    crossplane:
                      enabled: true
                    argocd_image_updater:
                      enabled: true
                      repositories:
                        - crm-api
                        - acme/*
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: crossplane
                namespace: crossplane-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: pkg.crossplane.io/v1
              kind: Provider
              metadata:
                name: provider-aws-iam
              status:
                (conditions[?type == 'Healthy'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: pkg.crossplane.io/v1
              kind: Provider
              metadata:
                name: provider-aws-eks
              status:
                (conditions[?type == 'Healthy'] || `[]`):
                  - status: 'True'
        # A Provider is Healthy before every CRD it brings is served, and an
        # assert on a kind not served yet fails at once: the CRDs Established
        # first.
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: roles.iam.aws.m.upbound.io
              status:
                (conditions[?type == 'Established'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: podidentityassociations.eks.aws.m.upbound.io
              status:
                (conditions[?type == 'Established'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
                annotations:
                  crossplane.io/external-name: (join('', [$values.cluster, '-argocd-image-updater']))
              spec:
                forProvider:
                  path: (join('', ['/socle/', $values.cluster, '/']))
        - assert:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              spec:
                forProvider:
                  namespace: argocd-image-updater
                  serviceAccount: argocd-image-updater
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
        - describe:
            apiVersion: pkg.crossplane.io/v1
            kind: Provider
        - events:
            namespace: crossplane-system
        - podLogs:
            namespace: crossplane-system
            tail: 40
    # floci seam: the module leaves providerConfigRef at its default, the
    # socle's Pod Identity ClusterProviderConfig, which reaches AWS's own
    # endpoints: floci serves Pod Identity since 2.2.0, but not there.
    # floci's own is named after the fact. skipDelete: the last step removes these two itself, before
    # Crossplane goes.
    - name: 'floci seam: a ClusterProviderConfig with static keys, and the module''s resources pointed at it'
      skipDelete: true
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: floci-credentials
                namespace: crossplane-system
              stringData:
                credentials: |
                  [default]
                  aws_access_key_id = test
                  aws_secret_access_key = test
        - apply:
            resource:
              apiVersion: aws.m.upbound.io/v1beta1
              kind: ClusterProviderConfig
              metadata:
                name: floci
              spec:
                credentials:
                  source: Secret
                  secretRef:
                    namespace: crossplane-system
                    name: floci-credentials
                    key: credentials
                endpoint:
                  hostnameImmutable: true
                  services: [iam, eks, sts]
                  url:
                    type: Static
                    static: (join('', ['http://', $values.floci_ip, ':4566']))
                skip_credentials_validation: true
                skip_metadata_api_check: true
                skip_region_validation: true
                skip_requesting_account_id: true
        - patch:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: floci
        - patch:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: floci
    # The token on *, the three reads on the repositories named, a glob kept
    # as written — and nothing else: no other ECR action, no write, no read
    # on every repository. Read from what Crossplane reports (status.atProvider).
    - name: the Role becomes an IAM role whose one policy gets the registry token and reads the repositories named, nothing else
      bindings:
        - name: repository
          value: (join('', ['arn:aws:ecr:', $values.region, ':', $values.account, ':repository/']))
        - name: role
          value: (join('', [$values.cluster, '/', $values.cluster, '-argocd-image-updater']))
      try:
        - assert:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                atProvider:
                  arn: (join('', ['arn:aws:iam::', $values.account, ':role/socle/', $role]))
                  (contains(assumeRolePolicy || '', 'pods.eks.amazonaws.com')): true
                  (inlinePolicy[?name == 'ecr'] || `[]`):
                    - (contains(policy || '', '"ecr:GetAuthorizationToken"')): true
                      (contains(policy || '', '"ecr:ListImages"')): true
                      (contains(policy || '', '"ecr:DescribeImages"')): true
                      (contains(policy || '', '"ecr:BatchGetImage"')): true
                      (contains(policy || '', '"ecr:GetDownloadUrlForLayer"')): true
                      (contains(policy || '', join('', [$repository, 'crm-api"']))): true
                      (contains(policy || '', join('', [$repository, 'acme/*"']))): true
                      (contains(policy || '', ':repository/*"')): false
                      (contains(policy || '', '"ecr:*"')): false
                      (contains(policy || '', 'ecr:PutImage')): false
                      (contains(policy || '', 'ecr:BatchDeleteImage')): false
                      (contains(policy || '', 'ecr:InitiateLayerUpload')): false
      catch:
        - describe:
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            namespace: argocd-image-updater
            name: argocd-image-updater
        - podLogs:
            namespace: crossplane-system
            selector: pkg.crossplane.io/provider=provider-aws-iam
            tail: 40
    # The association syncs on floci since 2.2.0 (its Pod Identity API,
    # floci-io/floci#4012), so argocd-image-updater-access turns Ready, the cloud step
    # healthy, and the workload step follows: the gate holds the chart
    # exactly until the association exists, as on EKS.
    - name: the association syncs, and the workload follows
      timeouts:
        assert: 6m
      try:
        - assert:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              status:
                (conditions[?type == 'Synced'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: argocd-image-updater-access
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
        - describe:
            apiVersion: eks.aws.m.upbound.io/v1beta1
            kind: PodIdentityAssociation
            namespace: argocd-image-updater
            name: argocd-image-updater
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: argocd-image-updater
            name: argocd-image-updater
        - events:
            namespace: argocd-image-updater
    # The module off deletes the IAM role and the namespace goes;
    # the seam's objects removed before Crossplane, Crossplane off last.
    - name: off, the IAM role is deleted and the namespace goes
      try:
        # The release must be idle before the module goes: helm-controller
        # honours a deletion only once the running action returns.
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Released'] || `[]`):
                  - status: 'True'
                (length(conditions[?type == 'Reconciling'] || `[]`)): 0
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    argocd_image_updater:
                      enabled: false
                      repositories: []
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: argocd-image-updater
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: ROLE
                value: (join('', [$values.cluster, '-argocd-image-updater']))
            content: |
              for _ in $(seq 1 30); do
                aws iam get-role --role-name "$ROLE" > /dev/null 2>&1 || { echo "IAM role $ROLE gone"; exit 0; }
                sleep 2
              done
              echo "IAM role $ROLE survived the module turned off"; exit 1
        - delete:
            ref:
              apiVersion: aws.m.upbound.io/v1beta1
              kind: ClusterProviderConfig
              name: floci
        - delete:
            ref:
              apiVersion: v1
              kind: Secret
              name: floci-credentials
              namespace: crossplane-system
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    crossplane:
                      enabled: false
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: crossplane-system
      catch:
        - describe:
            apiVersion: v1
            kind: Namespace
            name: argocd-image-updater
        - describe:
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            namespace: argocd-image-updater
            name: argocd-image-updater
        - podLogs:
            namespace: flux-system
            selector: app.kubernetes.io/name=flux-operator
            tail: 40
---
# On gcp (GKE, the sandbox), the module as its tfvars leave it: enabled,
# Crossplane on, repositories naming LOCATION/REPOSITORY of the sandbox's
# project, the first of which holds podinfo at from_tag and to_tag, copied
# from GHCR (docs/catalog/argocd-image-updater.md, Measured). The member
# binding Artifact Registry Reader to the controller's own principal, the
# workload after it, then the loop on that repository: Image Updater lists
# its tags with the token its login script takes from the metadata server,
# and moves the Application. Whether the nodes may pull the new image is the
# project's node identity, not this module: the Deployment's rollout is not
# asserted.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: argocd-image-updater-module-gke
  labels:
    phase: module
    cloud: gcp
    platform: gke
spec:
  description: >-
    The controller's own principal reads the project's Artifact Registry, and
    an ImageUpdater moves an Application to a newer tag of a sandbox
    repository with the token the login script gets from the metadata server.
  timeouts:
    # Chainsaw's defaults (apply 5s, assert 30s) are too short on GKE: a call
    # through the cluster's DNS endpoint can outlast 5 s (context deadline
    # exceeded) and an Autopilot pod takes minutes to restart. Every gke test
    # holds at least apply 30s, assert 180s, error 60s, delete 60s, cleanup
    # 120s and exec 30s (measured on the sandbox, 2026-10-16).
    apply: 30s
    cleanup: 120s
    exec: 30s
    # Autopilot provisions a node for a pod that does not fit, minutes before
    # a Deployment is Available; IAM takes up to minutes to propagate.
    assert: 10m
    error: 3m
    delete: 3m
  bindings:
    - name: inputs
      value: (x_k8s_get($client, 'fluxcd.controlplane.io/v1', 'ResourceSetInputProvider', 'flux-system', 'socle').spec.defaultValues)
    - name: project
      value: ($inputs.cluster.projectId)
    - name: principal
      value: >-
        (join('', ['principal://iam.googleapis.com/projects/', $inputs.cluster.projectNumber,
        '/locations/global/workloadIdentityPools/', $project, '.svc.id.goog/subject/ns/argocd-image-updater/sa/argocd-image-updater']))
    # LOCATION/REPOSITORY, the first one named.
    - name: repository
      value: (split($inputs.modules.argocd_image_updater.repositories[0], '/'))
    - name: host
      value: (join('', [$repository[0], '-docker.pkg.dev']))
    - name: image
      value: (join('/', [$host, $project, $repository[1], 'podinfo']))
  steps:
    # The binding the module declares, read from the spec Crossplane applies:
    # the one read-only role, on the project, for the controller's own
    # principal. No Google service account anywhere.
    - name: the ProjectIAMMember binds roles/artifactregistry.reader to the controller's principal, Ready
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: projectiammembers.cloudplatform.gcp.m.upbound.io
              status:
                (conditions[?type == 'Established'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              spec:
                forProvider:
                  project: ($project)
                  role: roles/artifactregistry.reader
                  member: ($principal)
              status:
                (conditions[?type == 'Synced'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectIAMMember
            namespace: argocd-image-updater
            name: argocd-image-updater
        - podLogs:
            namespace: crossplane-system
            selector: pkg.crossplane.io/provider=provider-gcp-cloudplatform
            tail: 40
    # The chart only after the binding (gcp's cloud step, healthy once
    # argocd-image-updater-access is), the controller on its own
    # ServiceAccount with no iam.gke.io/gcp-service-account annotation, its
    # requests whole for Autopilot, the socle's entry for the repository's
    # host, the login script mounted.
    - name: the workload converges after the binding, as its own ServiceAccount, with the Artifact Registry entry
      try:
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: argocd-image-updater-access
                namespace: flux-system
              spec:
                (dependsOn[?kind == 'ProjectIAMMember'] || `[]`):
                  - name: argocd-image-updater
                    namespace: argocd-image-updater
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: argocd-image-updater
                namespace: argocd-image-updater
                (contains(keys(annotations || `{}`), 'iam.gke.io/gcp-service-account')): false
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: argocd-image-updater-controller
                namespace: argocd-image-updater
              spec:
                template:
                  spec:
                    serviceAccountName: argocd-image-updater
                    (containers[0].resources.requests || `{}`):
                      (length(cpu || '') > `0`): true
                      (length(memory || '') > `0`): true
                      (length("ephemeral-storage" || '') > `0`): true
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: argocd-image-updater-config
                namespace: argocd-image-updater
              data:
                # registries.conf is one key: quoted, JMESPath does not read a path.
                '(contains("registries.conf", join('''', [''prefix: '', $host])))': true
                '(contains("registries.conf", ''credentials: ext:/scripts/artifact-registry-login.sh''))': true
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: argocd-image-updater-authscripts
                namespace: argocd-image-updater
              data:
                '(contains("artifact-registry-login.sh", ''Metadata-Flavor: Google''))': true
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: argocd-image-updater-access
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: argocd-image-updater
            name: argocd-image-updater
        - events:
            namespace: argocd-image-updater
        - podLogs:
            namespace: argocd-image-updater
            tail: 40
    # A client's application on the sandbox repository, as the aws test's on
    # GHCR: the podinfo chart from its OCI registry, the image at
    # $image:from_tag by parameters.
    - name: an Application points podinfo at the repository's old tag
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: podinfo-e2e-charts
                namespace: argocd
                labels:
                  argocd.argoproj.io/secret-type: repository
              stringData:
                name: podinfo-e2e-charts
                type: helm
                url: ghcr.io/stefanprodan/charts
                enableOCI: 'true'
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: podinfo-e2e
                namespace: argocd
              spec:
                project: default
                source:
                  repoURL: ghcr.io/stefanprodan/charts
                  chart: podinfo
                  targetRevision: 6.15.0
                  helm:
                    parameters:
                      - name: image.repository
                        value: ($image)
                      - name: image.tag
                        value: ($values.from_tag)
                destination:
                  server: https://kubernetes.default.svc
                  namespace: ($namespace)
                syncPolicy:
                  automated: {}
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: podinfo-e2e
                namespace: ($namespace)
              spec:
                template:
                  spec:
                    (containers[0].image): (join(':', [$image, $values.from_tag]))
      catch:
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            namespace: argocd
            name: podinfo-e2e
    # The loop (ARGOCD-IMAGE-UPDATER-08): the repository is private to the
    # project, so listing its tags needs the login script's token and the
    # member's role. The override reaching to_tag proves both; Git untouched.
    - name: an ImageUpdater moves the Application to the repository's newest allowed tag
      try:
        - apply:
            resource:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              metadata:
                name: podinfo-e2e
                namespace: argocd
              spec:
                applicationRefs:
                  - namePattern: podinfo-e2e
                    images:
                      - alias: podinfo
                        imageName: ($image)
                        commonUpdateSettings:
                          updateStrategy: semver
                          allowTags: regexp:^6\.9\.[0-9]+$
                        manifestTargets:
                          helm:
                            name: image.repository
                            tag: image.tag
        - assert:
            resource:
              apiVersion: argocd-image-updater.argoproj.io/v1alpha1
              kind: ImageUpdater
              metadata:
                name: podinfo-e2e
                namespace: argocd
              status:
                applicationsMatched: 1
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: podinfo-e2e
                namespace: argocd
              spec:
                source:
                  helm:
                    (parameters[?name == 'image.tag'] || `[]`):
                      - value: ($values.to_tag)
                    (parameters[?name == 'image.repository'] || `[]`):
                      - value: ($image)
      catch:
        - describe:
            apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            namespace: argocd
            name: podinfo-e2e
        - describe:
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            namespace: argocd
            name: podinfo-e2e
        - podLogs:
            namespace: argocd-image-updater
            tail: 80
