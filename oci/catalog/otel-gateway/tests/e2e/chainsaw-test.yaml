# The otel_gateway module's proof (docs/catalog/otel-gateway.md): the
# cluster-level collector, on by default, for what applications push.
# Selected by label:
#   health   the ResourceSet Ready, the Deployment Available, its VMRule
#            shipped; its own telemetry scraped by the monitoring module's
#            vmagent through its annotation, and an application's OTLP — one
#            gauge posted by podinfo (the hello module) to the gateway's
#            Service — read back enriched by k8s_attributes with its sender's
#            workload (vm.sh). Neither the API server's service proxy nor a
#            port-forward can carry OTLP to the receivers (measured: a 415
#            from the proxy; a port-forward dials localhost, the receivers
#            bind the pod IP): podinfo's own curl does.
#   module   a client request beats the socle's; off garbage-collects the
#            release, the rules Kustomization and its VMRule; on brings them
#            back.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: otel-gateway-health
  labels:
    phase: health
    cloud: any
    platform: any
spec:
  description: >-
    The gateway's own telemetry is scraped, and an application's OTLP
    reaches VictoriaMetrics enriched with its sender.
  timeouts:
    assert: 5m
    exec: 5m
  steps:
    - name: the ResourceSet is Ready, the Deployment Available, its VMRule shipped
      try:
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: otel-gateway
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: otel-gateway
                namespace: otel-gateway
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMRule
              metadata:
                name: opentelemetry-collector
                namespace: otel-gateway
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: otel-gateway
            name: otel-gateway
        - events:
            namespace: otel-gateway
        - podLogs:
            namespace: otel-gateway
            tail: 40
    - name: its telemetry is scraped, and an application's OTLP reaches VictoriaMetrics
      try:
        - script:
            content: |
              . ./vm.sh
              # The pod's annotation, read by vmagent: the job the upstream
              # collector rules select on.
              wait_series 'otelcol_process_uptime{job="opentelemetry-collector",namespace="otel-gateway"}'
              post_otlp_metric socle.e2e.otlp_probe 7
              wait_series 'socle_e2e_otlp_probe{service_name="socle-e2e"}' 24
              # k8s_attributes matched the sender by its connection IP.
              wait_series 'socle_e2e_otlp_probe{k8s_namespace_name="hello",k8s_deployment_name="podinfo"}' 6
      catch:
        - podLogs:
            namespace: otel-gateway
            tail: 40
        - podLogs:
            namespace: monitoring
            selector: app.kubernetes.io/name=vmagent
            tail: 20
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: otel-gateway-module
  labels:
    phase: module
    cloud: any
    platform: any
spec:
  description: A client request wins over the socle's; off garbage-collects, on brings it back.
  timeouts:
    assert: 5m
    error: 5m
  steps:
    # 128Mi in the socle's document, its 100m request and 1Gi limit intact.
    - name: kube.otel_gateway.values beats the socle's memory request, its siblings kept
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    otel_gateway:
                      values:
                        resources:
                          requests:
                            memory: 320Mi
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: otel-gateway
                namespace: otel-gateway
              spec:
                template:
                  spec:
                    (containers[0].resources || `{}`):
                      requests:
                        cpu: 100m
                        memory: 320Mi
                      limits:
                        memory: 1Gi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    otel_gateway:
                      values:
                        resources: null
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: otel-gateway
            name: otel-gateway
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
    # The order of valuesFrom, proven whole (docs/architecture/flux-catalog.md): the
    # socle's document, then kube.otel_gateway.values, then the Secret the client
    # names in values_secret — created by him in the module's namespace, never
    # read by OpenTofu, merged last. 320Mi in values and 336Mi in the Secret:
    # the live object carries the Secret's; both cleared, the socle's 128Mi.
    - name: kube.otel_gateway.values_secret is merged last, over values and the socle
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: otel-gateway-e2e-values
                namespace: otel-gateway
                labels:
                  reconcile.fluxcd.io/watch: Enabled
              stringData:
                values.yaml: |
                  resources:
                    requests:
                      memory: 336Mi
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    otel_gateway:
                      values_secret: otel-gateway-e2e-values
                      values:
                        resources:
                          requests:
                            memory: 320Mi
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: otel-gateway
                namespace: otel-gateway
              spec:
                template:
                  spec:
                    (containers[0].resources || `{}`):
                      requests:
                        memory: 336Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    otel_gateway:
                      values_secret: ''
                      values:
                        resources: null
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: otel-gateway
                namespace: otel-gateway
              spec:
                template:
                  spec:
                    (containers[0].resources || `{}`):
                      requests:
                        memory: 128Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - delete:
            ref:
              apiVersion: v1
              kind: Secret
              name: otel-gateway-e2e-values
              namespace: otel-gateway
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: otel-gateway
            name: otel-gateway
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
    - name: enabled = false garbage-collects the release, the rules Kustomization and its VMRule
      try:
        # The release must be idle before the module goes: helm-controller
        # honours a deletion only once the running action returns, and the
        # values steps above have just driven an upgrade — turned off under
        # Helm's --wait, the namespace is garbage-collected, the rollout can
        # never finish, and the deletion waits the release's whole timeout
        # (five minutes, measured four times on external-dns).
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: otel-gateway
                namespace: otel-gateway
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Released'] || `[]`):
                  - status: 'True'
                (length(conditions[?type == 'Reconciling'] || `[]`)): 0
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    otel_gateway:
                      enabled: false
        - error:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: otel-gateway
                namespace: otel-gateway
        - error:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: otel-gateway-rules
                namespace: flux-system
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: otel-gateway
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: otel-gateway
        - podLogs:
            namespace: flux-system
            selector: app.kubernetes.io/name=flux-operator
            tail: 40
    - name: back to the defaults, the Deployment is Available and the VMRule is back
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    otel_gateway:
                      enabled: true
        - assert:
            resource:
              apiVersion: operator.victoriametrics.com/v1beta1
              kind: VMRule
              metadata:
                name: opentelemetry-collector
                namespace: otel-gateway
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: otel-gateway
                namespace: otel-gateway
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: otel-gateway
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: otel-gateway
            name: otel-gateway
        - events:
            namespace: otel-gateway
