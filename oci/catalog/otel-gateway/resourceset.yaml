# The otel_gateway module: the OpenTelemetry Collector as a Deployment, one
# replica, for what applications push — their OTLP metrics, logs and traces,
# with their pod's metadata — and the Kubernetes events, as logs. It
# collects no metric itself: the monitoring module's vmagent scrapes the
# cluster.
# The stack: docs/architecture/observability.md; this module:
# docs/catalog/otel-gateway.md.
#
# resourcesTemplate rather than resources: the exporters depend on what the
# monitoring module runs, and the Secret in valuesFrom only exists when
# named — the operator's block `<< if >>`/`<< end >>` is text templating, which
# the structured resources list cannot carry.
#
# Values: no spec.values on the HelmRelease. The socle's defaults are a
# ConfigMap listed first in valuesFrom, the client's second, his Secret last —
# later wins, so the client overrides any socle default (docs/architecture/flux-catalog.md).
#
# Every other rule is the hello module's: inputsFrom the one provider, the
# reconcile toggle on each resource, values tested never presence.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: otel-gateway
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  wait: true
  resourcesTemplate: |
    << $rules := and inputs.modules.otel_gateway.enabled inputs.modules.monitoring.enabled ->>
    apiVersion: v1
    kind: Namespace
    metadata:
      name: otel-gateway
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.otel_gateway.enabled >>enabled<< else >>disabled<< end >>
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: opentelemetry-collector-chart
      namespace: otel-gateway
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.otel_gateway.enabled >>enabled<< else >>disabled<< end >>
    spec:
      interval: 1h
      url: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-collector
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: 0.176.0  # appVersion 0.162.0
    ---
    # The socle's own chart values, as a document rather than the HelmRelease's
    # spec.values: helm-controller merges valuesFrom in order and then
    # spec.values over the result, so an inline socle default would beat the
    # client on every key both set. (No template delimiters in these
    # comments: the operator templates them too.)
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: otel-gateway-socle-values
      namespace: otel-gateway
      # helm-controller re-reconciles the release the moment a labelled
      # valuesFrom ConfigMap changes, instead of at its next interval.
      labels:
        reconcile.fluxcd.io/watch: Enabled
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.otel_gateway.enabled >>enabled<< else >>disabled<< end >>
    data:
      values.yaml: |
        mode: deployment
        replicaCount: 1
        # A constant name: applications send OTLP to
        # otel-gateway.otel-gateway.svc:4317 (gRPC) or :4318 (HTTP).
        fullnameOverride: otel-gateway
        # otelcol-k8s, as otel_agent: every signal crosses as OTLP.
        image:
          repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
        command:
          name: otelcol-k8s
        # The collector's own telemetry, on its pod's port 8888, scraped by the
        # monitoring module's vmagent like every annotated pod: the gateway
        # carries what applications push, and collects nothing itself
        # (docs/decisions/otel-gateway.md, OTEL-GATEWAY-05).
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8888"
        presets:
          # k8s_attributes: the sending pod's workload and namespace on what
          # applications push over OTLP, matched by connection IP.
          kubernetesAttributes:
            enabled: true
          << if and inputs.modules.monitoring.enabled inputs.modules.monitoring.logs.enabled >>
          # Kubernetes events, as logs: k8sobjects watching events.k8s.io,
          # deleted events excluded. One replica, so each event once.
          kubernetesEvents:
            enabled: true
          << end >>
        # OTLP in, gRPC and HTTP, on the Service only; the chart's Jaeger and
        # Zipkin receivers are off. No hostPort: the chart only sets those in
        # daemonset mode.
        ports:
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
          # The telemetry port the annotation names, declared: vmagent keeps
          # only the target on the port a pod declares (the monitoring
          # module's scrape of annotated pods). No hostPort, no Service use.
          metrics:
            enabled: true
        config:
          receivers:
            jaeger: null
            zipkin: null
            # The chart's self-scrape: vmagent scrapes the collector instead.
            prometheus: null
          exporters:
            debug: null
            << if inputs.modules.monitoring.enabled >>
            otlp_http/victoria-metrics:
              metrics_endpoint: http://vmsingle-monitoring.monitoring.svc:8428/opentelemetry/v1/metrics
            << else >>
            # No metrics backend: the pipeline must still end somewhere, and a
            # collector left retrying into a Service that is gone would only
            # fill its queue and its log.
            nop: {}
            << end >>
            << if and inputs.modules.monitoring.enabled inputs.modules.monitoring.logs.enabled >>
            otlp_http/victoria-logs:
              logs_endpoint: http://vlsingle-monitoring.monitoring.svc:9428/insert/opentelemetry/v1/logs
            << end >>
            << if and inputs.modules.monitoring.enabled inputs.modules.monitoring.traces.enabled >>
            otlp_http/victoria-traces:
              traces_endpoint: http://vtsingle-monitoring.monitoring.svc:10428/insert/opentelemetry/v1/traces
            << end >>
          service:
            pipelines:
              << if and inputs.modules.monitoring.enabled inputs.modules.monitoring.logs.enabled >>
              logs:
                # The applications' OTLP logs; the kubernetesEvents preset adds
                # k8sobjects to this list and kubernetesAttributes k8s_attributes
                # to the processors.
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlp_http/victoria-logs
              << else >>
              logs: null
              << end >>
              << if and inputs.modules.monitoring.enabled inputs.modules.monitoring.traces.enabled >>
              traces:
                # The applications' OTLP traces; the kubernetesAttributes
                # preset adds k8s_attributes to the processors.
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlp_http/victoria-traces
              << else >>
              traces: null
              << end >>
              metrics:
                # The applications' OTLP metrics; the kubernetesAttributes
                # preset adds k8s_attributes to the processors.
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  << if inputs.modules.monitoring.enabled >>
                  - otlp_http/victoria-metrics
                  << else >>
                  - nop
                  << end >>
        # Measured on floci at 45-50Mi and 5m while it also collected the
        # cluster's state and scrapes; the limit is the headroom.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            # Logs and scratch: no file storage, the sending queue in memory.
            ephemeral-storage: 64Mi
          # A limit, as otel_agent and for the same reason: GOMEMLIMIT and the
          # memory_limiter read it. Larger: this one replica carries every
          # application's OTLP.
          limits:
            memory: 1Gi
    ---
    # The client's own chart values, as he wrote them in kube.otel_gateway.values,
    # merged over the socle's document above — the client wins wherever the two
    # meet. OpenTofu refuses secrets in there.
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: otel-gateway-client-values
      namespace: otel-gateway
      labels:
        reconcile.fluxcd.io/watch: Enabled
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.otel_gateway.enabled >>enabled<< else >>disabled<< end >>
    data:
      values.yaml: |<< toYaml inputs.modules.otel_gateway.values | nindent 4 >>
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: otel-gateway
      namespace: otel-gateway
      annotations:
        fluxcd.controlplane.io/reconcile: << if inputs.modules.otel_gateway.enabled >>enabled<< else >>disabled<< end >>
    spec:
      interval: 10m
      releaseName: otel-gateway
      chartRef:
        kind: OCIRepository
        name: opentelemetry-collector-chart
      # No spec.values, on purpose: it would be merged last and win. The
      # order below is the precedence, later wins — the socle's defaults, the
      # client's values from kube.otel_gateway.values, then his Secret when he
      # named one, created by him in otel-gateway, never read by OpenTofu,
      # optional so the release does not wait for it.
      valuesFrom:
        - kind: ConfigMap
          name: otel-gateway-socle-values
          valuesKey: values.yaml
        - kind: ConfigMap
          name: otel-gateway-client-values
          valuesKey: values.yaml
        << if inputs.modules.otel_gateway.values_secret >>
        - kind: Secret
          name: << inputs.modules.otel_gateway.values_secret | quote >>
          valuesKey: values.yaml
          optional: true
        << end >>
      install:
        remediation:
          retries: 3
      upgrade:
        remediation:
          retries: 3
    ---
    # Both collectors' health rules, a VMRule the monitoring module's vmalert
    # reads (docs/catalog/monitoring.md). Applied from the socle artifact,
    # under this module's toggle and once the monitoring module has installed
    # the VMRule CRD: until then the Kustomization fails and retries every
    # minute. Inert with alerting off.
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: otel-gateway-rules
      namespace: flux-system
      annotations:
        fluxcd.controlplane.io/reconcile: << if $rules >>enabled<< else >>disabled<< end >>
    spec:
      interval: 1h
      retryInterval: 1m
      sourceRef:
        kind: OCIRepository
        name: socle
      path: ./catalog/otel-gateway/rules
      targetNamespace: otel-gateway
      prune: true
      wait: true
      timeout: 2m
