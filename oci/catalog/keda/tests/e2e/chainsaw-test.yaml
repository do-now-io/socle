# The keda module's proof (docs/catalog/keda.md): event-driven autoscaling,
# OFF by default — KEDA does nothing until a client writes a ScaledObject.
# Selected by label:
#   health   the disabled shape: the ResourceSet Ready with nothing rendered,
#            no namespace, no external metrics APIService.
#   module   on aws, in two halves. First with Crossplane off and no service
#            named, as a client with a cron or credential-based trigger gets
#            it: the three Deployments Available, the external metrics API
#            Available, a client value beating the socle's, the Secret
#            merged last, no Role and an empty cloud-access annotation; then
#            a Deployment scaled from one to zero on an empty SQS queue in
#            floci, to two on ten messages, back to zero on a purge — static
#            test keys through a TriggerAuthentication, awsEndpoint at
#            floci, the only `script` being the SQS calls (sqs.sh); then off,
#            the CRDs kept (helm.sh/resource-policy: keep) so a client's
#            ScaledObjects outlive the module. Second half, with Crossplane on
#            and services = ["sqs"]: the operator's own Role, pointed at floci
#            (the seam, its own steps), becomes an IAM role under
#            /socle/<cluster>/ whose one policy reads SQS queue attributes
#            and nothing else; the association never syncs on floci, so the
#            workload is withheld; off deletes the role.
#   module   on gcp (GKE, the sandbox), the module as its tfvars leave it,
#            services = ["pubsub"]: the ProjectIAMMember binding
#            roles/monitoring.viewer to the operator's principal, the
#            workload after it, and a ScaledObject on podIdentity gcp
#            scaling a Deployment to zero from Cloud Monitoring.
# Not provable on floci: the association reaching EKS, the operator getting
# the role's credentials, IAM enforcing the policy and the boundary — the
# sandbox's (docs/catalog/keda.md §6).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keda-health
  labels:
    phase: health
    cloud: any
    platform: any
spec:
  description: Off by default, the ResourceSet renders nothing and no external metrics API is registered.
  timeouts:
    assert: 3m
    error: 1m
  steps:
    - name: the ResourceSet is Ready with nothing in its inventory
      try:
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: keda
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries || `[]`)): 0
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: keda
        - error:
            resource:
              apiVersion: apiregistration.k8s.io/v1
              kind: APIService
              metadata:
                name: v1beta1.external.metrics.k8s.io
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: keda
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keda-module-aws
  labels:
    phase: module
    cloud: aws
    platform: any
spec:
  description: >-
    KEDA on without a role scales a Deployment on an SQS queue's depth; with
    Crossplane on and one service named, its own role reads that service only.
  timeouts:
    assert: 5m
    error: 5m
    exec: 3m
    delete: 3m
  steps:
    # 128Mi in the socle's document: the client's 160Mi on the live operator,
    # the socle's cpu request kept. No service named: no Role, and the
    # annotation that rolls the operator when one appears is empty.
    - name: enabled = true without a service converges, the client's value beats the socle's, no Role
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    keda:
                      enabled: true
                      values:
                        resources:
                          operator:
                            requests:
                              memory: 160Mi
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: keda
                namespace: keda
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keda-operator
                namespace: keda
              spec:
                template:
                  metadata:
                    annotations:
                      socle.do-now.io/cloud-access: ''
                  spec:
                    (containers[0].resources || `{}`):
                      requests:
                        cpu: 50m
                        memory: 160Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keda-operator-metrics-apiserver
                namespace: keda
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keda-admission-webhooks
                namespace: keda
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        # The external metrics API, registered by the metrics server and
        # answered by it: the HPA controller reads ScaledObject metrics there.
        - assert:
            resource:
              apiVersion: apiregistration.k8s.io/v1
              kind: APIService
              metadata:
                name: v1beta1.external.metrics.k8s.io
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: keda
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries[?contains(id, 'Role')] || `[]`)): 0
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: keda
            name: keda
        - describe:
            apiVersion: apiregistration.k8s.io/v1
            kind: APIService
            name: v1beta1.external.metrics.k8s.io
        - events:
            namespace: keda
        - podLogs:
            namespace: keda
            tail: 40
    # The order of valuesFrom, proven whole (docs/flux-catalog.md §6): the
    # socle's document, then kube.keda.values, then the Secret the client
    # names in values_secret, merged last; both cleared, the socle's 128Mi.
    - name: kube.keda.values_secret is merged last, over values and the socle
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: keda-e2e-values
                namespace: keda
                labels:
                  reconcile.fluxcd.io/watch: Enabled
              stringData:
                values.yaml: |
                  resources:
                    operator:
                      requests:
                        memory: 176Mi
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    keda:
                      values_secret: keda-e2e-values
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keda-operator
                namespace: keda
              spec:
                template:
                  spec:
                    (containers[0].resources || `{}`):
                      requests:
                        cpu: 50m
                        memory: 176Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    keda:
                      values_secret: ''
                      values:
                        resources: null
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keda-operator
                namespace: keda
              spec:
                template:
                  spec:
                    (containers[0].resources || `{}`):
                      requests:
                        memory: 128Mi
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - delete:
            ref:
              apiVersion: v1
              kind: Secret
              name: keda-e2e-values
              namespace: keda
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: keda
            name: keda
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
    # A client's workload: static test keys through a TriggerAuthentication —
    # never through kube.keda.values, which refuses them — a Deployment at
    # one, a ScaledObject on the queue's depth with awsEndpoint at floci as
    # the operator pod reaches it. Empty queue: 1 → 0. Ten messages,
    # queueLength 5: 0 → 2. Purged: back to 0 after the cooldown.
    - name: a ScaledObject scales a Deployment on an SQS queue in floci, down to zero and back
      try:
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: QUEUE
                value: ($values.queue)
            content: |
              . ./sqs.sh
              queue_create
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($values.apps)
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: sqs-keys
                namespace: ($values.apps)
              stringData:
                AWS_ACCESS_KEY_ID: test
                AWS_SECRET_ACCESS_KEY: test
        - apply:
            resource:
              apiVersion: keda.sh/v1alpha1
              kind: TriggerAuthentication
              metadata:
                name: sqs-keys
                namespace: ($values.apps)
              spec:
                secretTargetRef:
                  - parameter: awsAccessKeyID
                    name: sqs-keys
                    key: AWS_ACCESS_KEY_ID
                  - parameter: awsSecretAccessKey
                    name: sqs-keys
                    key: AWS_SECRET_ACCESS_KEY
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: worker
                namespace: ($values.apps)
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: worker
                template:
                  metadata:
                    labels:
                      app: worker
                  spec:
                    containers:
                      - name: worker
                        image: registry.k8s.io/pause:3.10
                        securityContext:
                          allowPrivilegeEscalation: false
                          runAsNonRoot: true
                          runAsUser: 65534
                          capabilities:
                            drop: [ALL]
                          seccompProfile:
                            type: RuntimeDefault
        - apply:
            resource:
              apiVersion: keda.sh/v1alpha1
              kind: ScaledObject
              metadata:
                name: worker
                namespace: ($values.apps)
              spec:
                scaleTargetRef:
                  name: worker
                minReplicaCount: 0
                maxReplicaCount: 3
                pollingInterval: 5
                cooldownPeriod: 15
                triggers:
                  - type: aws-sqs-queue
                    authenticationRef:
                      name: sqs-keys
                    metadata:
                      queueURL: (join('', ['http://', $values.floci_ip, ':4566/000000000000/', $values.queue]))
                      queueLength: '5'
                      awsRegion: eu-west-3
                      awsEndpoint: (join('', ['http://', $values.floci_ip, ':4566']))
        - assert:
            resource:
              apiVersion: keda.sh/v1alpha1
              kind: ScaledObject
              metadata:
                name: worker
                namespace: ($values.apps)
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: worker
                namespace: ($values.apps)
              spec:
                replicas: 0
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: QUEUE
                value: ($values.queue)
            content: |
              . ./sqs.sh
              queue_fill 10
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: worker
                namespace: ($values.apps)
              spec:
                replicas: 2
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: QUEUE
                value: ($values.queue)
            content: |
              . ./sqs.sh
              queue_purge
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: worker
                namespace: ($values.apps)
              spec:
                replicas: 0
        # The ScaledObject goes while the operator still runs: its finalizer
        # hands the Deployment back at the last count, cleanly.
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: ($values.apps)
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: QUEUE
                value: ($values.queue)
            content: |
              . ./sqs.sh
              queue_delete
      catch:
        - describe:
            apiVersion: keda.sh/v1alpha1
            kind: ScaledObject
            namespace: ($values.apps)
            name: worker
        - get:
            apiVersion: autoscaling/v2
            kind: HorizontalPodAutoscaler
            namespace: ($values.apps)
        - podLogs:
            namespace: keda
            selector: app=keda-operator
            tail: 40
    # Off: the release, the namespace and the APIService go; the six keda.sh
    # CRDs stay (helm.sh/resource-policy: keep) so a client's ScaledObjects
    # outlive the module.
    - name: enabled = false garbage-collects the module, the CRDs stay
      try:
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: keda
                namespace: keda
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Released'] || `[]`):
                  - status: 'True'
                (length(conditions[?type == 'Reconciling'] || `[]`)): 0
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    keda:
                      enabled: false
        - error:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: keda
                namespace: keda
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: keda
        - error:
            resource:
              apiVersion: apiregistration.k8s.io/v1
              kind: APIService
              metadata:
                name: v1beta1.external.metrics.k8s.io
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: scaledobjects.keda.sh
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: keda
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries || `[]`)): 0
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: keda
        - podLogs:
            namespace: flux-system
            selector: app.kubernetes.io/name=flux-operator
            tail: 40
    # Second half: the operator's own AWS access (docs/catalog/keda.md §2),
    # one service named. In the order their CRDs appear: the release, the
    # providers Healthy, then the module's objects.
    - name: with Crossplane on and services = ["sqs"], the module declares its Role and its association
      timeouts:
        assert: 8m
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    crossplane:
                      enabled: true
                    keda:
                      enabled: true
                      services:
                        - sqs
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: crossplane
                namespace: crossplane-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: pkg.crossplane.io/v1
              kind: Provider
              metadata:
                name: provider-aws-iam
              status:
                (conditions[?type == 'Healthy'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: pkg.crossplane.io/v1
              kind: Provider
              metadata:
                name: provider-aws-eks
              status:
                (conditions[?type == 'Healthy'] || `[]`):
                  - status: 'True'
        # A Provider is Healthy before every CRD it brings is served, and an
        # assert on a kind not served yet fails at once (run 36873861215,
        # once the S3 provider joined the family): the CRDs Established first.
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: roles.iam.aws.m.upbound.io
              status:
                (conditions[?type == 'Established'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: podidentityassociations.eks.aws.m.upbound.io
              status:
                (conditions[?type == 'Established'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: keda-operator
                namespace: keda
                annotations:
                  crossplane.io/external-name: (join('', [$values.cluster, '-keda-operator']))
              spec:
                forProvider:
                  path: (join('', ['/socle/', $values.cluster, '/']))
        - assert:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: keda-operator
                namespace: keda
              spec:
                forProvider:
                  namespace: keda
                  serviceAccount: keda-operator
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
        - describe:
            apiVersion: pkg.crossplane.io/v1
            kind: Provider
        - events:
            namespace: crossplane-system
        - podLogs:
            namespace: crossplane-system
            tail: 40
    # floci seam: the module leaves providerConfigRef at its default, the
    # socle's Pod Identity ClusterProviderConfig, which floci cannot serve.
    # floci's own is named after the fact. Deleted the day floci serves Pod
    # Identity. skipDelete: the last step removes these two itself, before
    # Crossplane goes.
    - name: 'floci seam: a ClusterProviderConfig with static keys, and the module''s resources pointed at it'
      skipDelete: true
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: floci-credentials
                namespace: crossplane-system
              stringData:
                credentials: |
                  [default]
                  aws_access_key_id = test
                  aws_secret_access_key = test
        - apply:
            resource:
              apiVersion: aws.m.upbound.io/v1beta1
              kind: ClusterProviderConfig
              metadata:
                name: floci
              spec:
                credentials:
                  source: Secret
                  secretRef:
                    namespace: crossplane-system
                    name: floci-credentials
                    key: credentials
                endpoint:
                  hostnameImmutable: true
                  services: [iam, eks, sts]
                  url:
                    type: Static
                    static: (join('', ['http://', $values.floci_ip, ':4566']))
                skip_credentials_validation: true
                skip_metadata_api_check: true
                skip_region_validation: true
                skip_requesting_account_id: true
        - patch:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: keda-operator
                namespace: keda
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: floci
        - patch:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: keda-operator
                namespace: keda
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: floci
    # Named: sqs, so its one read call. Not named: everything else — the
    # policy carries no other service and no wildcard action. Read from what
    # Crossplane reports (status.atProvider).
    - name: the Role becomes an IAM role whose one policy reads SQS queue attributes and nothing else
      try:
        - assert:
            resource:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                name: keda-operator
                namespace: keda
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                atProvider:
                  arn: (join('', ['arn:aws:iam::000000000000:role/socle/', $values.cluster, '/', $values.cluster, '-keda-operator']))
                  (contains(assumeRolePolicy || '', 'pods.eks.amazonaws.com')): true
                  (inlinePolicy[?name == 'scalers'] || `[]`):
                    - (contains(policy || '', '"sqs:GetQueueAttributes"')): true
                      (contains(policy || '', 'cloudwatch:')): false
                      (contains(policy || '', 'kinesis:')): false
                      (contains(policy || '', 'dynamodb:')): false
                      (contains(policy || '', '"sqs:*"')): false
                      (contains(policy || '', 'sqs:SendMessage')): false
                      (contains(policy || '', 'sqs:ReceiveMessage')): false
      catch:
        - describe:
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            namespace: keda
            name: keda-operator
        - podLogs:
            namespace: crossplane-system
            selector: pkg.crossplane.io/provider=provider-aws-iam
            tail: 40
    # floci seam, second half: the association never syncs (floci 2.1.0 has
    # no association API), so the workload's dependsOn is never met and the
    # chart must never have been applied. Asserted as such so that the day
    # it syncs this step fails and goes with the seam above.
    - name: 'floci seam: the association cannot sync, so the workload is withheld'
      try:
        - assert:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: keda-operator
                namespace: keda
              status:
                (conditions[?type == 'Synced'] || `[]`):
                  - status: 'False'
        - sleep:
            duration: 60s
        - error:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: keda
                namespace: keda
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: keda-workload
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'False'
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: keda-workload
        - describe:
            apiVersion: eks.aws.m.upbound.io/v1beta1
            kind: PodIdentityAssociation
            namespace: keda
            name: keda-operator
    # The association's finalizer waits on an API floci does not have:
    # released by hand, the only thing done here a real cluster does not
    # need. Then the module off deletes the IAM role and the namespace goes;
    # the seam's objects removed before Crossplane, Crossplane off last. No
    # idle gate: the release was withheld, there is none to wait for.
    - name: off, the IAM role is deleted and the namespace goes
      try:
        - patch:
            resource:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: PodIdentityAssociation
              metadata:
                name: keda-operator
                namespace: keda
                finalizers: []
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    keda:
                      enabled: false
                      services: []
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: keda
        - script:
            env:
              - name: AWS_ENDPOINT_URL
                value: http://localhost:4566
              - name: ROLE
                value: (join('', [$values.cluster, '-keda-operator']))
            content: |
              for _ in $(seq 1 30); do
                aws iam get-role --role-name "$ROLE" > /dev/null 2>&1 || { echo "IAM role $ROLE gone"; exit 0; }
                sleep 2
              done
              echo "IAM role $ROLE survived the module turned off"; exit 1
        - delete:
            ref:
              apiVersion: aws.m.upbound.io/v1beta1
              kind: ClusterProviderConfig
              name: floci
        - delete:
            ref:
              apiVersion: v1
              kind: Secret
              name: floci-credentials
              namespace: crossplane-system
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    crossplane:
                      enabled: false
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: crossplane-system
      catch:
        - describe:
            apiVersion: v1
            kind: Namespace
            name: keda
        - describe:
            apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            namespace: keda
            name: keda-operator
        - podLogs:
            namespace: flux-system
            selector: app.kubernetes.io/name=flux-operator
            tail: 40
---
# On GKE, against the sandbox (docs/catalog/keda.md §6): the module as the
# client's tfvars leave it — keda on, Crossplane on, services = ["pubsub"],
# roles/monitoring.viewer in gcp.crossplane.allowed_roles. Like the
# crossplane module's gcp test, it reads the module as it stands and never
# turns it off. The proof that matters is the last step: the operator reads
# Cloud Monitoring as its own principal, through the binding the module
# declared, with no key and no Google service account — what floci could
# never show on AWS.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: keda-module-gcp
  labels:
    phase: module
    cloud: gcp
    platform: gke
spec:
  description: >-
    With services = ["pubsub"], the operator's principal holds
    roles/monitoring.viewer, and a ScaledObject on podIdentity gcp scales a
    Deployment to zero from Cloud Monitoring.
  timeouts:
    # Autopilot provisions a node for pods that do not fit, minutes before a
    # Deployment is Available; IAM takes up to minutes to propagate.
    assert: 10m
    error: 3m
    delete: 3m
  steps:
    # The binding the module declares, read from the spec Crossplane applies:
    # the one role, on the operator's own principal — the project's
    # Workload Identity pool, ns/keda/sa/keda-operator — in the project the
    # root wrote. No Google service account anywhere.
    - name: the ProjectIAMMember binds roles/monitoring.viewer to the operator's principal, Ready
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: projectiammembers.cloudplatform.gcp.m.upbound.io
              status:
                (conditions[?type == 'Established'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                name: keda-operator
                namespace: keda
              spec:
                forProvider:
                  role: roles/monitoring.viewer
                  (length(project) > `0`): true
                  (starts_with(member, 'principal://iam.googleapis.com/projects/')): true
                  (ends_with(member, '.svc.id.goog/subject/ns/keda/sa/keda-operator')): true
                  (contains(member, join('', ['/workloadIdentityPools/', project, '.svc.id.goog/']))): true
              status:
                (conditions[?type == 'Synced'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectIAMMember
            namespace: keda
            name: keda-operator
        - podLogs:
            namespace: crossplane-system
            selector: pkg.crossplane.io/provider=provider-gcp-cloudplatform
            tail: 40
    # The chart only after the binding (the child's dependsOn), the operator
    # on its own ServiceAccount with no iam.gke.io/gcp-service-account
    # annotation — the principal is the ServiceAccount itself — and the
    # annotation that names its access.
    - name: the workload converges after the binding, the operator as keda/keda-operator, no Google service account
      try:
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: keda-workload
                namespace: flux-system
              spec:
                (dependsOn[?kind == 'ProjectIAMMember'] || `[]`):
                  - name: keda-operator
                    namespace: keda
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: keda
                namespace: keda
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: keda-operator
                namespace: keda
                (annotations."iam.gke.io/gcp-service-account" || ''): ''
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keda-operator
                namespace: keda
              spec:
                template:
                  metadata:
                    annotations:
                      socle.do-now.io/cloud-access: pubsub
                  spec:
                    serviceAccountName: keda-operator
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keda-operator-metrics-apiserver
                namespace: keda
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keda-admission-webhooks
                namespace: keda
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: apiregistration.k8s.io/v1
              kind: APIService
              metadata:
                name: v1beta1.external.metrics.k8s.io
              status:
                (conditions[?type == 'Available'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: keda
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: keda-workload
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: keda
            name: keda
        - events:
            namespace: keda
        - podLogs:
            namespace: keda
            tail: 40
    # A client's workload, credentials from nowhere: a TriggerAuthentication
    # on podIdentity gcp, so the operator reads with its own principal. The
    # subscription does not exist, on purpose: Cloud Monitoring answers an
    # authorised query on it with no series, which valueIfNull turns into 0,
    # and the Deployment goes from one to zero. A denied query is a scaler
    # error, and KEDA never scales on an error — so zero replicas is reached
    # only through a read Cloud Monitoring allowed. Publishing to a real
    # subscription would take a script, which these tests do without.
    - name: a ScaledObject on podIdentity gcp reads Cloud Monitoring as the operator, and scales a Deployment to zero
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($values.apps)
        - apply:
            resource:
              apiVersion: keda.sh/v1alpha1
              kind: TriggerAuthentication
              metadata:
                name: operator-principal
                namespace: ($values.apps)
              spec:
                podIdentity:
                  provider: gcp
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: worker
                namespace: ($values.apps)
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: worker
                template:
                  metadata:
                    labels:
                      app: worker
                  spec:
                    containers:
                      - name: worker
                        image: registry.k8s.io/pause:3.10
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
                        securityContext:
                          allowPrivilegeEscalation: false
                          runAsNonRoot: true
                          runAsUser: 65534
                          capabilities:
                            drop: [ALL]
                          seccompProfile:
                            type: RuntimeDefault
        - apply:
            resource:
              apiVersion: keda.sh/v1alpha1
              kind: ScaledObject
              metadata:
                name: worker
                namespace: ($values.apps)
              spec:
                scaleTargetRef:
                  name: worker
                minReplicaCount: 0
                maxReplicaCount: 3
                pollingInterval: 5
                cooldownPeriod: 15
                triggers:
                  - type: gcp-pubsub
                    authenticationRef:
                      name: operator-principal
                    metadata:
                      subscriptionName: ($values.subscription)
                      value: '5'
                      valueIfNull: '0'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: worker
                namespace: ($values.apps)
              spec:
                replicas: 0
        - assert:
            resource:
              apiVersion: keda.sh/v1alpha1
              kind: ScaledObject
              metadata:
                name: worker
                namespace: ($values.apps)
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Active'] || `[]`):
                  - status: 'False'
        # The ScaledObject goes while the operator still runs: its finalizer
        # hands the Deployment back cleanly.
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: ($values.apps)
      catch:
        - describe:
            apiVersion: keda.sh/v1alpha1
            kind: ScaledObject
            namespace: ($values.apps)
            name: worker
        - get:
            apiVersion: autoscaling/v2
            kind: HorizontalPodAutoscaler
            namespace: ($values.apps)
        - podLogs:
            namespace: keda
            selector: app=keda-operator
            tail: 40
