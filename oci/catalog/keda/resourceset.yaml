# The keda module: event-driven autoscaling. A ScaledObject scales a
# Deployment on a queue's depth, a cron window, a PromQL query — and down to
# zero. docs/catalog/keda.md is the module's page; the rules of
# docs/reference/catalog-module-standard.md apply: inputsFrom the one provider, the reconcile
# toggle on EACH resource, values tested never presence.
#
# What is the same on every cloud. The operator's own cloud access is the
# cloud's, a step named cloud that the cloud inserts before workload
# (docs/decisions/socle.md, SOCLE-32): on aws its IAM role,
# oci/clusters/aws/keda/patch.yaml; on gcp a Cloud Monitoring binding on its
# Workload Identity principal, oci/clusters/gcp/keda/patch.yaml.
#
# Values, in the order helm-controller merges them, later winning
# (docs/decisions/socle.md#socle-06-the-clients-values-win): keda-socle-values, the socle's defaults below;
# keda-cloud-values, the cloud step's; keda-client-values, kube.keda.values;
# then the client's Secret when they name one. No inline `values:` on the
# HelmRelease — helm-controller merges it last, so it would beat the client
# on every key.
#
# Cloud access — the one decision this module makes (docs/catalog/keda.md):
# KEDA's operator reads queue metrics on behalf of the client's workloads, so
# by default it has no cloud role at all: KEDA does nothing until a client
# writes a ScaledObject, and a cron or Prometheus trigger needs no cloud.
# kube.keda.services names the services of the cluster's cloud the
# operator's own identity may READ — on aws sqs, cloudwatch, kinesis,
# dynamodb; on gcp pubsub — and only those, never `*`.
#
# Steps, each applied once the one before is healthy: namespace, then
# workload — the chart. A cloud's step between them is healthy only once
# what the operator pod needs from the cloud is there.
#
# resourcesTemplate rather than resources: the optional Secret entry is
# conditional text, which the structured list cannot carry.
#
# Fixed by decision, not exposed through a named attribute (values can still
# override any of it):
# - the chart, from the project's own Helm repository. KEDA publishes no OCI
#   chart (ghcr.io/kedacore/charts/keda: 403 for an anonymous pull, measured
#   on 2026-09-30), so this is an HTTPS HelmRepository, pinned exactly.
# - the ServiceAccount is named keda-operator in namespace keda: the subject
#   the module's own cloud identity is bound to. Only the operator talks to
#   the cloud; the metrics server reads the operator over gRPC, the
#   admission webhooks read nothing.
# - the CRDs are kept on uninstall (helm.sh/resource-policy: keep): turning
#   the module off removes KEDA, never the client's ScaledObjects.
# - the admission webhooks stay, failurePolicy Ignore (the chart's default,
#   stated): a webhook outage never blocks a ScaledObject, the operator
#   still refuses an invalid one at reconcile.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: keda
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: socle
  wait: true
  steps:
    - name: namespace
      resourcesTemplate: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: keda
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
          labels:
            # The chart's three pods run non-root, read-only, no capabilities,
            # default seccomp: restricted holds, and pins it.
            pod-security.kubernetes.io/enforce: restricted
    - name: workload
      resourcesTemplate: |
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: HelmRepository
        metadata:
          name: kedacore
          namespace: keda
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          url: https://kedacore.github.io/charts
        ---
        # The socle's defaults. Everything the client may override through values.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: keda-socle-values
          namespace: keda
          labels:
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |
            # The identity the module binds its cloud role to. Renaming it
            # through values breaks that binding: a convenience, not a lock.
            serviceAccount:
              operator:
                name: keda-operator
            crds:
              install: true
              # Kept on uninstall: the client's ScaledObjects outlive the module.
              additionalAnnotations:
                helm.sh/resource-policy: keep
            # The external metrics API, one per cluster; nothing else in the
            # catalog registers it (metrics-server is metrics.k8s.io).
            metricsServer:
              registerAPIService: true
            webhooks:
              enabled: true
              failurePolicy: Ignore
            # Metrics for the monitoring module's vmagent, over plain HTTP on
            # 8080: the operator (scalers and ScaledObjects), the metrics
            # adapter (which annotates its own pod) and the webhooks.
            prometheus:
              operator:
                enabled: true
              metricServer:
                enabled: true
              webhooks:
                enabled: true
            podAnnotations:
              keda:
                prometheus.io/scrape: "true"
                prometheus.io/port: "8080"
              webhooks:
                prometheus.io/scrape: "true"
                prometheus.io/port: "8080"
            # Requests sized for an idle KEDA; the chart's limits (1 CPU, 1000Mi
            # each) are kept as a ceiling. ephemeral-storage declared on every
            # cloud: GKE Autopilot reserves 1Gi for a container that declares
            # none (docs/decisions/gcp.md, GCP-01).
            resources:
              operator:
                requests:
                  cpu: 50m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              metricServer:
                requests:
                  cpu: 25m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
              webhooks:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 64Mi
        ---
        # The client's own chart values, as written in kube.keda.values.
        # OpenTofu refuses secrets in there.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: keda-client-values
          namespace: keda
          labels:
            # helm-controller watches a valuesFrom ConfigMap only with this label;
            # without it, a change here waits for the next interval (10m).
            reconcile.fluxcd.io/watch: Enabled
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
        data:
          values.yaml: |<< toYaml inputs.modules.keda.values | nindent 8 >>
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: keda
          namespace: keda
          annotations:
            fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
        spec:
          interval: 10m
          releaseName: keda
          install:
            remediation:
              retries: 3
          upgrade:
            remediation:
              retries: 3
          chart:
            spec:
              chart: keda
              version: 2.21.0  # appVersion 2.21.0
              sourceRef:
                kind: HelmRepository
                name: kedacore
          # Merged in this order, later wins; nothing inline after them. The
          # client's Secret needs the reconcile.fluxcd.io/watch: Enabled label too
          # for a change to apply before the next interval.
          valuesFrom:
            - kind: ConfigMap
              name: keda-socle-values
              valuesKey: values.yaml
            # The cloud step's, when the cloud has values for the chart.
            - kind: ConfigMap
              name: keda-cloud-values
              valuesKey: values.yaml
              optional: true
            - kind: ConfigMap
              name: keda-client-values
              valuesKey: values.yaml
            << if inputs.modules.keda.values_secret >>
            - kind: Secret
              name: << inputs.modules.keda.values_secret | quote >>
              valuesKey: values.yaml
              optional: true
            << end >>
        << $monitored := and inputs.modules.keda.enabled inputs.modules.monitoring.enabled ->>
        ---
        # The module's monitoring — its alert rules and its dashboard, from
        # monitoring/ in the socle artifact: VMRules and a ConfigMap Grafana's
        # sidecar loads. Present only while both this module and the monitoring
        # module are on: monitoring brings the VMRule CRD, and until it has the
        # Kustomization fails and retries every minute
        # (docs/decisions/monitoring.md, MONITORING-12).
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: keda-monitoring
          namespace: flux-system
          annotations:
            fluxcd.controlplane.io/reconcile: << if $monitored >>enabled<< else >>disabled<< end >>
        spec:
          interval: 1h
          retryInterval: 1m
          sourceRef:
            kind: OCIRepository
            name: socle
          path: ./catalog/keda/monitoring
          targetNamespace: keda
          prune: true
          wait: true
          timeout: 2m
