# The kyverno_policies module's proof (docs/catalog/kyverno-policies.md): the
# socle's policy set on the kyverno engine, both OFF by default. Selected by
# label:
#   health   the disabled shape: the ResourceSet Ready with nothing rendered.
#   module   the issue's proof (#57), in order: a privileged pod admitted and
#            reported in Audit, refused in Enforce; Kyverno's admission down,
#            Flux still reconciles a module and the Enforce policy still
#            refuses — the API server's native policy, not Kyverno's webhook;
#            then every named attribute (profile, allowed_registries), the
#            whole valuesFrom order, and off — the policies and their native
#            twins gone. The test pods live in Chainsaw's own namespace, which
#            no policy excludes.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-policies-health
  labels:
    phase: health
    cloud: any
    platform: any
spec:
  description: Off by default, the ResourceSet renders nothing.
  timeouts:
    assert: 3m
    error: 1m
  steps:
    - name: the ResourceSet is Ready with nothing in its inventory, and no policy
      try:
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: kyverno-policies
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries || `[]`)): 0
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: kyverno-policies
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: kyverno-policies
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-policies-module
  labels:
    phase: module
    cloud: any
    platform: any
spec:
  description: >-
    Audit reports, Enforce refuses, Kyverno down neither blocks Flux nor lets
    an Enforce violation through; the attributes and the client's values
    reach the policies; off removes them.
  timeouts:
    assert: 5m
    error: 5m
    exec: 5m
  steps:
    - name: kyverno and kyverno_policies on, the baseline set converges in Audit
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno:
                      enabled: true
                    kyverno_policies:
                      enabled: true
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: kyverno-policies
                namespace: kyverno-policies
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
        # The chart's baseline profile and the socle's two unconditional
        # policies, each in Audit, its webhook in Ignore, the control plane,
        # Flux and Kyverno excluded, the pod-controller autogen off.
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: disallow-privileged-containers
              spec:
                validationActions: [Audit]
                failurePolicy: Ignore
                autogen:
                  podControllers:
                    controllers: [none]
                (matchConditions[?name == 'exclude-namespaces'] || `[]`):
                  - (contains(expression, 'flux-system')): true
                    (contains(expression, 'kube-system')): true
              status:
                (conditionStatus.conditions[?type == 'WebhookConfigured'] || `[]`):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: require-requests
              spec:
                validationActions: [Audit]
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: disallow-latest-tag
              spec:
                validationActions: [Audit]
        # otel_agent's hostPath, exempted by name on the one policy it fails.
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: disallow-host-path
              spec:
                (matchConditions[?name == 'exclude-namespaces'] || `[]`):
                  - (contains(expression, 'otel-agent')): true
        # No allow-list named, no registry policy; baseline, no restricted one.
        - error:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: restrict-image-registries
        - error:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: require-run-as-nonroot
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: kyverno-policies
            name: kyverno-policies
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: kyverno
            name: kyverno
        - events:
            namespace: kyverno
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
    - name: in Audit, a privileged pod is admitted and reported
      try:
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: privileged-audit
              spec:
                containers:
                  - name: pause
                    image: registry.k8s.io/pause:3.10
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                    securityContext:
                      privileged: true
        - assert:
            resource:
              apiVersion: wgpolicyk8s.io/v1alpha2
              kind: PolicyReport
              metadata:
                namespace: ($namespace)
              scope:
                kind: Pod
                name: privileged-audit
              (length(results[?policy == 'disallow-privileged-containers' && result == 'fail'] || `[]`) > `0`): true
        # The same verdict, as the engine counts it for the dashboard: the
        # series reaches VictoriaMetrics through otel_gateway's scrape.
        - script:
            content: |
              . ./vm.sh
              if ! kubectl -n victoria-metrics get service victoria-metrics > /dev/null 2>&1; then
                echo "victoria_metrics is off on this root: the metric is not checked"
                exit 0
              fi
              wait_series 'kyverno_validating_policy_results_total{policy_name="disallow-privileged-containers",result="fail"}'
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
            namespace: ($namespace)
            name: privileged-audit
        - get:
            apiVersion: wgpolicyk8s.io/v1alpha2
            kind: PolicyReport
            namespace: ($namespace)
        - podLogs:
            namespace: kyverno
            selector: app.kubernetes.io/component=reports-controller
            tail: 40
    # enforce: the policy is switched to Deny and compiled into a native
    # ValidatingAdmissionPolicy and its binding, owned by the policy.
    - name: kube.kyverno_policies.enforce refuses a privileged pod, through a native ValidatingAdmissionPolicy
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno_policies:
                      enforce: [disallow-privileged-containers]
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: disallow-privileged-containers
              spec:
                validationActions: [Deny]
                autogen:
                  validatingAdmissionPolicy:
                    enabled: true
              status:
                generated: true
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: vpol-disallow-privileged-containers-binding
              spec:
                policyName: vpol-disallow-privileged-containers
                validationActions: [Deny]
        # The binding exists before the API server applies it: its admission
        # plugin loads a new policy from an informer, and a pod created in
        # between is admitted (measured on floci, run 36874477467: created 3 s
        # after the binding). A server-side dry run goes through admission and
        # creates nothing: retried until the native policy refuses.
        - script:
            content: |
              probe='{"spec":{"containers":[{"name":"vap-probe","image":"registry.k8s.io/pause:3.10",
                "securityContext":{"privileged":true}}]}}'
              for i in $(seq 1 30); do
                out="$(kubectl -n "$NAMESPACE" run vap-probe --image=registry.k8s.io/pause:3.10 \
                  --dry-run=server --overrides="$probe" 2>&1)"
                case "$out" in
                  *ValidatingAdmissionPolicy*) echo "native policy enforced after $((i * 2)) s"; exit 0;;
                esac
                sleep 2
              done
              echo "the native policy never refused: $out"
              exit 1
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: privileged-enforce
              spec:
                containers:
                  - name: pause
                    image: registry.k8s.io/pause:3.10
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                    securityContext:
                      privileged: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'disallow-privileged-containers')): true
      catch:
        - describe:
            apiVersion: policies.kyverno.io/v1beta1
            kind: ValidatingPolicy
            name: disallow-privileged-containers
        - get:
            apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicy
        - podLogs:
            namespace: kyverno
            selector: app.kubernetes.io/component=admission-controller
            tail: 40
    # The failure the issue fears: an admission webhook down blocks every
    # apply. Kyverno's admission scaled to zero (helm-controller corrects no
    # drift, so it stays there until the step puts it back): Flux applies a
    # change to another module and its pods are admitted; the Enforce policy
    # still refuses, natively; an Audit-only violation is admitted.
    - name: with Kyverno's admission down, Flux still reconciles and the Enforce policy still refuses
      try:
        - patch:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-admission-controller
                namespace: kyverno
              spec:
                replicas: 0
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kyverno
                labels:
                  app.kubernetes.io/component: admission-controller
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    hello:
                      replicas: 2
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: podinfo
                namespace: hello
              spec:
                replicas: 2
              status:
                readyReplicas: 2
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: privileged-down
              spec:
                containers:
                  - name: pause
                    image: registry.k8s.io/pause:3.10
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                    securityContext:
                      privileged: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'ValidatingAdmissionPolicy')): true
        # No requests: require-requests is Audit, its webhook Ignore, the
        # webhook has no server — admitted.
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: no-requests-down
              spec:
                containers:
                  - name: pause
                    image: registry.k8s.io/pause:3.10
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: hello
            name: podinfo
        - events:
            namespace: hello
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
    # Chainsaw's finally takes no patch: the admission comes back in a step
    # of its own, and podinfo with it.
    - name: Kyverno's admission and podinfo are back as they were
      try:
        - patch:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-admission-controller
                namespace: kyverno
              spec:
                replicas: 3
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    hello:
                      replicas: 1
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-admission-controller
                namespace: kyverno
              status:
                readyReplicas: 3
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: podinfo
                namespace: hello
              spec:
                replicas: 1
      catch:
        - events:
            namespace: kyverno
    - name: kube.kyverno_policies.allowed_registries renders the allow-list, and a pod from elsewhere is reported
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno_policies:
                      allowed_registries: [registry.k8s.io]
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: restrict-image-registries
              spec:
                validationActions: [Audit]
                (variables[?name == 'allowed'] || `[]`):
                  - (contains(expression, 'registry.k8s.io/')): true
        # A Docker Hub short name is docker.io's: not allowed, reported.
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: elsewhere
              spec:
                # sleep as PID 1 ignores SIGTERM: without this, Chainsaw's
                # cleanup waits the default 30 s grace and times out.
                terminationGracePeriodSeconds: 0
                containers:
                  - name: busybox
                    image: busybox:1.37
                    command: [sleep, '3600']
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
        - assert:
            resource:
              apiVersion: wgpolicyk8s.io/v1alpha2
              kind: PolicyReport
              metadata:
                namespace: ($namespace)
              scope:
                kind: Pod
                name: elsewhere
              (length(results[?policy == 'restrict-image-registries' && result == 'fail'] || `[]`) > `0`): true
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno_policies:
                      allowed_registries: []
        - error:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: restrict-image-registries
      catch:
        - describe:
            apiVersion: policies.kyverno.io/v1beta1
            kind: ValidatingPolicy
            name: restrict-image-registries
        - get:
            apiVersion: wgpolicyk8s.io/v1alpha2
            kind: PolicyReport
            namespace: ($namespace)
    # restricted: the chart's six restricted policies on top of baseline. The
    # script prints what each says of the socle's own components — the
    # measurement behind docs/catalog/kyverno-policies.md, not an assertion.
    - name: kube.kyverno_policies.profile = restricted adds the restricted policies
      try:
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno_policies:
                      profile: restricted
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: require-run-as-nonroot
              spec:
                validationActions: [Audit]
                (matchConditions[?name == 'exclude-namespaces'] || `[]`):
                  - (contains(expression, 'otel-agent')): true
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: restrict-seccomp-strict
        - script:
            content: |
              # The background scan reports what already runs; give it a pass.
              sleep 60
              kubectl get policyreports -A -o json | python3 -c '
              import sys, json, collections
              fails = collections.defaultdict(set)
              for r in json.load(sys.stdin)["items"]:
                  ns = r["metadata"]["namespace"]
                  if ns.startswith("chainsaw-"):
                      continue
                  for x in r.get("results", []):
                      if x.get("result") == "fail":
                          fails[ns].add(x["policy"])
              print("restricted profile, failing policies per socle namespace:")
              for ns in sorted(fails):
                  print(f"  {ns}: {", ".join(sorted(fails[ns]))}")
              if not fails:
                  print("  none")'
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno_policies:
                      profile: baseline
        - error:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: require-run-as-nonroot
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: kyverno-policies
            name: kyverno-policies
    # The order of valuesFrom, proven whole (docs/flux-catalog.md §6), on the
    # severity annotation the socle sets to medium: high in values, low in the
    # Secret; the live policy carries the Secret's; both cleared, the socle's.
    - name: kube.kyverno_policies.values_secret is merged last, over values and the socle
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: kyverno-policies-e2e-values
                namespace: kyverno-policies
                labels:
                  reconcile.fluxcd.io/watch: Enabled
              stringData:
                values.yaml: |
                  podSecuritySeverity: low
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno_policies:
                      values_secret: kyverno-policies-e2e-values
                      values:
                        podSecuritySeverity: high
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: disallow-privileged-containers
                annotations:
                  policies.kyverno.io/severity: low
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno_policies:
                      values_secret: ''
                      values:
                        podSecuritySeverity: null
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: disallow-privileged-containers
                annotations:
                  policies.kyverno.io/severity: medium
        - delete:
            ref:
              apiVersion: v1
              kind: Secret
              name: kyverno-policies-e2e-values
              namespace: kyverno-policies
      catch:
        - describe:
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            namespace: kyverno-policies
            name: kyverno-policies
        - podLogs:
            namespace: flux-system
            selector: app=helm-controller
            tail: 40
    # Off, the policies first — the order a client follows, since OpenTofu
    # refuses kyverno_policies without kyverno — then the engine. The native
    # policy goes with the ValidatingPolicy that owns it. The last patch
    # leaves the inputs at the catalog defaults.
    - name: enabled = false garbage-collects the policies and their native twins, then the engine
      try:
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: kyverno-policies
                namespace: kyverno-policies
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (conditions[?type == 'Released'] || `[]`):
                  - status: 'True'
                (length(conditions[?type == 'Reconciling'] || `[]`)): 0
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno_policies:
                      enabled: false
                      enforce: []
        - error:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: kyverno-policies
                namespace: kyverno-policies
        - error:
            resource:
              apiVersion: policies.kyverno.io/v1beta1
              kind: ValidatingPolicy
              metadata:
                name: disallow-privileged-containers
        - error:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicy
              metadata:
                name: vpol-disallow-privileged-containers
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: kyverno-policies
        - assert:
            resource:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: kyverno
                namespace: kyverno
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(conditions[?type == 'Reconciling'] || `[]`)): 0
        - patch:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata:
                name: socle
                namespace: flux-system
              spec:
                defaultValues:
                  modules:
                    kyverno:
                      enabled: false
        - error:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: kyverno
        - assert:
            resource:
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSet
              metadata:
                name: kyverno-policies
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] || `[]`):
                  - status: 'True'
                (length(inventory.entries || `[]`)): 0
      catch:
        - describe:
            apiVersion: fluxcd.controlplane.io/v1
            kind: ResourceSet
            namespace: flux-system
            name: kyverno-policies
        - podLogs:
            namespace: flux-system
            selector: app.kubernetes.io/name=flux-operator
            tail: 40
