# The gateway_api module on azure: the shape of the two shared Gateways
# behind Azure's load balancer.
# docs/catalog/gateway-api.md is the module's page.
#
# Where inputs.gateway.shared says so, the two shared Gateways every module
# and the client route through: `public`, internet-facing, and `private`,
# internal, in gateway-system (docs/catalog/gateway-api.md). A child
# ResourceSet, because a Gateway can only be applied once its CRD and class
# exist: it dependsOn gateway-api-cilium, from the module's crds step,
# being Ready. Routes attach to `https` on 443. Unlike the CRDs, the
# Gateways are the socle's own: disabling the module or
# kube.gateway_api.gateways deletes them, and their load balancers with them.
#
# On azure, whose load balancer is L4 only, Envoy terminates with the
# certificate in the Secret gateway-system/gateway-tls, which the client
# creates; 443 is HTTPS there, a separate route table, so `http` on 80
# redirects everything to https. `private` asks Azure for an internal load
# balancer.
- op: add
  path: /spec/steps/-
  value:
    name: gateways
    resourcesTemplate: |
      << if inputs.gateway.shared >>
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      metadata:
        name: gateway-api-gateways
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.gateway_api.enabled >>enabled<< else >>disabled<< end >>
      spec:
        dependsOn:
          - apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            name: gateway-api-cilium
            namespace: flux-system
            ready: true
        wait: true
        resources:
          - apiVersion: v1
            kind: Namespace
            metadata:
              name: << inputs.gateway.namespace >>
          << range $gw := list "public" "private" >>
          - apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            metadata:
              name: << $gw >>
              namespace: << inputs.gateway.namespace >>
            spec:
              gatewayClassName: << inputs.gateway.className >>
              # Carried by Cilium onto the LoadBalancer Service it creates for
              # the Gateway, where the cloud's own service controller reads it.
              infrastructure:
                annotations:
                  << if eq $gw "private" >>
                  service.beta.kubernetes.io/azure-load-balancer-internal: "true"
                  << end >>
                  socle.do-now.io/gateway: << $gw >>
              listeners:
                # Only the redirect below attaches here.
                - name: http
                  protocol: HTTP
                  port: 80
                  allowedRoutes:
                    namespaces:
                      from: Same
                - name: https
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: gateway-tls
                  allowedRoutes:
                    namespaces:
                      from: All
          << end >>
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: https-redirect
              namespace: << inputs.gateway.namespace >>
            spec:
              parentRefs:
                - name: public
                  sectionName: http
                - name: private
                  sectionName: http
              rules:
                - filters:
                    - type: RequestRedirect
                      requestRedirect:
                        scheme: https
                        statusCode: 301
      << end >>
