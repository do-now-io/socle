# The argocd-image-updater module on aws: its ServiceAccount and, with
# Crossplane on and repositories named, the module's own IAM role, read-only
# on those ECR repositories, its Pod Identity association, the proof the
# association is usable, and the socle's entry for the ECR registry of the
# cluster's account and region (docs/catalog/argocd-image-updater.md,
# docs/architecture/module-iam.md).
- op: add
  path: /spec/dependsOn/-
  value:
    # The Role's kinds come from Crossplane's providers.
    apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSet
    name: crossplane
    namespace: flux-system
    ready: true
- op: test
  path: /spec/steps/1/name
  value: workload
- op: add
  path: /spec/steps/1
  value:
    name: cloud
    resourcesTemplate: |
      << $m := inputs.modules.argocd_image_updater ->>
      # The subject of the Pod Identity association, the socle's on aws rather
      # than the chart's (its values below): the access check runs under it
      # before the chart is installed. Kept whatever Crossplane says, so turning
      # Crossplane on or off never hands it between owners; resource-policy
      # keep, so the one upgrade that hands it over from the chart does not see
      # Helm delete it (docs/architecture/module-iam.md).
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: argocd-image-updater
        namespace: argocd-image-updater
        annotations:
          helm.sh/resource-policy: keep
          fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
      ---
      << if and inputs.modules.crossplane.enabled $m.repositories >>
      # The module's own AWS access, docs/architecture/module-iam.md. Under
      # /socle/<cluster>/ and carrying Crossplane's boundary when the root wired
      # one: Crossplane's own policy refuses any other role. Inline policy only.
      #
      # Read-only. GetAuthorizationToken takes no resource, so it is on *; the
      # token it returns reaches only what the role may read. The reads are on
      # the repositories the client named, in the registry of the cluster's
      # account and region, globs as written — never every repository.
      # GetDownloadUrlForLayer reads an image's config blob, where the
      # newest-build strategy finds its creation date: without it, that
      # strategy skips every image, its summary line still saying errors=0
      # (measured on EKS; docs/decisions/argocd-image-updater.md).
      << $arns := list ->>
      << range $m.repositories ->>
      << $arns = append $arns (printf "arn:aws:ecr:%s:%s:repository/%s" inputs.cluster.region inputs.cluster.accountId .) ->>
      << end ->>
      << $tokenCalls := list "ecr:GetAuthorizationToken" ->>
      << $token := dict "Sid" "GetTheRegistryToken" "Effect" "Allow" "Action" $tokenCalls "Resource" "*" ->>
      << $readCalls := list "ecr:ListImages" "ecr:DescribeImages" "ecr:BatchGetImage" "ecr:GetDownloadUrlForLayer" ->>
      << $read := dict "Sid" "ReadTheRepositoriesNamed" "Effect" "Allow" "Action" $readCalls "Resource" $arns ->>
      apiVersion: iam.aws.m.upbound.io/v1beta1
      kind: Role
      metadata:
        name: argocd-image-updater
        namespace: argocd-image-updater
        annotations:
          # IAM names are account-wide and two clusters may share an account.
          crossplane.io/external-name: << inputs.cluster.name >>-argocd-image-updater
          fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          path: /socle/<< inputs.cluster.name >>/
          << if inputs.modules.crossplane.permissions_boundary >>
          permissionsBoundary: << inputs.modules.crossplane.permissions_boundary | quote >>
          << end >>
          assumeRolePolicy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Principal": {"Service": "pods.eks.amazonaws.com"},
                "Action": ["sts:AssumeRole", "sts:TagSession"]
              }]
            }
          inlinePolicy:
            - name: ecr
              policy: << dict "Version" "2012-10-17" "Statement" (list $token $read) | toJson | quote >>
      ---
      apiVersion: eks.aws.m.upbound.io/v1beta1
      kind: PodIdentityAssociation
      metadata:
        name: argocd-image-updater
        namespace: argocd-image-updater
        annotations:
          fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          # Required: the socle's ClusterProviderConfig names no region, and
          # OpenTofu refuses repositories with an empty one.
          region: << inputs.cluster.region >>
          clusterName: << inputs.cluster.name >>
          namespace: argocd-image-updater
          serviceAccount: argocd-image-updater
          roleArnRef:
            name: argocd-image-updater
      ---
      # Healthy only once the Role and the association are Ready and a pod under
      # the module's ServiceAccount has proven the credentials, so the workload
      # step starts after them. EKS Pod Identity injects the credentials at pod
      # admission only, and the association is eventually consistent: Ready as
      # soon as CreatePodIdentityAssociation returns, known to the admission
      # webhook seconds later. A pod admitted in between runs without
      # credentials until it is recreated (#97). A dependsOn with a readyExpr,
      # because a managed resource not yet created carries no Ready condition at
      # all, which the step's own health check reads as healthy (measured on
      # floci).
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      metadata:
        name: argocd-image-updater-access
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
      spec:
        # Ready once the Job below is Complete.
        wait: true
        dependsOn:
          - apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            name: argocd-image-updater
            namespace: argocd-image-updater
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
          - apiVersion: eks.aws.m.upbound.io/v1beta1
            kind: PodIdentityAssociation
            name: argocd-image-updater
            namespace: argocd-image-updater
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        resources:
          # The association, proven usable by the thing itself: a pod under the
          # module's ServiceAccount that asks STS who it is, with only the Pod
          # Identity credentials to answer (the instance metadata off).
          # GetCallerIdentity needs no permission and an explicit deny does not
          # stop it (API_GetCallerIdentity), so the boundary's deny on sts
          # leaves it whole. Without the injection it exits non-zero, and the
          # Job's next pod is a new admission; the wait is exactly as long as
          # the propagation. One command, no shell; force, because a Job's
          # template is immutable (docs/architecture/module-iam.md).
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: argocd-image-updater-pod-identity
              namespace: argocd-image-updater
              annotations:
                fluxcd.controlplane.io/force: enabled
                fluxcd.controlplane.io/recreateOnFailure: enabled
            spec:
              backoffLimit: 6
              template:
                spec:
                  serviceAccountName: argocd-image-updater
                  restartPolicy: Never
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: sts
                      # 2.38.1
                      image: public.ecr.aws/aws-cli/aws-cli@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
                      args: ["sts", "get-caller-identity"]
                      # The one way round the injection: a Secret argocd-image-updater-aws
                      # the client creates, with static keys and, for an
                      # AWS-compatible endpoint, AWS_ENDPOINT_URL — what the
                      # floci e2e does, floci's credentials reaching AWS's
                      # own endpoints. Absent, nothing is set.
                      envFrom:
                        - secretRef:
                            name: argocd-image-updater-aws
                            optional: true
                      env:
                        - name: AWS_REGION
                          value: << inputs.cluster.region >>
                        - name: AWS_EC2_METADATA_DISABLED
                          value: "true"
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: ["ALL"]
                      resources:
                        requests:
                          cpu: 10m
                          memory: 64Mi
                          ephemeral-storage: 16Mi
                        limits:
                          memory: 128Mi
      ---
      << end >>
      # The socle's entry for the ECR registry, then the client's registries: one
      # list, which a later values document replaces whole, so this one is
      # complete (ARGOCD-IMAGE-UPDATER-04, -07).
      << $host := printf "%s.dkr.ecr.%s.amazonaws.com" inputs.cluster.accountId inputs.cluster.region ->>
      << $api := printf "https://%s" $host ->>
      << $entry := dict "name" "ecr" "prefix" $host "api_url" $api "credentials" "ext:/scripts/ecr-login.sh" "credsexpire" "11h" ->>
      << $registries := list $entry ->>
      << range $m.registries ->>
      << $registries = append $registries . ->>
      << end ->>
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-image-updater-cloud-values
        namespace: argocd-image-updater
        labels:
          reconcile.fluxcd.io/watch: Enabled
        annotations:
          fluxcd.controlplane.io/reconcile: << if $m.enabled >>enabled<< else >>disabled<< end >>
      data:
        values.yaml: |
          # The ServiceAccount of the cloud step.
          serviceAccount:
            create: false
            name: argocd-image-updater
          << if and inputs.modules.crossplane.enabled $m.repositories >>
          # The whole list, the ECR entry first (above).
          config:
            registries: << $registries | toJson >>
          # Prints AWS:<token> for the registry entry above; the controller
          # re-runs it every 11 hours. The aws CLI ships in the image and
          # takes the Pod Identity credentials of the module's role.
          authScripts:
            enabled: true
            scripts:
              ecr-login.sh: |
                #!/bin/sh
                aws ecr get-authorization-token --region << inputs.cluster.region >> \
                  --output text --query 'authorizationData[0].authorizationToken' | base64 -d
          << end >>
