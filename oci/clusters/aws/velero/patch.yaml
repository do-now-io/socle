# The velero module on aws: the server's ServiceAccount, the module's S3
# bucket and its settings, its own IAM role, its Pod Identity association and
# the proof the association is usable (docs/architecture/module-iam.md),
# the AWS object-store plugin, the backupStorageLocation on that bucket, the
# volume policy for the EBS and EFS CSI drivers, and the EBS
# VolumeSnapshotClass (docs/catalog/velero.md, docs/decisions/velero.md).
#
# The bucket is never deleted by the socle: its managed resources carry
# managementPolicies without Delete (namespaced managed resources have no
# deletionPolicy in Crossplane v2), and Crossplane's own identity has no
# s3:Delete* action at all (opentofu/aws/iam.tf). Turning the module off, or
# uninstalling the socle, leaves the bucket and every backup in it; a cluster
# rebuilt under the same name adopts it by its external name.
- op: add
  path: /spec/dependsOn
  value:
    # The bucket's and the Role's kinds come from Crossplane's providers.
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: crossplane
      namespace: flux-system
      ready: true
- op: test
  path: /spec/steps/1/name
  value: workload
- op: add
  path: /spec/steps/1
  value:
    name: cloud
    resourcesTemplate: |
      << $on := inputs.modules.velero.enabled >>
      << $bucket := printf "%s-velero-%s" inputs.cluster.name inputs.cluster.accountId >>
      # The subject of the Pod Identity association, the socle's on aws rather
      # than the chart's (its values below): the access check runs under it
      # before the chart is installed. Kept whatever Crossplane says, so turning
      # Crossplane on or off never hands it between owners; resource-policy
      # keep, so the one upgrade that hands it over from the chart does not see
      # Helm delete it (docs/architecture/module-iam.md).
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: velero-server
        namespace: velero
        annotations:
          helm.sh/resource-policy: keep
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      ---
      << if inputs.modules.crossplane.enabled >>
      # The module's bucket. External name = the S3 name: global, so it carries
      # the account; under the cluster's prefix, the only one Crossplane's own
      # identity may create. Observe, Create, Update, LateInitialize — no
      # Delete: deleting this object releases it and leaves the bucket.
      apiVersion: s3.aws.m.upbound.io/v1beta1
      kind: Bucket
      metadata:
        name: velero
        namespace: velero
        annotations:
          crossplane.io/external-name: << $bucket >>
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      spec:
        managementPolicies: [Observe, Create, Update, LateInitialize]
        forProvider:
          region: << inputs.cluster.region >>
          tags:
            socle-cluster: << inputs.cluster.name | quote >>
            socle-module: velero
      ---
      # Versioning: Velero deleting a backup at its TTL leaves its objects as
      # noncurrent versions, expired 30 days later by the lifecycle below — a
      # deletion, by mistake or by whoever got the role, is recoverable for a
      # month.
      apiVersion: s3.aws.m.upbound.io/v1beta1
      kind: BucketVersioning
      metadata:
        name: velero
        namespace: velero
        annotations:
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      spec:
        managementPolicies: [Observe, Create, Update, LateInitialize]
        forProvider:
          region: << inputs.cluster.region >>
          bucketRef:
            name: velero
          versioningConfiguration:
            status: Enabled
      ---
      apiVersion: s3.aws.m.upbound.io/v1beta1
      kind: BucketServerSideEncryptionConfiguration
      metadata:
        name: velero
        namespace: velero
        annotations:
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      spec:
        managementPolicies: [Observe, Create, Update, LateInitialize]
        forProvider:
          region: << inputs.cluster.region >>
          bucketRef:
            name: velero
          rule:
            - applyServerSideEncryptionByDefault:
                sseAlgorithm: AES256
      ---
      apiVersion: s3.aws.m.upbound.io/v1beta1
      kind: BucketPublicAccessBlock
      metadata:
        name: velero
        namespace: velero
        annotations:
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      spec:
        managementPolicies: [Observe, Create, Update, LateInitialize]
        forProvider:
          region: << inputs.cluster.region >>
          bucketRef:
            name: velero
          blockPublicAcls: true
          blockPublicPolicy: true
          ignorePublicAcls: true
          restrictPublicBuckets: true
      ---
      apiVersion: s3.aws.m.upbound.io/v1beta1
      kind: BucketLifecycleConfiguration
      metadata:
        name: velero
        namespace: velero
        annotations:
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      spec:
        managementPolicies: [Observe, Create, Update, LateInitialize]
        forProvider:
          region: << inputs.cluster.region >>
          bucketRef:
            name: velero
          rule:
            - id: noncurrent-30d
              status: Enabled
              filter:
                - prefix: ""
              noncurrentVersionExpiration:
                - noncurrentDays: 30
              abortIncompleteMultipartUpload:
                - daysAfterInitiation: 7
      ---
      # The module's own AWS access, docs/architecture/module-iam.md: S3 object
      # actions on its bucket, nothing else. No EC2: in CSI mode Velero creates
      # VolumeSnapshot objects and the EBS CSI driver takes the snapshots with
      # its own role (opentofu/bootstrap/eks_addons.tf).
      apiVersion: iam.aws.m.upbound.io/v1beta1
      kind: Role
      metadata:
        name: velero-server
        namespace: velero
        annotations:
          crossplane.io/external-name: << inputs.cluster.name >>-velero
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          path: /socle/<< inputs.cluster.name >>/
          << if inputs.modules.crossplane.permissions_boundary >>
          permissionsBoundary: << inputs.modules.crossplane.permissions_boundary | quote >>
          << end >>
          assumeRolePolicy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Principal": {"Service": "pods.eks.amazonaws.com"},
                "Action": ["sts:AssumeRole", "sts:TagSession"]
              }]
            }
          inlinePolicy:
            - name: bucket
              policy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Sid": "ListTheBucket",
                      "Effect": "Allow",
                      "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
                      "Resource": "arn:aws:s3:::<< $bucket >>"
                    },
                    {
                      "Sid": "ObjectsInTheBucket",
                      "Effect": "Allow",
                      "Action": [
                        "s3:GetObject",
                        "s3:PutObject",
                        "s3:DeleteObject",
                        "s3:PutObjectTagging",
                        "s3:AbortMultipartUpload",
                        "s3:ListMultipartUploadParts"
                      ],
                      "Resource": "arn:aws:s3:::<< $bucket >>/*"
                    }
                  ]
                }
      ---
      apiVersion: eks.aws.m.upbound.io/v1beta1
      kind: PodIdentityAssociation
      metadata:
        name: velero-server
        namespace: velero
        annotations:
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          region: << inputs.cluster.region >>
          clusterName: << inputs.cluster.name >>
          namespace: velero
          serviceAccount: velero-server
          roleArnRef:
            name: velero-server
      ---
      # Healthy only once the bucket, the Role and the association are Ready and
      # a pod under the module's ServiceAccount has proven the credentials, so
      # the workload step starts after them. EKS Pod Identity injects the
      # credentials at pod admission only, and the association is eventually
      # consistent: Ready as soon as CreatePodIdentityAssociation returns, known
      # to the admission webhook seconds later. A pod admitted in between runs
      # without credentials until it is recreated (#97). A dependsOn with a
      # readyExpr, because a managed resource not yet created carries no Ready
      # condition at all, which the step's own health check reads as healthy
      # (measured on floci).
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      metadata:
        name: velero-access
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      spec:
        # Ready once the Job below is Complete.
        wait: true
        dependsOn:
          - apiVersion: s3.aws.m.upbound.io/v1beta1
            kind: Bucket
            name: velero
            namespace: velero
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
          - apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            name: velero-server
            namespace: velero
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
          - apiVersion: eks.aws.m.upbound.io/v1beta1
            kind: PodIdentityAssociation
            name: velero-server
            namespace: velero
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        resources:
          # The association, proven usable by the thing itself: a pod under the
          # module's ServiceAccount that asks STS who it is, with only the Pod
          # Identity credentials to answer (the instance metadata off).
          # GetCallerIdentity needs no permission and an explicit deny does not
          # stop it (API_GetCallerIdentity), so the boundary's deny on sts
          # leaves it whole. Without the injection it exits non-zero, and the
          # Job's next pod is a new admission; the wait is exactly as long as
          # the propagation. One command, no shell; force, because a Job's
          # template is immutable (docs/architecture/module-iam.md).
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: velero-server-pod-identity
              namespace: velero
              annotations:
                fluxcd.controlplane.io/force: enabled
                fluxcd.controlplane.io/recreateOnFailure: enabled
            spec:
              backoffLimit: 6
              template:
                spec:
                  serviceAccountName: velero-server
                  restartPolicy: Never
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: sts
                      # 2.38.1
                      image: public.ecr.aws/aws-cli/aws-cli@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
                      args: ["sts", "get-caller-identity"]
                      env:
                        - name: AWS_REGION
                          value: << inputs.cluster.region >>
                        - name: AWS_EC2_METADATA_DISABLED
                          value: "true"
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: ["ALL"]
                      resources:
                        requests:
                          cpu: 10m
                          memory: 64Mi
                          ephemeral-storage: 16Mi
                        limits:
                          memory: 128Mi
      ---
      << end >>
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: velero-cloud-values
        namespace: velero
        labels:
          # helm-controller watches a valuesFrom ConfigMap only with this label;
          # without it, a change here waits for the next interval (10m).
          reconcile.fluxcd.io/watch: Enabled
        annotations:
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      data:
        values.yaml: |
          # The ServiceAccount of the cloud step.
          serviceAccount:
            server:
              create: false
              name: velero-server
          # The AWS SDK's default chain: the Pod Identity credentials of
          # the module's own role. No key anywhere.
          credentials:
            useSecret: false
          # Pinned with the chart: 1.14.x is the line for Velero 1.18.
          initContainers:
            - name: velero-plugin-for-aws
              image: docker.io/velero/velero-plugin-for-aws:v1.14.4
              imagePullPolicy: IfNotPresent
              # It copies one binary and exits (VELERO-07).
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 32Mi
              volumeMounts:
                - mountPath: /target
                  name: plugins
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          configuration:
            backupStorageLocation:
              - name: default
                provider: aws
                bucket: << $bucket >>
                default: true
                config:
                  region: << inputs.cluster.region | quote >>
          # The volume policy every Schedule references: EBS by CSI
          # snapshot, EFS by file-system backup (its driver has no
          # snapshots). Any other volume gets Velero's fallback: no
          # snapshot location and no fs-backup annotation, so it is
          # skipped.
          configMaps:
            volume-policy:
              data:
                policy.yaml: |
                  version: v1
                  volumePolicies:
                    - conditions:
                        csi:
                          driver: ebs.csi.aws.com
                      action:
                        type: snapshot
                    - conditions:
                        csi:
                          driver: efs.csi.aws.com
                      action:
                        type: fs-backup
      << if inputs.storage.snapshots >>
      ---
      # The class Velero takes EBS CSI snapshots with, by its label. Retain:
      # a snapshot outlives its VolumeSnapshot objects — Velero deletes it
      # when the backup expires, nothing else does.
      apiVersion: snapshot.storage.k8s.io/v1
      kind: VolumeSnapshotClass
      metadata:
        name: velero-ebs
        labels:
          velero.io/csi-volumesnapshot-class: "true"
        annotations:
          fluxcd.controlplane.io/reconcile: << if $on >>enabled<< else >>disabled<< end >>
      driver: ebs.csi.aws.com
      deletionPolicy: Retain
      << end >>
