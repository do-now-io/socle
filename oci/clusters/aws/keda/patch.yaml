# The keda module on aws: the operator's ServiceAccount and, with Crossplane on
# and a service named in kube.keda.services, the operator's own IAM role — one
# read-only statement per named service —, its Pod Identity association and
# the proof the association is usable (docs/catalog/keda.md,
# docs/architecture/module-iam.md); and the annotation that rolls the operator
# when that role changes.
- op: add
  path: /spec/dependsOn
  value:
    # The Role's kinds come from Crossplane's providers.
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: crossplane
      namespace: flux-system
      ready: true
- op: test
  path: /spec/steps/1/name
  value: workload
- op: add
  path: /spec/steps/1
  value:
    name: cloud
    resourcesTemplate: |
      # The subject of the Pod Identity association, the socle's on aws rather
      # than the chart's (its values below): the access check runs under it
      # before the chart is installed. Kept whatever Crossplane says, so turning
      # Crossplane on or off never hands it between owners; resource-policy
      # keep, so the one upgrade that hands it over from the chart does not see
      # Helm delete it (docs/architecture/module-iam.md).
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: keda-operator
        namespace: keda
        annotations:
          helm.sh/resource-policy: keep
          fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
      ---
      << if and inputs.modules.crossplane.enabled inputs.modules.keda.services >>
      # The module's own AWS access, docs/architecture/module-iam.md. Under
      # /socle/<cluster>/ and carrying Crossplane's boundary when the root wired
      # one: Crossplane's own policy refuses any other role. Inline policy only.
      #
      # One statement per service the client named, read-only, the exact API
      # calls KEDA's scalers make (pkg/scalers/aws_*_scaler.go, v2.21.0):
      #   sqs        GetQueueAttributes             the aws-sqs-queue scaler
      #   cloudwatch GetMetricData                  the aws-cloudwatch scaler
      #   kinesis    DescribeStreamSummary          the aws-kinesis-stream scaler
      #   dynamodb   Query; DescribeTable and       the aws-dynamodb and
      #              DescribeStream                 aws-dynamodb-streams scalers
      # Resource "*" within each: the queues and tables are named in the
      # client's ScaledObjects, which the socle does not read, and the account
      # id is not among the inputs (docs/catalog/keda.md). The boundary's
      # allowlist must name each service too — the client's tfvars, reviewed.
      << $s := list ->>
      << if has "sqs" inputs.modules.keda.services ->>
      << $a := list "sqs:GetQueueAttributes" ->>
      << $s = append $s (dict "Sid" "ReadSqsQueueAttributes" "Effect" "Allow" "Action" $a "Resource" "*") ->>
      << end ->>
      << if has "cloudwatch" inputs.modules.keda.services ->>
      << $a := list "cloudwatch:GetMetricData" ->>
      << $s = append $s (dict "Sid" "ReadCloudWatchMetrics" "Effect" "Allow" "Action" $a "Resource" "*") ->>
      << end ->>
      << if has "kinesis" inputs.modules.keda.services ->>
      << $a := list "kinesis:DescribeStreamSummary" ->>
      << $s = append $s (dict "Sid" "ReadKinesisStreamSummary" "Effect" "Allow" "Action" $a "Resource" "*") ->>
      << end ->>
      << if has "dynamodb" inputs.modules.keda.services ->>
      << $a := list "dynamodb:Query" "dynamodb:DescribeTable" "dynamodb:DescribeStream" ->>
      << $s = append $s (dict "Sid" "ReadDynamoDbTablesAndStreams" "Effect" "Allow" "Action" $a "Resource" "*") ->>
      << end ->>
      apiVersion: iam.aws.m.upbound.io/v1beta1
      kind: Role
      metadata:
        name: keda-operator
        namespace: keda
        annotations:
          # IAM names are account-wide and two clusters may share an account.
          crossplane.io/external-name: << inputs.cluster.name >>-keda-operator
          fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          path: /socle/<< inputs.cluster.name >>/
          << if inputs.modules.crossplane.permissions_boundary >>
          permissionsBoundary: << inputs.modules.crossplane.permissions_boundary | quote >>
          << end >>
          assumeRolePolicy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Principal": {"Service": "pods.eks.amazonaws.com"},
                "Action": ["sts:AssumeRole", "sts:TagSession"]
              }]
            }
          inlinePolicy:
            - name: scalers
              policy: << dict "Version" "2012-10-17" "Statement" $s | toJson | quote >>
      ---
      apiVersion: eks.aws.m.upbound.io/v1beta1
      kind: PodIdentityAssociation
      metadata:
        name: keda-operator
        namespace: keda
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          # Required: the socle's ClusterProviderConfig names no region, and
          # OpenTofu refuses this combination with an empty one.
          region: << inputs.cluster.region >>
          clusterName: << inputs.cluster.name >>
          namespace: keda
          serviceAccount: keda-operator
          roleArnRef:
            name: keda-operator
      ---
      # Healthy only once the Role and the association are Ready and a pod under
      # the module's ServiceAccount has proven the credentials, so the workload
      # step starts after them. EKS Pod Identity injects the credentials at pod
      # admission only, and the association is eventually consistent: Ready as
      # soon as CreatePodIdentityAssociation returns, known to the admission
      # webhook seconds later. A pod admitted in between runs without
      # credentials until it is recreated (#97). A dependsOn with a readyExpr,
      # because a managed resource not yet created carries no Ready condition at
      # all, which the step's own health check reads as healthy (measured on
      # floci).
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      metadata:
        name: keda-access
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
      spec:
        # Ready once the Job below is Complete.
        wait: true
        dependsOn:
          - apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            name: keda-operator
            namespace: keda
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
          - apiVersion: eks.aws.m.upbound.io/v1beta1
            kind: PodIdentityAssociation
            name: keda-operator
            namespace: keda
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        resources:
          # The association, proven usable by the thing itself: a pod under the
          # module's ServiceAccount that asks STS who it is, with only the Pod
          # Identity credentials to answer (the instance metadata off).
          # GetCallerIdentity needs no permission and an explicit deny does not
          # stop it (API_GetCallerIdentity), so the boundary's deny on sts
          # leaves it whole. Without the injection it exits non-zero, and the
          # Job's next pod is a new admission; the wait is exactly as long as
          # the propagation. One command, no shell; force, because a Job's
          # template is immutable (docs/architecture/module-iam.md).
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: keda-operator-pod-identity
              namespace: keda
              annotations:
                fluxcd.controlplane.io/force: enabled
                fluxcd.controlplane.io/recreateOnFailure: enabled
            spec:
              backoffLimit: 6
              template:
                spec:
                  serviceAccountName: keda-operator
                  restartPolicy: Never
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: sts
                      # 2.38.1
                      image: public.ecr.aws/aws-cli/aws-cli@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
                      args: ["sts", "get-caller-identity"]
                      env:
                        - name: AWS_REGION
                          value: << inputs.cluster.region >>
                        - name: AWS_EC2_METADATA_DISABLED
                          value: "true"
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: ["ALL"]
                      resources:
                        requests:
                          cpu: 10m
                          memory: 64Mi
                          ephemeral-storage: 16Mi
                        limits:
                          memory: 128Mi
      ---
      << end >>
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keda-cloud-values
        namespace: keda
        labels:
          reconcile.fluxcd.io/watch: Enabled
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.keda.enabled >>enabled<< else >>disabled<< end >>
      data:
        values.yaml: |
          # The ServiceAccount of the cloud step.
          serviceAccount:
            operator:
              create: false
              name: keda-operator
          podAnnotations:
            keda:
              # The services the operator's role may read, so that a change
              # rolls the operator: EKS Pod Identity hands a pod its
              # credentials at admission only. Empty when it has no role.
              socle.do-now.io/cloud-access: << inputs.modules.keda.services | sortAlpha | join "," | quote >>
