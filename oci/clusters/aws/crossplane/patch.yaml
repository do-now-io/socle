# The crossplane module on aws: what only aws has — the provider packages
# every module's AWS access is made of, and the ProviderConfig they
# authenticate with (docs/catalog/crossplane.md). Two steps appended after
# the module's core:
# 1. providers — the provider packages; they need the core's CRDs.
# 2. config — the ProviderConfig. It needs the providers' own CRDs, which
#    only exist once they are Healthy — a condition the operator's health
#    check does not read (Crossplane packages report Healthy, not Ready). So
#    the step is a child ResourceSet that dependsOn the packages with a
#    readyExpr on Healthy; this step waits for the child to be Ready. When
#    the module is off the child goes with everything else, so a dependency
#    on an absent Provider can never wedge socle-root.
# A module's own AWS resources wait for the crossplane ResourceSet, Ready
# once these steps are.
- op: add
  path: /spec/steps/-
  value:
    name: providers
    resourcesTemplate: |
      # IAM for the modules' roles, EKS for their Pod Identity
      # associations: what every module's AWS access is made of; S3 for
      # the buckets a module owns. One
      # ServiceAccount name for every AWS provider pod, so the foundations
      # can write its Pod Identity association before the cluster has a
      # node: Crossplane otherwise names it after the ProviderRevision, a
      # hash.
      #
      # The module creates that ServiceAccount, and the runtime config only
      # points the pods at it (deploymentTemplate's serviceAccountName).
      # Named through serviceAccountTemplate instead, Crossplane creates it
      # and makes each ProviderRevision its controller owner in turn: every
      # provider sharing the name takes it back from the last, the write
      # wakes the others, and every reconcile succeeds, so nothing backs
      # off — ~25 writes a second, forever, each one a billed line of the
      # EKS audit log (#80, crossplane/crossplane#7769). Pointed at, it is
      # used and never owned. Crossplane's RBAC manager binds the providers'
      # permissions to whatever ServiceAccount their Deployment runs as.
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: provider-aws
        namespace: crossplane-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
      ---
      # Requests from what was measured on k3s: 306Mi to 441Mi per provider
      # once its CRDs are loaded.
      apiVersion: pkg.crossplane.io/v1beta1
      kind: DeploymentRuntimeConfig
      metadata:
        name: provider-aws
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
      spec:
        deploymentTemplate:
          spec:
            selector: {}
            template:
              spec:
                serviceAccountName: provider-aws
                containers:
                  - name: package-runtime
                    resources:
                      requests:
                        cpu: 50m
                        memory: 320Mi
                        # Logs, and the provider's small Terraform workspaces
                        # under /tmp, one per managed resource.
                        ephemeral-storage: 256Mi
      ---
      # The family provider is a dependency of the other two; declared so
      # that its version is pinned here and not resolved by Crossplane.
      # Named exactly as Crossplane names a dependency it installs itself
      # (the package path, slashes as dashes): under any other name, when
      # the other two are resolved first, Crossplane installs the family a
      # second time, the lock holds one package twice, and every provider
      # stays unhealthy on "node … already exists" — measured on EKS.
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      metadata:
        name: crossplane-contrib-provider-family-aws
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
      spec:
        package: xpkg.crossplane.io/crossplane-contrib/provider-family-aws:v2.9.0
        runtimeConfigRef:
          name: provider-aws
      ---
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      metadata:
        name: provider-aws-iam
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
      spec:
        package: xpkg.crossplane.io/crossplane-contrib/provider-aws-iam:v2.9.0
        runtimeConfigRef:
          name: provider-aws
      ---
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      metadata:
        name: provider-aws-eks
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
      spec:
        package: xpkg.crossplane.io/crossplane-contrib/provider-aws-eks:v2.9.0
        runtimeConfigRef:
          name: provider-aws
      ---
      # S3 for the buckets a module owns, as it owns its role: the velero
      # module's (docs/catalog/velero.md). Crossplane's own identity may
      # create and configure buckets under the cluster's name prefix, and
      # never delete one (opentofu/aws/iam.tf).
      apiVersion: pkg.crossplane.io/v1
      kind: Provider
      metadata:
        name: provider-aws-s3
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
      spec:
        package: xpkg.crossplane.io/crossplane-contrib/provider-aws-s3:v2.9.0
        runtimeConfigRef:
          name: provider-aws
- op: add
  path: /spec/steps/-
  value:
    name: config
    resourcesTemplate: |
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      metadata:
        name: crossplane-provider-config
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.crossplane.enabled >>enabled<< else >>disabled<< end >>
      spec:
        dependsOn:
          - apiVersion: pkg.crossplane.io/v1
            kind: Provider
            name: crossplane-contrib-provider-family-aws
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
          - apiVersion: pkg.crossplane.io/v1
            kind: Provider
            name: provider-aws-iam
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
          - apiVersion: pkg.crossplane.io/v1
            kind: Provider
            name: provider-aws-eks
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
          - apiVersion: pkg.crossplane.io/v1
            kind: Provider
            name: provider-aws-s3
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Healthy' && c.status == 'True')
        wait: true
        resources:
          # The provider's credentials: EKS Pod Identity, through the
          # association the foundations wrote for crossplane-system/
          # provider-aws. No key anywhere.
          - apiVersion: aws.m.upbound.io/v1beta1
            kind: ClusterProviderConfig
            metadata:
              name: default
            spec:
              credentials:
                source: PodIdentity
