# The karpenter module on aws: its own AWS access, a step named cloud before
# the workload (docs/catalog/karpenter.md, docs/architecture/module-iam.md).
# The controller's IAM role and its Pod Identity association; the
# interruption queue and the EventBridge rules that fill it; the controller's
# ServiceAccount, the association's subject, and the check that a pod under
# it is given the role. The plan refuses the module with Crossplane off.
- op: add
  path: /spec/dependsOn
  value:
    # The Role, Queue and Rule kinds come from Crossplane's providers.
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: crossplane
      namespace: flux-system
      ready: true
- op: test
  path: /spec/steps/1/name
  value: workload
- op: add
  path: /spec/steps/1
  value:
    name: cloud
    resourcesTemplate: |
      # The subject of the Pod Identity association, the socle's on aws rather
      # than the chart's (its values below): the access check runs under it
      # before the chart is installed. Kept whatever Crossplane says, so turning
      # Crossplane on or off never hands it between owners; resource-policy
      # keep, so the one upgrade that hands it over from the chart does not see
      # Helm delete it (docs/architecture/module-iam.md).
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: karpenter
        namespace: karpenter
        annotations:
          helm.sh/resource-policy: keep
          fluxcd.controlplane.io/reconcile: << if inputs.modules.karpenter.enabled >>enabled<< else >>disabled<< end >>
      ---
      << if inputs.modules.crossplane.enabled >>
      << $cluster := inputs.cluster.name ->>
      << $region := inputs.cluster.region ->>
      << $account := inputs.cluster.accountId ->>
      << $queue := printf "%s-karpenter" $cluster ->>
      << $queueArn := printf "arn:aws:sqs:%s:%s:%s" $region $account $queue ->>
      # The controller's own AWS access, docs/architecture/module-iam.md. Under
      # /socle/<cluster>/ and carrying Crossplane's boundary when the root wired
      # one: Crossplane's own policy refuses any other role. Inline policy only.
      #
      # AWS's own controller policy for Karpenter 1.15.0 (the getting-started
      # CloudFormation template: NodeLifecycle, IAMIntegration,
      # EKSIntegration, Interruption, ResourceDiscovery), statement for
      # statement, with what the socle does not use left out
      # (docs/decisions/karpenter.md, KARPENTER-01):
      # - no instance-profile creation, tagging or deletion: the EC2NodeClass
      #   names the profile the foundations made, so Karpenter writes none,
      #   and only reads profiles;
      # - PassRole on the bootstrap nodes' role only, to EC2 only;
      # - no zonal-shift read: the setting stays off.
      # Every EC2 write is scoped by the tags Karpenter stamps on what it
      # launches — this cluster's, and a NodePool's — so it can only launch,
      # tag and terminate its own. The boundary must allow ec2, ssm,
      # pricing, sqs and eks (the client's tfvars); its one IAM exception,
      # the node role, exists only with ec2 there (opentofu/aws/iam.tf).
      apiVersion: iam.aws.m.upbound.io/v1beta1
      kind: Role
      metadata:
        name: karpenter
        namespace: karpenter
        annotations:
          # IAM names are account-wide and two clusters may share an account.
          crossplane.io/external-name: << $cluster >>-karpenter
          fluxcd.controlplane.io/reconcile: << if inputs.modules.karpenter.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          path: /socle/<< $cluster >>/
          << if inputs.modules.crossplane.permissions_boundary >>
          permissionsBoundary: << inputs.modules.crossplane.permissions_boundary | quote >>
          << end >>
          assumeRolePolicy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Principal": {"Service": "pods.eks.amazonaws.com"},
                "Action": ["sts:AssumeRole", "sts:TagSession"]
              }]
            }
          inlinePolicy:
            - name: controller
              policy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Sid": "AllowScopedEC2InstanceAccessActions",
                      "Effect": "Allow",
                      "Resource": [
                        "arn:aws:ec2:<< $region >>::image/*",
                        "arn:aws:ec2:<< $region >>::snapshot/*",
                        "arn:aws:ec2:<< $region >>:*:security-group/*",
                        "arn:aws:ec2:<< $region >>:*:subnet/*",
                        "arn:aws:ec2:<< $region >>:*:capacity-reservation/*",
                        "arn:aws:ec2:<< $region >>:*:placement-group/*"
                      ],
                      "Action": ["ec2:RunInstances", "ec2:CreateFleet"]
                    },
                    {
                      "Sid": "AllowScopedEC2LaunchTemplateAccessActions",
                      "Effect": "Allow",
                      "Resource": "arn:aws:ec2:<< $region >>:*:launch-template/*",
                      "Action": ["ec2:RunInstances", "ec2:CreateFleet"],
                      "Condition": {
                        "StringEquals": {"aws:ResourceTag/kubernetes.io/cluster/<< $cluster >>": "owned"},
                        "StringLike": {"aws:ResourceTag/karpenter.sh/nodepool": "*"}
                      }
                    },
                    {
                      "Sid": "AllowScopedEC2InstanceActionsWithTags",
                      "Effect": "Allow",
                      "Resource": [
                        "arn:aws:ec2:<< $region >>:*:fleet/*",
                        "arn:aws:ec2:<< $region >>:*:instance/*",
                        "arn:aws:ec2:<< $region >>:*:volume/*",
                        "arn:aws:ec2:<< $region >>:*:network-interface/*",
                        "arn:aws:ec2:<< $region >>:*:launch-template/*",
                        "arn:aws:ec2:<< $region >>:*:spot-instances-request/*"
                      ],
                      "Action": ["ec2:RunInstances", "ec2:CreateFleet", "ec2:CreateLaunchTemplate"],
                      "Condition": {
                        "StringEquals": {
                          "aws:RequestTag/kubernetes.io/cluster/<< $cluster >>": "owned",
                          "aws:RequestTag/eks:eks-cluster-name": "<< $cluster >>"
                        },
                        "StringLike": {"aws:RequestTag/karpenter.sh/nodepool": "*"}
                      }
                    },
                    {
                      "Sid": "AllowScopedResourceCreationTagging",
                      "Effect": "Allow",
                      "Resource": [
                        "arn:aws:ec2:<< $region >>:*:fleet/*",
                        "arn:aws:ec2:<< $region >>:*:instance/*",
                        "arn:aws:ec2:<< $region >>:*:volume/*",
                        "arn:aws:ec2:<< $region >>:*:network-interface/*",
                        "arn:aws:ec2:<< $region >>:*:launch-template/*",
                        "arn:aws:ec2:<< $region >>:*:spot-instances-request/*"
                      ],
                      "Action": "ec2:CreateTags",
                      "Condition": {
                        "StringEquals": {
                          "aws:RequestTag/kubernetes.io/cluster/<< $cluster >>": "owned",
                          "aws:RequestTag/eks:eks-cluster-name": "<< $cluster >>",
                          "ec2:CreateAction": ["RunInstances", "CreateFleet", "CreateLaunchTemplate"]
                        },
                        "StringLike": {"aws:RequestTag/karpenter.sh/nodepool": "*"}
                      }
                    },
                    {
                      "Sid": "AllowScopedResourceTagging",
                      "Effect": "Allow",
                      "Resource": "arn:aws:ec2:<< $region >>:*:instance/*",
                      "Action": "ec2:CreateTags",
                      "Condition": {
                        "StringEquals": {"aws:ResourceTag/kubernetes.io/cluster/<< $cluster >>": "owned"},
                        "StringLike": {"aws:ResourceTag/karpenter.sh/nodepool": "*"},
                        "StringEqualsIfExists": {"aws:RequestTag/eks:eks-cluster-name": "<< $cluster >>"},
                        "ForAllValues:StringEquals": {"aws:TagKeys": ["eks:eks-cluster-name", "karpenter.sh/nodeclaim", "Name"]}
                      }
                    },
                    {
                      "Sid": "AllowScopedDeletion",
                      "Effect": "Allow",
                      "Resource": [
                        "arn:aws:ec2:<< $region >>:*:instance/*",
                        "arn:aws:ec2:<< $region >>:*:launch-template/*"
                      ],
                      "Action": ["ec2:TerminateInstances", "ec2:RebootInstances", "ec2:DeleteLaunchTemplate"],
                      "Condition": {
                        "StringEquals": {"aws:ResourceTag/kubernetes.io/cluster/<< $cluster >>": "owned"},
                        "StringLike": {"aws:ResourceTag/karpenter.sh/nodepool": "*"}
                      }
                    },
                    {
                      "Sid": "AllowPassingInstanceRole",
                      "Effect": "Allow",
                      "Resource": "arn:aws:iam::<< $account >>:role/<< $cluster >>-bootstrap-node",
                      "Action": "iam:PassRole",
                      "Condition": {"StringEquals": {"iam:PassedToService": "ec2.amazonaws.com"}}
                    },
                    {
                      "Sid": "AllowInstanceProfileReadActions",
                      "Effect": "Allow",
                      "Resource": "arn:aws:iam::<< $account >>:instance-profile/*",
                      "Action": ["iam:GetInstanceProfile", "iam:ListInstanceProfiles"]
                    },
                    {
                      "Sid": "AllowAPIServerEndpointDiscovery",
                      "Effect": "Allow",
                      "Resource": "arn:aws:eks:<< $region >>:<< $account >>:cluster/<< $cluster >>",
                      "Action": "eks:DescribeCluster"
                    },
                    {
                      "Sid": "AllowInterruptionQueueActions",
                      "Effect": "Allow",
                      "Resource": "<< $queueArn >>",
                      "Action": ["sqs:DeleteMessage", "sqs:GetQueueUrl", "sqs:ReceiveMessage"]
                    },
                    {
                      "Sid": "AllowRegionalReadActions",
                      "Effect": "Allow",
                      "Resource": "*",
                      "Action": [
                        "ec2:DescribeCapacityReservations",
                        "ec2:DescribeImages",
                        "ec2:DescribeInstances",
                        "ec2:DescribeInstanceStatus",
                        "ec2:DescribeInstanceTypeOfferings",
                        "ec2:DescribeInstanceTypes",
                        "ec2:DescribeLaunchTemplates",
                        "ec2:DescribePlacementGroups",
                        "ec2:DescribeSecurityGroups",
                        "ec2:DescribeSpotPriceHistory",
                        "ec2:DescribeSubnets"
                      ],
                      "Condition": {"StringEquals": {"aws:RequestedRegion": "<< $region >>"}}
                    },
                    {
                      "Sid": "AllowSSMReadActions",
                      "Effect": "Allow",
                      "Resource": "arn:aws:ssm:<< $region >>::parameter/aws/service/*",
                      "Action": "ssm:GetParameter"
                    },
                    {
                      "Sid": "AllowPricingReadActions",
                      "Effect": "Allow",
                      "Resource": "*",
                      "Action": "pricing:GetProducts"
                    }
                  ]
                }
      ---
      apiVersion: eks.aws.m.upbound.io/v1beta1
      kind: PodIdentityAssociation
      metadata:
        name: karpenter
        namespace: karpenter
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.karpenter.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          # Required: the socle's ClusterProviderConfig names no region.
          region: << $region >>
          clusterName: << $cluster >>
          namespace: karpenter
          serviceAccount: karpenter
          roleArnRef:
            name: karpenter
      ---
      # The interruption queue: what EventBridge delivers and Karpenter reads,
      # to drain a node ahead of its Spot reclaim, its rebalance, its
      # scheduled maintenance, or after it stopped. Five minutes of retention
      # (a notice older than that is moot), encrypted at rest by SQS, HTTPS
      # only, and only EventBridge may send — AWS's own queue for Karpenter.
      apiVersion: sqs.aws.m.upbound.io/v1beta1
      kind: Queue
      metadata:
        name: karpenter
        namespace: karpenter
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.karpenter.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          region: << $region >>
          name: << $queue >>
          messageRetentionSeconds: 300
          sqsManagedSseEnabled: true
          policy: |
            {
              "Version": "2012-10-17",
              "Id": "EC2InterruptionPolicy",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {"Service": ["events.amazonaws.com", "sqs.amazonaws.com"]},
                  "Action": "sqs:SendMessage",
                  "Resource": "<< $queueArn >>"
                },
                {
                  "Sid": "DenyHTTP",
                  "Effect": "Deny",
                  "Principal": "*",
                  "Action": "sqs:*",
                  "Resource": "<< $queueArn >>",
                  "Condition": {"Bool": {"aws:SecureTransport": "false"}}
                }
              ]
            }
      << $rules := list
        (list "health" "aws.health" "AWS Health Event")
        (list "spot" "aws.ec2" "EC2 Spot Instance Interruption Warning")
        (list "rebalance" "aws.ec2" "EC2 Instance Rebalance Recommendation")
        (list "state" "aws.ec2" "EC2 Instance State-change Notification")
        (list "reservation" "aws.ec2" "EC2 Capacity Reservation Instance Interruption Warning") ->>
      << range $rules ->>
      << $name := index . 0 ->>
      ---
      apiVersion: cloudwatchevents.aws.m.upbound.io/v1beta1
      kind: Rule
      metadata:
        name: karpenter-<< $name >>
        namespace: karpenter
        annotations:
          crossplane.io/external-name: << $cluster >>-karpenter-<< $name >>
          fluxcd.controlplane.io/reconcile: << if inputs.modules.karpenter.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          region: << $region >>
          eventBusName: default
          eventPattern: << dict "source" (list (index . 1)) "detail-type" (list (index . 2)) | toJson | quote >>
      ---
      apiVersion: cloudwatchevents.aws.m.upbound.io/v1beta1
      kind: Target
      metadata:
        name: karpenter-<< $name >>
        namespace: karpenter
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.karpenter.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          region: << $region >>
          eventBusName: default
          ruleRef:
            name: karpenter-<< $name >>
          targetId: karpenter-queue
          arn: << $queueArn >>
      << end >>
      ---
      # Healthy only once the role, the association and the queue are Ready,
      # and a pod under the module's ServiceAccount has been given the
      # association's credentials, so the workload step starts after them:
      # EKS Pod Identity injects the credentials at pod admission, the
      # webhook learns an association seconds after it is Ready, and a pod
      # admitted in between never gets them until it is recreated (#97);
      # Karpenter reads its queue at start. A dependsOn with a readyExpr,
      # because a managed resource not yet created carries no Ready condition
      # at all, which the step's own health check reads as healthy (measured
      # on floci).
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      metadata:
        name: karpenter-access
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.karpenter.enabled >>enabled<< else >>disabled<< end >>
      spec:
        # Ready once the Job below is Complete.
        wait: true
        dependsOn:
          - apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            name: karpenter
            namespace: karpenter
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
          - apiVersion: eks.aws.m.upbound.io/v1beta1
            kind: PodIdentityAssociation
            name: karpenter
            namespace: karpenter
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
          - apiVersion: sqs.aws.m.upbound.io/v1beta1
            kind: Queue
            name: karpenter
            namespace: karpenter
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        resources:
          # The association, proven usable by the thing itself: a pod under the
          # module's ServiceAccount that asks STS who it is, with only the Pod
          # Identity credentials to answer (the instance metadata off).
          # GetCallerIdentity needs no permission and an explicit deny does not
          # stop it (API_GetCallerIdentity), so the boundary's deny on sts
          # leaves it whole. Without the injection it exits non-zero, and the
          # Job's next pod is a new admission; the wait is exactly as long as
          # the propagation. One command, no shell; force, because a Job's
          # template is immutable (docs/architecture/module-iam.md).
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: karpenter-pod-identity
              namespace: karpenter
              annotations:
                fluxcd.controlplane.io/force: enabled
                fluxcd.controlplane.io/recreateOnFailure: enabled
            spec:
              backoffLimit: 6
              template:
                spec:
                  serviceAccountName: karpenter
                  restartPolicy: Never
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: sts
                      # 2.38.1
                      image: public.ecr.aws/aws-cli/aws-cli@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
                      args: ["sts", "get-caller-identity"]
                      # The one way round the injection: a Secret karpenter-aws
                      # the client creates, with static keys and, for an
                      # AWS-compatible endpoint, AWS_ENDPOINT_URL. Absent,
                      # nothing is set.
                      envFrom:
                        - secretRef:
                            name: karpenter-aws
                            optional: true
                      env:
                        - name: AWS_REGION
                          value: << $region >>
                        - name: AWS_EC2_METADATA_DISABLED
                          value: "true"
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: ["ALL"]
                      resources:
                        requests:
                          cpu: 10m
                          memory: 64Mi
                          ephemeral-storage: 16Mi
                        limits:
                          memory: 128Mi
      ---
      << end >>
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: karpenter-cloud-values
        namespace: karpenter
        labels:
          reconcile.fluxcd.io/watch: Enabled
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.karpenter.enabled >>enabled<< else >>disabled<< end >>
      data:
        values.yaml: |
          # The ServiceAccount of the cloud step.
          serviceAccount:
            create: false
            name: karpenter
