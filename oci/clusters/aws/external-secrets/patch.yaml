# The external-secrets module on aws: its ServiceAccount and, with Crossplane
# on and at least one prefix in kube.external_secrets.prefixes, the module's
# own read-only IAM role, its Pod Identity association, the proof the
# association is usable (docs/architecture/module-iam.md) and the socle's
# ClusterSecretStore on AWS Secrets Manager (docs/catalog/external-secrets.md).
- op: add
  path: /spec/dependsOn
  value:
    # The Role's kinds come from Crossplane's providers.
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: crossplane
      namespace: flux-system
      ready: true
- op: test
  path: /spec/steps/1/name
  value: workload
- op: add
  path: /spec/steps/1
  value:
    name: cloud
    resourcesTemplate: |
      # The subject of the Pod Identity association, the socle's on aws rather
      # than the chart's (its values below): the access check runs under it
      # before the chart is installed. Kept whatever Crossplane says, so turning
      # Crossplane on or off never hands it between owners; resource-policy
      # keep, so the one upgrade that hands it over from the chart does not see
      # Helm delete it (docs/architecture/module-iam.md).
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: external-secrets
        namespace: external-secrets
        annotations:
          helm.sh/resource-policy: keep
          fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
      ---
      << if and inputs.modules.crossplane.enabled inputs.modules.external_secrets.prefixes >>
      # The module's own AWS access, docs/architecture/module-iam.md. Under
      # /socle/<cluster>/ and carrying Crossplane's boundary when the root wired
      # one: Crossplane's own policy refuses any other role. Inline policy only.
      #
      # Read-only and scoped by name: the two calls an ExternalSecret's
      # remoteRef makes (GetSecretValue for the value, DescribeSecret for the
      # version and the metadata), on the secrets under each prefix in the
      # cluster's region. The account id is not among the inputs, so the ARN
      # names any account: the role can only ever be used in the account it
      # lives in. ListSecrets and BatchGetSecretValue are left out — they take
      # no resource scope, so they would list every secret of the account —
      # and with them dataFrom.find.
      << $arns := list ->>
      << range $p := inputs.modules.external_secrets.prefixes ->>
      << $arns = append $arns (printf "arn:aws:secretsmanager:%s:*:secret:%s/*" inputs.cluster.region $p) ->>
      << end ->>
      << $actions := list "secretsmanager:GetSecretValue" "secretsmanager:DescribeSecret" ->>
      << $read := dict "Sid" "ReadSecretsUnderThePrefixes" "Effect" "Allow" "Action" $actions "Resource" $arns ->>
      apiVersion: iam.aws.m.upbound.io/v1beta1
      kind: Role
      metadata:
        name: external-secrets
        namespace: external-secrets
        annotations:
          # IAM names are account-wide and two clusters may share an account.
          crossplane.io/external-name: << inputs.cluster.name >>-external-secrets
          fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          path: /socle/<< inputs.cluster.name >>/
          << if inputs.modules.crossplane.permissions_boundary >>
          permissionsBoundary: << inputs.modules.crossplane.permissions_boundary | quote >>
          << end >>
          assumeRolePolicy: |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Principal": {"Service": "pods.eks.amazonaws.com"},
                "Action": ["sts:AssumeRole", "sts:TagSession"]
              }]
            }
          inlinePolicy:
            - name: secretsmanager
              policy: << dict "Version" "2012-10-17" "Statement" (list $read) | toJson | quote >>
      ---
      apiVersion: eks.aws.m.upbound.io/v1beta1
      kind: PodIdentityAssociation
      metadata:
        name: external-secrets
        namespace: external-secrets
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
      spec:
        forProvider:
          # Required: the socle's ClusterProviderConfig names no region, and
          # OpenTofu refuses this combination with an empty one.
          region: << inputs.cluster.region >>
          clusterName: << inputs.cluster.name >>
          namespace: external-secrets
          serviceAccount: external-secrets
          roleArnRef:
            name: external-secrets
      ---
      # Healthy only once the Role and the association are Ready and a pod under
      # the module's ServiceAccount has proven the credentials, so the workload
      # step starts after them. EKS Pod Identity injects the credentials at pod
      # admission only, and the association is eventually consistent: Ready as
      # soon as CreatePodIdentityAssociation returns, known to the admission
      # webhook seconds later. A pod admitted in between runs without
      # credentials until it is recreated (#97). A dependsOn with a readyExpr,
      # because a managed resource not yet created carries no Ready condition at
      # all, which the step's own health check reads as healthy (measured on
      # floci).
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      metadata:
        name: external-secrets-access
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
      spec:
        # Ready once the Job below is Complete.
        wait: true
        dependsOn:
          - apiVersion: iam.aws.m.upbound.io/v1beta1
            kind: Role
            name: external-secrets
            namespace: external-secrets
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
          - apiVersion: eks.aws.m.upbound.io/v1beta1
            kind: PodIdentityAssociation
            name: external-secrets
            namespace: external-secrets
            ready: true
            readyExpr: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
        resources:
          # The association, proven usable by the thing itself: a pod under the
          # module's ServiceAccount that asks STS who it is, with only the Pod
          # Identity credentials to answer (the instance metadata off).
          # GetCallerIdentity needs no permission and an explicit deny does not
          # stop it (API_GetCallerIdentity), so the boundary's deny on sts
          # leaves it whole. Without the injection it exits non-zero, and the
          # Job's next pod is a new admission; the wait is exactly as long as
          # the propagation. One command, no shell; force, because a Job's
          # template is immutable (docs/architecture/module-iam.md).
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: external-secrets-pod-identity
              namespace: external-secrets
              annotations:
                fluxcd.controlplane.io/force: enabled
                fluxcd.controlplane.io/recreateOnFailure: enabled
            spec:
              backoffLimit: 6
              template:
                spec:
                  serviceAccountName: external-secrets
                  restartPolicy: Never
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: sts
                      # 2.38.1
                      image: public.ecr.aws/aws-cli/aws-cli@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
                      args: ["sts", "get-caller-identity"]
                      env:
                        - name: AWS_REGION
                          value: << inputs.cluster.region >>
                        - name: AWS_EC2_METADATA_DISABLED
                          value: "true"
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: ["ALL"]
                      resources:
                        requests:
                          cpu: 10m
                          memory: 64Mi
                          ephemeral-storage: 16Mi
                        limits:
                          memory: 128Mi
      ---
      << end >>
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: external-secrets-cloud-values
        namespace: external-secrets
        labels:
          # helm-controller watches a valuesFrom ConfigMap only with this label;
          # without it, a change here waits for the next interval (10m).
          reconcile.fluxcd.io/watch: Enabled
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
      data:
        values.yaml: |
          # The ServiceAccount of the cloud step.
          serviceAccount:
            create: false
            name: external-secrets
- op: add
  path: /spec/steps/-
  value:
    name: store
    resourcesTemplate: |
      << if and inputs.modules.crossplane.enabled inputs.modules.external_secrets.prefixes >>
      # The socle's one store, on the module's own role: no auth block, so the
      # controller's default credential chain — the Pod Identity association
      # of the cloud step. A ClusterSecretStore, so every namespace may
      # reference it: the IAM prefixes, not the store, bound what it reads
      # (docs/decisions/external-secrets.md). Per-namespace SecretStores, and
      # stores on other backends, are the client's. A step after workload: the
      # store's CRD is one the chart installs, and ESO's validating webhook
      # must answer for it to apply — the workload step is healthy once the
      # HelmRelease is Ready.
      apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      metadata:
        name: external-secrets-store
        namespace: flux-system
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.external_secrets.enabled >>enabled<< else >>disabled<< end >>
      spec:
        wait: true
        resources:
        - apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: secret-manager
          spec:
            provider:
              aws:
                service: SecretsManager
                region: << inputs.cluster.region >>
      << end >>
