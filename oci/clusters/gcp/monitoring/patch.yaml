# The monitoring module on gcp: no node-exporter, which GKE Autopilot refuses,
# nor the rules and dashboards that read it alone; no overcommit alert, which
# Autopilot's nodes added on demand make meaningless; and Grafana
# health-checked where GKE's load balancer can see it healthy
# (docs/catalog/monitoring.md, Per cloud).
- op: test
  path: /spec/steps/1/name
  value: workload
- op: add
  path: /spec/steps/1
  value:
    name: cloud
    resourcesTemplate: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: monitoring-cloud-values
        namespace: monitoring
        labels:
          reconcile.fluxcd.io/watch: Enabled
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.monitoring.enabled >>enabled<< else >>disabled<< end >>
      data:
        values.yaml: |
          # node-exporter runs with hostNetwork, hostPID and the node's root
          # filesystem mounted: Autopilot blocks host namespaces and admits no
          # hostPath but /var/log, read-only (docs.cloud.google.com/
          # kubernetes-engine/docs/concepts/autopilot-security), so Warden
          # refuses the DaemonSet and the release never gets Ready. Its rules
          # and its dashboard follow it off (the chart's
          # defaultRules.rules.node-exporter and defaultDashboards
          # node-exporter-full read prometheus-node-exporter.enabled). GKE
          # collects the node's metrics itself on Autopilot, into Cloud
          # Monitoring, not into this VictoriaMetrics.
          prometheus-node-exporter:
            enabled: false
          # What the chart leaves on although it reads node-exporter alone:
          # recording rules of the kubernetes source, which then record
          # nothing, and RecordingRulesNoData fires for each, for good. A whole
          # group, and four rules of node.rules, whose node_namespace_pod
          # rule reads kube-state-metrics and stays. The sync job skips a
          # rule by its record name.
          defaultRules:
            # Requests against the allocatable of the nodes there are, less
            # the largest: whether the cluster survives losing a node. On
            # Autopilot, which every gcp cluster of the socle is, nodes are
            # sized to the pods and added on demand, so the sum is past it as
            # soon as the pods fill what runs, and losing a node means another.
            rules:
              KubeCPUOvercommit:
                enabled: false
              KubeMemoryOvercommit:
                enabled: false
            groups:
              kube-prometheus-node-recording.rules:
                enabled: false
              node.rules:
                rules:
                  node:node_num_cpu:sum:
                    enabled: false
                  :node_memory_MemAvailable_bytes:sum:
                    enabled: false
                  node:node_cpu_utilization:ratio_rate5m:
                    enabled: false
                  cluster:node_cpu:ratio_rate5m:
                    enabled: false
          # And kube-prometheus' dashboards drawn from node-exporter alone,
          # which would stay empty: the nodes' USE method, and the per-OS ones.
          defaultDashboards:
            dashboards:
              nodes:
                enabled: false
              node-rsrc-use:
                enabled: false
              node-cluster-rsrc-use:
                enabled: false
              nodes-aix:
                enabled: false
              nodes-darwin:
                enabled: false
- op: add
  path: /spec/steps/-
  value:
    name: health-check
    resourcesTemplate: |
      << $g := inputs.modules.monitoring.grafana ->>
      << if and inputs.modules.monitoring.enabled $g.enabled $g.domain $g.gateway inputs.gateway.shared >>
      # GKE's load balancer health-checks every backend itself, on `/` by
      # default and accepting only a 200, where Grafana answers 302 to /login:
      # without this policy the backend is unhealthy and the route answers
      # 502. /api/health is
      # Grafana's unauthenticated 200, on the pod's port (USE_SERVING_PORT: the
      # NEG endpoint's, 3000). Present while the HTTPRoute is.
      # https://cloud.google.com/kubernetes-engine/docs/how-to/configure-gateway-resources#configure_health_check
      apiVersion: networking.gke.io/v1
      kind: HealthCheckPolicy
      metadata:
        name: grafana
        namespace: monitoring
        annotations:
          fluxcd.controlplane.io/reconcile: << if inputs.modules.monitoring.enabled >>enabled<< else >>disabled<< end >>
      spec:
        default:
          config:
            type: HTTP
            httpHealthCheck:
              portSpecification: USE_SERVING_PORT
              requestPath: /api/health
        targetRef:
          group: ""
          kind: Service
          name: grafana
      << end >>
