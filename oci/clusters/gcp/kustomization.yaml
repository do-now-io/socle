# What the socle offers on gcp: one ResourceSet per catalog module. The client
# turns each on or off through kube.<module>.enabled; this list is the catalog,
# and .github/scripts/check-catalog-clouds.sh keeps it in step with catalog.tf.
#
# What a module needs that only gcp has is gcp/<module>/patch.yaml: steps the
# cloud adds to the module's ResourceSet, nothing else. A module with nothing
# of gcp's has no folder here (docs/decisions/socle.md, SOCLE-32).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../catalog/gateway-api/resourceset.yaml
  - ../../catalog/crossplane/resourceset.yaml
  - ../../catalog/external-dns/resourceset.yaml
  - ../../catalog/argocd/resourceset.yaml
  - ../../catalog/argocd-image-updater/resourceset.yaml
  - ../../catalog/monitoring/resourceset.yaml
  - ../../catalog/otel-agent/resourceset.yaml
  - ../../catalog/otel-gateway/resourceset.yaml
  - ../../catalog/keda/resourceset.yaml
  - ../../catalog/kyverno/resourceset.yaml
  - ../../catalog/kyverno-policies/resourceset.yaml
  - ../../catalog/external-secrets/resourceset.yaml
  - ../../catalog/reloader/resourceset.yaml
  - ../../catalog/velero/resourceset.yaml
  - ../../catalog/hello/resourceset.yaml
patches:
  - path: gateway-api/patch.yaml
    target:
      kind: ResourceSet
      name: gateway-api
  - path: crossplane/patch.yaml
    target:
      kind: ResourceSet
      name: crossplane
  - path: external-dns/patch.yaml
    target:
      kind: ResourceSet
      name: external-dns
  - path: external-secrets/patch.yaml
    target:
      kind: ResourceSet
      name: external-secrets
  - path: hello/patch.yaml
    target:
      kind: ResourceSet
      name: hello
  - path: velero/patch.yaml
    target:
      kind: ResourceSet
      name: velero
  - path: keda/patch.yaml
    target:
      kind: ResourceSet
      name: keda
  - path: kyverno/patch.yaml
    target:
      kind: ResourceSet
      name: kyverno
  - path: kyverno-policies/patch.yaml
    target:
      kind: ResourceSet
      name: kyverno-policies
  - path: argocd-image-updater/patch.yaml
    target:
      kind: ResourceSet
      name: argocd-image-updater
  - path: monitoring/patch.yaml
    target:
      kind: ResourceSet
      name: monitoring
  - path: otel-agent/patch.yaml
    target:
      kind: ResourceSet
      name: otel-agent
