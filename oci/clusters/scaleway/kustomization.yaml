# What the socle offers on scaleway: one ResourceSet per catalog module. The client
# turns each on or off through kube.<module>.enabled; this list is the catalog,
# and .github/scripts/check-catalog-clouds.sh keeps it in step with catalog.tf.
#
# What a module needs that only scaleway has is scaleway/<module>/patch.yaml: steps the
# cloud adds to the module's ResourceSet, nothing else. A module with nothing
# of scaleway's has no folder here (docs/decisions/socle.md, SOCLE-32).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../catalog/gateway-api/resourceset.yaml
  - ../../catalog/crossplane/resourceset.yaml
  - ../../catalog/external-dns/resourceset.yaml
  - ../../catalog/argocd/resourceset.yaml
  - ../../catalog/argocd-image-updater/resourceset.yaml
  - ../../catalog/monitoring/resourceset.yaml
  - ../../catalog/otel-agent/resourceset.yaml
  - ../../catalog/otel-gateway/resourceset.yaml
  - ../../catalog/keda/resourceset.yaml
  - ../../catalog/kyverno/resourceset.yaml
  - ../../catalog/kyverno-policies/resourceset.yaml
  - ../../catalog/external-secrets/resourceset.yaml
  - ../../catalog/reloader/resourceset.yaml
  - ../../catalog/hello/resourceset.yaml
patches:
  - path: external-dns/patch.yaml
    target:
      kind: ResourceSet
      name: external-dns
  - path: hello/patch.yaml
    target:
      kind: ResourceSet
      name: hello
