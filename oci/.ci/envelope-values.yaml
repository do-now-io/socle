inputs:
  cloud: aws
  cluster:
    name: ci
    environment: dev
    owner: platform
    region: eu-west-3
  socle:
    url: oci://ghcr.io/do-now-io/socle/flux-modules
    version: 0.0.0-ci.0000000
    pullSecret: ""
  cosign:
    issuer: ^https://token\.actions\.githubusercontent\.com$
    subject: ^https://github\.com/do-now-io/socle/\.github/workflows/publish-artifact\.yaml@refs/heads/main$
  modules:
    gateway_api:
      enabled: true
    external_dns:
      enabled: false
      domain_filters: []
      policy: upsert-only
      txt_owner_id: ci
      values: {}
      values_secret: ""
    hello:
      enabled: true
      replicas: 1
      message: hello from socle
  cilium:
    installed: true
    gatewayApi: true
    hubble: false
  gateway:
    className: cilium
