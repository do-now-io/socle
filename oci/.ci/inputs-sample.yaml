- cloud: aws
  cluster:
    name: t
    environment: dev
    owner: platform
    region: eu-west-3
  socle:
    url: oci://x/y
    version: 0.0.0 # x-release-please-version
  modules:
    gateway_api:
      enabled: true
    crossplane:
      enabled: true
      values:
        metrics:
          enabled: true
        resourcesCrossplane:
          requests:
            memory: 256Mi
      values_secret: crossplane-values
      permissions_boundary: arn:aws:iam::123456789012:policy/socle/t/crossplane-boundary
    external_dns:
      enabled: true
      domain_filters: [acme.example]
      policy: upsert-only
      txt_owner_id: t
      values:
        logLevel: debug
        extraArgs:
          aws-zone-type: public
      values_secret: external-dns-private-values
    hello:
      enabled: true
      replicas: 2
      message: hi
  cilium:
    installed: true
    gatewayApi: true
    hubble: false
  gateway:
    className: cilium
