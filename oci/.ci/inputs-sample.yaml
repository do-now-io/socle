- cloud: aws
  cluster:
    name: t
    environment: dev
    owner: platform
    region: eu-west-3
  socle:
    url: oci://x/y
    version: 0.0.0 # x-release-please-version
  modules:
    gateway_api:
      enabled: true
      gateways: true
    crossplane:
      enabled: true
      values:
        metrics:
          enabled: true
        resourcesCrossplane:
          requests:
            memory: 256Mi
      values_secret: crossplane-values
      permissions_boundary: arn:aws:iam::123456789012:policy/socle/t/t-crossplane-boundary
    external_dns:
      enabled: true
      domain_filters: [acme.example]
      policy: upsert-only
      txt_owner_id: t
      values:
        logLevel: debug
        extraArgs:
          aws-zone-type: public
      values_secret: external-dns-private-values
    argocd:
      enabled: true
      admin_enabled: true
      domain: argocd.example.com
      gateway: private
      ha: false
      values:
        configs:
          cm:
            accounts.ci: apiKey, login
          rbac:
            policy.csv: |
              g, ci, role:readonly
      values_secret: argocd-values
    victoria_metrics:
      enabled: true
      retention: 15d
      storage_size: 20Gi
      values:
        server:
          extraArgs:
            storage.maxHourlySeries: "50000"
      values_secret: victoria-metrics-values
    otel_agent:
      enabled: true
      logs: true
      values:
        resources:
          requests:
            memory: 160Mi
      values_secret: otel-agent-values
    otel_gateway:
      enabled: true
      values:
        resources:
          requests:
            memory: 320Mi
      values_secret: otel-gateway-values
    grafana:
      enabled: true
      domain: grafana.example.com
      gateway: public
      values:
        resources:
          requests:
            memory: 160Mi
      values_secret: grafana-values
    victoria_logs:
      enabled: true
      retention: 7d
      storage_size: 20Gi
      values:
        server:
          resources:
            requests:
              memory: 160Mi
      values_secret: victoria-logs-values
    victoria_traces:
      enabled: true
      retention: 7d
      storage_size: 10Gi
      values: {}
      values_secret: ""
    hello:
      enabled: true
      replicas: 2
      message: hi
  cilium:
    installed: true
    gatewayApi: true
    hubble: false
  gateway:
    className: cilium
    shared: true
    namespace: gateway-system
    certificateArn: arn:aws:acm:eu-west-3:123456789012:certificate/00000000-0000-0000-0000-000000000000
