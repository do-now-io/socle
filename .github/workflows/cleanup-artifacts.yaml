---
# Pre-release tags are test artifacts. Branch tags (0.0.0-<branch>.<sha>) go
# when their branch goes, on demand, and when they are older than seven days.
# Alphas (X.Y.Z-alpha.N, one per push to main) go when they are older than
# thirty days — long enough for the one just released to keep its sibling
# tag around, short enough that main's history does not pile up in GHCR.
# Release tags (X.Y.Z) are never touched here.
name: Clean up pre-release artifacts

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose pre-release tags to delete (empty = branch tags older than 7 days and alphas older than 30 days)
        required: false
        default: ''
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# `shell: bash` runs every step with -o pipefail: a failure on the left of a
# pipe (`| tee`, `| python3`) fails the step instead of vanishing behind the
# right-hand command's exit code. The unspecified default, `bash -e`, does not.
defaults:
  run:
    shell: bash

jobs:
  cleanup:
    name: Delete pre-release tags
    runs-on: ubuntu-latest
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      ORG: do-now-io
      # Nested package names travel %2F-encoded in the packages API path.
      PACKAGE: socle%2Fflux-modules
    steps:
      - name: Decide what to delete
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          DELETED_REF: ${{ github.event.ref }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          branch=""
          case "$EVENT" in
            delete) branch="$DELETED_REF" ;;
            workflow_dispatch) branch="$INPUT_BRANCH" ;;
          esac
          # Two rules, as `pattern|max_age_days` lines: a version is deleted when
          # all its tags match one rule's pattern and it is at least that old.
          if [ -n "$branch" ]; then
            slug="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-//; s/-$//')"
            rules="^0\\.0\\.0-${slug}\\.[0-9a-f]{7}$|0"
          else
            rules="^0\\.0\\.0-.+\\.[0-9a-f]{7}$|7"$'\n'"^[0-9]+\\.[0-9]+\\.[0-9]+-alpha\\.[0-9]+$|30"
          fi
          {
            echo "rules<<EOF"
            echo "$rules"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Delete matching package versions
        env:
          RULES: ${{ steps.scope.outputs.rules }}
        run: |
          # List first, into a file: a pipeline would run the loop in a subshell,
          # where a failed DELETE aborts the batch and counters never escape.
          gh api --paginate "/orgs/$ORG/packages/container/$PACKAGE/versions?per_page=100" \
            --jq '.[] | {id, created_at, tags: .metadata.container.tags}' \
          | python3 -c '
          import sys, json, re, os, datetime
          rules = [(re.compile(p), int(d)) for p, d in
                   (r.rsplit("|", 1) for r in os.environ["RULES"].splitlines() if r)]
          now = datetime.datetime.now(datetime.timezone.utc)
          for line in sys.stdin:
              v = json.loads(line)
              tags = v["tags"] or []
              if not tags:
                  continue   # untagged layers are never touched here
              age = (now - datetime.datetime.fromisoformat(v["created_at"].replace("Z", "+00:00"))).days
              # A release tag never matches a rule; a version carrying one
              # alongside a pre-release (the promoted alpha) is kept for the same reason.
              if any(all(pat.match(t) for t in tags) and age >= max_age for pat, max_age in rules):
                  print(v["id"], " ".join(tags))
          ' > "$RUNNER_TEMP/targets"
          deleted=0
          failed=0
          while read -r id tags; do
            [ -n "$id" ] || continue
            if gh api -X DELETE "/orgs/$ORG/packages/container/$PACKAGE/versions/$id" > /dev/null; then
              echo "deleted $tags"
              deleted=$((deleted + 1))
            else
              echo "::warning::could not delete version $id ($tags)"
              failed=$((failed + 1))
            fi
          done < "$RUNNER_TEMP/targets"
          matched="$(wc -l < "$RUNNER_TEMP/targets" | tr -d ' ')"
          {
            echo "### Clean up pre-release artifacts"
            echo "Rules (pattern|min age in days):"
            while IFS= read -r rule; do echo "- \`$rule\`"; done <<< "$RULES"
            echo ""
            echo "$deleted deleted, $failed failed, $matched matched."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" = 0 ]
