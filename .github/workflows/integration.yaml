---
# Integration tests: plan every OpenTofu root module against a local
# cloud emulator (https://floci.io) — no real cloud account, no secrets,
# fork-friendly. A green plan proves the module resolves its providers,
# data sources and inputs, and lists what it would create.
#
# The apply stops here: no floci emulator completes one for the modules
# we ship, so it proved nothing beyond the plan.
#
# Emulator coverage: AWS (floci), GCP (floci-gcp), Azure (floci-az).
# Scaleway has no emulator, from floci or anyone else. Its leg plans the
# minimal example instead — the module as a consumer calls it — against
# fixture credentials. The module holds no data source, so a plan over
# empty state reads nothing back and no API call leaves the runner.
# Convergence is therefore unproven on that leg, and the run summary says
# so. Its validations and defaults are covered by `tofu test`, in
# pr-static.yaml.
name: Integration tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opentofu-plan:
    name: tofu plan (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cloud: aws
            emulator: floci/floci:1.5.34
            port: "4566"
            health_path: /_localstack/health
            work_dir: opentofu/aws
          - cloud: gcp
            emulator: floci/floci-gcp:0.8.0
            port: "4588"
            health_path: /_floci-gcp/health
            work_dir: opentofu/gcp/tests/emulator
          - cloud: azure
            emulator: floci/floci-az:0.10.0
            port: "4577"
            health_path: /_floci/health
            work_dir: opentofu/azure
          - cloud: scaleway
            emulator: ""
            port: ""
            health_path: ""
            work_dir: opentofu/scaleway/examples/minimal
    env:
      # The aws provider natively honors AWS_ENDPOINT_URL and sends every
      # API call to the emulator instead of real AWS. The google and
      # azurerm equivalents (custom endpoints / metadata_host) will be
      # wired in the modules' test fixtures when their first real
      # resources land.
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - name: Start floci emulator
        if: matrix.emulator != ''
        run: |
          docker run -d --name floci \
            -p "${{ matrix.port }}:${{ matrix.port }}" \
            -e FLOCI_SERVICES_EKS_MOCK=true \
            "${{ matrix.emulator }}"
      - name: Wait for the emulator to be healthy
        if: matrix.emulator != ''
        run: |
          for _ in $(seq 1 30); do
            for scheme in http https; do
              if curl -fsk "${scheme}://localhost:${{ matrix.port }}${{ matrix.health_path }}" > /dev/null 2>&1; then
                echo "emulator ready (${scheme})"
                exit 0
              fi
            done
            sleep 2
          done
          echo "::error::emulator never became healthy"
          docker logs floci
          exit 1
      - name: Smoke-test the emulated AWS control plane
        if: matrix.cloud == 'aws'
        run: aws sts get-caller-identity --endpoint-url "$AWS_ENDPOINT_URL"
      # opentofu/aws's own six required variables. A root module with values
      # baked in would be a second, silent set of recommendations, so the
      # module has none and CI supplies throwaway ones. Set per leg, not on
      # the job: every cloud declares a `cluster_name`, and eu-west-3a is not
      # a zone anywhere else.
      - name: AWS variable fixtures
        if: matrix.cloud == 'aws'
        run: |
          {
            echo "TF_VAR_cluster_name=socle-emulator"
            echo "TF_VAR_owner=platform"
            echo "TF_VAR_environment=dev"
            echo 'TF_VAR_availability_zones=["eu-west-3a","eu-west-3b"]'
            echo 'TF_VAR_cluster_endpoint_public_access_cidrs=["203.0.113.0/32"]'
            echo "TF_VAR_kubernetes_version=1.34"
          } >> "$GITHUB_ENV"
      # Fixtures, not secrets: the format is all the provider validates, and
      # a plan over empty state never authenticates. The example supplies
      # every other input from its own defaults.
      - name: Scaleway variable fixtures
        if: matrix.cloud == 'scaleway'
        run: |
          {
            echo "SCW_ACCESS_KEY=SCWFIXTURE0000000000"
            echo "SCW_SECRET_KEY=00000000-0000-4000-8000-000000000000"
            echo "SCW_DEFAULT_ORGANIZATION_ID=00000000-0000-4000-8000-000000000000"
            echo "TF_VAR_project_id=00000000-0000-4000-8000-000000000000"
            echo 'TF_VAR_cluster_endpoint_public_access_cidrs=["203.0.113.0/32"]'
          } >> "$GITHUB_ENV"
      - name: tofu plan
        working-directory: ${{ matrix.work_dir }}
        run: |
          tofu init -input=false
          tofu plan -input=false
      - name: Summary
        run: |
          {
            echo "### tofu plan (${{ matrix.cloud }})"
            if [ -n "${{ matrix.emulator }}" ]; then
              echo "Planned against \`${{ matrix.emulator }}\` — the plan lists what would be"
              echo "created, and no real cloud was touched. ✅"
            else
              echo "⚠️ No emulator exists for this cloud, so this leg plans and does not"
              echo "apply: convergence is unproven here. The plan ran offline against the"
              echo "minimal example, which proves the module resolves as a consumer calls"
              echo "it. A disposable project (or floci Scaleway support) is what an apply"
              echo "would take."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
