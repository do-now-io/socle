---
# Level 1 of the Socle test pyramid: fast static checks.
# Runs on every pull request, forks included — no secrets, read-only token.
# OpenTofu, Helm and Kubernetes manifest checks activate automatically
# once the corresponding sources land in the repository.
# Every job writes what it did to the run summary (Checks tab).
name: PR static checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` runs every step with -o pipefail: a failure on the left of a
# pipe (`| tee`, `| python3`) fails the step instead of vanishing behind the
# right-hand command's exit code. The unspecified default, `bash -e`, does not.
defaults:
  run:
    shell: bash

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run yamllint
        run: |
          python3 -m pip install --user --require-hashes -r .github/requirements-yamllint.txt
          python3 -m yamllint --strict .
          {
            echo "### yamllint ✅"
            echo "All YAML files pass in strict mode ($(git ls-files '*.yaml' '*.yml' | wc -l | tr -d ' ') files checked)."
          } >> "$GITHUB_STEP_SUMMARY"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          fail_level: error
      - name: Summary
        run: |
          {
            echo "### actionlint ✅"
            echo "All GitHub Actions workflows pass."
          } >> "$GITHUB_STEP_SUMMARY"

  opentofu:
    name: OpenTofu fmt, validate, tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: VERSION is stamped consistently
        run: |
          .github/scripts/check-version.sh
          msg="VERSION \`$(tr -d '[:space:]' < VERSION)\` is stamped on every module and on the bootstrap envelope. ✅"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - name: The catalog and the per-cloud overlays agree
        run: |
          .github/scripts/check-catalog-clouds.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Every catalog module has its page, and the dependency graph holds
        run: |
          .github/scripts/check-catalog-pages.sh | tee -a "$GITHUB_STEP_SUMMARY"
      # The operator refuses a VMRule that does not load: a socle rule that
      # would never fire (docs/catalog/monitoring.md). The version is the one
      # the monitoring module's chart runs.
      - name: Every alerting rule the socle ships loads in vmalert
        env:
          VMALERT_VERSION: v1.153.0
        run: |
          base="https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/${VMALERT_VERSION}"
          curl -sfL "${base}/vmutils-linux-amd64-${VMALERT_VERSION}.tar.gz" | tar xz -C "$RUNNER_TEMP" vmalert-prod
          VMALERT="$RUNNER_TEMP/vmalert-prod" .github/scripts/check-rules.sh | tee -a "$GITHUB_STEP_SUMMARY"
      # A module's upstream rules and dashboards are copies, never edited:
      # each must still be its pinned source's content.
      - name: Every upstream rule file and dashboard is the upstream content
        run: |
          .github/scripts/upstream-monitoring.sh check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Detect OpenTofu sources
        id: detect
        run: |
          if compgen -G "opentofu/*/*.tf" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "### OpenTofu ⏭️"
              echo "No sources under \`opentofu/\` yet — checks are dormant."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.detect.outputs.found == 'true'
        with:
          # The floor every versions.tf declares (issue #89): CI proves it, and
          # moves only when the floor does.
          tofu_version: 1.13.0
      - name: tofu fmt
        if: steps.detect.outputs.found == 'true'
        # The e2e fixture roots (.github/e2e/<cloud>) are OpenTofu the CI
        # applies: held to the same fmt, validate and tflint as the modules.
        # Not to terraform-docs or tofu test — no client reads or copies them.
        run: tofu fmt -check -diff -recursive opentofu/ .github/e2e/
      - name: tofu validate (every root module)
        if: steps.detect.outputs.found == 'true'
        run: |
          {
            echo "### OpenTofu ✅"
            echo "| Root module | fmt | validate |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in opentofu/*/ opentofu/clusters/*/ .github/e2e/*/; do
            [ -n "$(ls "${dir}"*.tf 2>/dev/null)" ] || continue
            echo "==> ${dir}"
            (cd "${dir}" && tofu init -backend=false -input=false > /dev/null && tofu validate)
            echo "| \`${dir}\` | ✅ | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: tofu test (every root module that has tests)
        if: steps.detect.outputs.found == 'true'
        run: |
          for dir in opentofu/*/ opentofu/clusters/*/; do
            [ -n "$(ls "${dir}"*.tf 2>/dev/null)" ] || continue
            if compgen -G "${dir}tests/*.tftest.hcl" > /dev/null; then
              echo "==> ${dir}"
              (cd "${dir}" && tofu test)
              echo "tofu test \`${dir}\` ✅" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: terraform-docs is current (every module that generates docs)
        if: steps.detect.outputs.found == 'true'
        run: |
          image=quay.io/terraform-docs/terraform-docs:0.20.0@sha256:37329e2dc2518e7f719a986a3954b10771c3fe000f50f83fd4d98d489df2eae2
          for cfg in opentofu/*/.terraform-docs.yml opentofu/*/examples/*/.terraform-docs.yml opentofu/clusters/*/.terraform-docs.yml; do
            [ -f "${cfg}" ] || continue
            dir="$(dirname "${cfg}")"
            echo "==> ${dir}"
            docker run --rm -w /w -v "${PWD}/${dir}:/w" "${image}" markdown . -c .terraform-docs.yml --output-check
            echo "terraform-docs \`${dir}\` ✅" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        if: steps.detect.outputs.found == 'true'
      # `tflint --init` fetches the AWS ruleset from GitHub releases; anonymous
      # calls share one rate limit per runner IP and get 403 on a busy day.
      - name: tflint (every root module)
        if: steps.detect.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for dir in opentofu/*/ opentofu/clusters/*/ .github/e2e/*/; do
            [ -n "$(ls "${dir}"*.tf 2>/dev/null)" ] || continue
            echo "==> ${dir}"
            (cd "${dir}" && tflint --init > /dev/null && tflint --format compact)
            echo "tflint \`${dir}\` ✅" >> "$GITHUB_STEP_SUMMARY"
          done

  manifests:
    name: kubeconform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Kubernetes manifests
        id: detect
        run: |
          if [ -d oci ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "### kubeconform ⏭️"
              echo "No manifests under \`oci/\` yet — checks are dormant."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install flux-operator CLI
        if: steps.detect.outputs.found == 'true'
        env:
          # The charts job's flux-operator, so the repository runs one.
          FLUX_OPERATOR_VERSION: 0.60.0
          FLUX_OPERATOR_SHA256: dd7d504bf02117fc8625ef7e71fe757473a9d69cc1d6369586d0e3ae19e40e01
          CRD_SCHEMAS_SHA256: c062892eeac621948567464ae7688fcafa75c693bdfb170534cb221a56a194d8
        run: |
          # Both archives to a file first, checked, then unpacked: a pipe into
          # tar would unpack whatever answered, a 404 page included.
          release="https://github.com/controlplaneio-fluxcd/flux-operator/releases/download/v${FLUX_OPERATOR_VERSION}"
          curl -fsSLo /tmp/flux-operator.tgz "${release}/flux-operator_${FLUX_OPERATOR_VERSION}_linux_amd64.tar.gz"
          echo "${FLUX_OPERATOR_SHA256}  /tmp/flux-operator.tgz" | sha256sum -c -
          sudo tar xzf /tmp/flux-operator.tgz -C /usr/local/bin flux-operator
          flux-operator --version
          # The operator's own JSON schemas, from the same release: the datree
          # catalog's ResourceSet predates spec.steps (v0.60.0), so the
          # fluxcd.controlplane.io kinds are validated against these first.
          # Laid out as kubeconform's {{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.
          mkdir -p schemas/fluxcd.controlplane.io /tmp/crd-schemas
          curl -fsSLo /tmp/crd-schemas.tgz "${release}/crd-schemas.tar.gz"
          echo "${CRD_SCHEMAS_SHA256}  /tmp/crd-schemas.tgz" | sha256sum -c -
          tar xzf /tmp/crd-schemas.tgz -C /tmp/crd-schemas
          for f in /tmp/crd-schemas/*-fluxcd-v1.json; do
            kind="$(basename "${f}" -fluxcd-v1.json)"
            cp "${f}" "schemas/fluxcd.controlplane.io/${kind}_v1.json"
          done
      - name: Install yq and helm
        if: steps.detect.outputs.found == 'true'
        env:
          YQ_VERSION: 4.47.2
          YQ_SHA256: 1bb99e1019e23de33c7e6afc23e93dad72aad6cf2cb03c797f068ea79814ddb0
          # The charts job's helm, so the repository runs one.
          HELM_VERSION: 4.2.4
          HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
        run: |
          # Pinned rather than the runner image's, which move with the image:
          # the child-resource extraction, the CRD schemas and the requests
          # guard rely on yq's expression syntax, and the guard templates
          # every chart of the catalog with helm, which renders the envelope.
          curl -sSLo /tmp/yq "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
          curl -sSLo /tmp/helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          sudo tar xzf /tmp/helm.tgz -C /usr/local/bin --strip-components 1 linux-amd64/helm
          helm version
      - name: Render the catalog and the bootstrap envelope
        if: steps.detect.outputs.found == 'true'
        run: |
          mkdir -p rendered/nested
          # One ResourceSet per catalog module, rendered with the committed
          # sample inputs — the same shape OpenTofu deposits at bootstrap.
          for rs in oci/catalog/*/resourceset.yaml; do
            module="$(basename "$(dirname "${rs}")")"
            flux-operator build rset -f "${rs}" --inputs-from oci/.ci/inputs-sample.yaml \
              > "rendered/${module}.yaml"
          done
          # Each module as each cloud patches it (SOCLE-32): the overlay built,
          # split one ResourceSet per file, and the patched ones rendered from
          # that cloud's sample, oci/.ci/inputs-sample-<cloud>.yaml, or from
          # inputs-sample.yaml for a cloud that has none yet. The catalog's
          # part reads no inputs.cloud; a cloud's steps read what is its own
          # (a gcp project, a Certificate Manager map), which only its sample
          # holds with real values.
          for dir in oci/clusters/*/; do
            cloud="$(basename "${dir}")"
            grep -q '^patches:' "${dir}kustomization.yaml" || continue
            inputs=oci/.ci/inputs-sample.yaml
            [ ! -f "oci/.ci/inputs-sample-${cloud}.yaml" ] || inputs="oci/.ci/inputs-sample-${cloud}.yaml"
            mkdir -p "/tmp/overlay-${cloud}"
            kubectl kustomize --load-restrictor LoadRestrictionsNone "${dir}" \
              | awk -v out="/tmp/overlay-${cloud}" 'BEGIN { n = 0 } /^---$/ { n++; next } { print > (out "/" n ".yaml") }'
            sed -n 's|^  - path: \([a-z0-9-]*\)/patch.yaml$|\1|p' "${dir}kustomization.yaml" \
              | while read -r module; do
                rs="$(grep -l "^  name: ${module}$" /tmp/overlay-"${cloud}"/*.yaml)"
                flux-operator build rset -f "${rs}" --inputs-from "${inputs}" \
                  > "rendered/${cloud}-${module}.yaml"
              done
          done
          # A child ResourceSet's resources (a store, a provider config, the
          # shared Gateways, a Pod Identity check) are objects too: pulled out
          # to nested/ so kubeconform reads them, and not only their parent's
          # schema. Gathered across documents first: split_doc separates the
          # resources of one ResourceSet, not those of two.
          for f in rendered/*.yaml; do
            nested="$(yq ea '[select(.kind == "ResourceSet") | .spec.resources[]] | .[] | split_doc' "${f}")"
            [ -z "${nested}" ] || echo "${nested}" > "rendered/nested/$(basename "${f}")"
          done
          # The bootstrap envelope Helm deposits: the literal templates (the
          # << >> operator syntax stays as text — Helm never touches it) ...
          helm template socle opentofu/bootstrap/manifests \
            --values oci/.ci/envelope-values.yaml > rendered/envelope.yaml
          # ... and, split so flux-operator can tell the two kinds apart, the
          # root ResourceSet actually built from those inputs — the real
          # OCIRepository/Kustomization it would hand the cluster. Twice: a
          # public artifact, then a private one pulled through a Secret, the
          # two sides of the template's `<< if inputs.socle.pullSecret >>`.
          build_root() { # $1: output name, then the values files
            out="$1"; shift
            values=(); for v in "$@"; do values+=(--values "${v}"); done
            helm template socle opentofu/bootstrap/manifests "${values[@]}" \
              --show-only templates/root.yaml > /tmp/envelope-root.yaml
            helm template socle opentofu/bootstrap/manifests "${values[@]}" \
              --show-only templates/inputs.yaml > /tmp/envelope-inputs.yaml
            flux-operator build rset -f /tmp/envelope-root.yaml \
              --inputs-from-provider /tmp/envelope-inputs.yaml > "rendered/${out}.yaml"
          }
          build_root envelope-root-built oci/.ci/envelope-values.yaml
          build_root envelope-root-built-private oci/.ci/envelope-values.yaml oci/.ci/envelope-values-private.yaml
          secret_ref() { yq 'select(.kind == "OCIRepository") | .spec.secretRef.name // ""' "rendered/$1.yaml"; }
          [ -z "$(secret_ref envelope-root-built)" ] \
            || { echo "::error::the public envelope's OCIRepository carries a secretRef"; exit 1; }
          [ "$(secret_ref envelope-root-built-private)" = ghcr-auth ] \
            || { echo "::error::the private envelope's OCIRepository lacks secretRef ghcr-auth"; exit 1; }
      - name: Fetch the CRD schemas the datree catalog lacks
        if: steps.detect.outputs.found == 'true'
        run: |
          # The GCP provider's namespaced (.m) kinds: the datree catalog has
          # none, so every one the render holds is read from the provider's
          # own CRD, at the version the gcp crossplane step installs. A kind
          # is found by its apiVersion, so a patch that starts using a new one
          # needs nothing here.
          version="$(sed -n 's|.*/provider-family-gcp:\(v[0-9][0-9.]*\).*|\1|p' \
            oci/clusters/gcp/crossplane/patch.yaml 2>/dev/null | head -1)"
          kinds="$(find rendered -name '*.yaml' -print0 | xargs -0 yq e -N \
            'select(.apiVersion == "gcp.m.upbound.io/*" or .apiVersion == "*.gcp.m.upbound.io/*")
              | (.apiVersion | split("/") | .[0]) + " " + .kind' | sort -u)"
          if [ -n "${kinds}" ]; then
            if [ -z "${version}" ]; then
              echo "::error file=oci/clusters/gcp/crossplane/patch.yaml::GCP provider kinds rendered, no provider-family-gcp version here"
              exit 1
            fi
            base="https://raw.githubusercontent.com/crossplane-contrib/provider-upjet-gcp/${version}/package/crds"
            while read -r group kind; do
              # The CRD's file is <group>_<plural>; upjet's plurals are the
              # kind lowercased, then -ies for a final y, -es for a final s.
              plural="$(printf '%s' "${kind}" | tr '[:upper:]' '[:lower:]' \
                | sed -e 's/y$/ies/;t' -e 's/s$/ses/;t' -e 's/$/s/')"
              .github/scripts/crd-schema.sh "${base}/${group}_${plural}.yaml" schemas
            done <<< "${kinds}"
          fi
          # The datree catalog's ClusterSecretStore, regenerated on 2026-10-08
          # (datreeio/CRDs-catalog#988), no longer compiles in kubeconform:
          # "could not find schema". So it comes from external-secrets' own
          # CRD, at the appVersion of the chart the module pins.
          version="$(sed -n 's/.*# appVersion \(v[0-9][0-9.]*\).*/\1/p' \
            oci/catalog/external-secrets/resourceset.yaml | head -1)"
          base="https://raw.githubusercontent.com/external-secrets/external-secrets/${version}/config/crds/bases"
          .github/scripts/crd-schema.sh "${base}/external-secrets.io_clustersecretstores.yaml" schemas
      - name: kubeconform the render (strict)
        if: steps.detect.outputs.found == 'true'
        run: |
          docker run --rm -v "${PWD}/rendered:/work/rendered" -v "${PWD}/schemas:/work/schemas" -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary \
            -schema-location default \
            -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location \
            'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/ | tee kubeconform-rendered.out
      - name: kubeconform the artifact templates
        if: steps.detect.outputs.found == 'true'
        run: |
          # fluxcd.controlplane.io kinds (ResourceSet, ResourceSetInputProvider)
          # carry `<< >>` the operator has not rendered yet, as string values:
          # still YAML, and validated -strict against the operator's own
          # schemas fetched above. No -ignore-missing-schemas: every kind
          # here has a schema, and one that loses it must fail, not pass.
          # A module's tests/e2e holds Chainsaw tests and their values, not
          # manifests: skipped here, run by e2e.yaml. A cloud's patch.yaml is a
          # JSON 6902 patch, rendered applied in the step above.
          docker run --rm -v "${PWD}:/work" -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary \
            -schema-location default \
            -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location \
            'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-filename-pattern '/tests/' \
            -ignore-filename-pattern '/patch\.yaml$' \
            oci/catalog oci/clusters | tee kubeconform-oci.out
      - name: kustomize build every cluster overlay
        if: steps.detect.outputs.found == 'true'
        run: |
          for dir in oci/clusters/*/; do
            echo "==> ${dir}"
            kubectl kustomize --load-restrictor LoadRestrictionsNone "${dir}" > /dev/null
          done
      - name: Cache the catalog's charts
        if: steps.detect.outputs.found == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/charts
          # The pinned chart versions live in the modules' ResourceSets and
          # in the clouds' patches. A chart is cached under its URL, name and
          # version, which never change content, so the last cache restores
          # whatever charts it has when the key moves: a registry that
          # throttles the runners (ECR Public answers 429 to anonymous pulls,
          # the karpenter chart's) is then asked only for a new version.
          key: catalog-charts-${{ hashFiles('oci/catalog/*/resourceset.yaml', 'oci/clusters/*/*/patch.yaml') }}
          restore-keys: catalog-charts-
      - name: Every container the catalog runs states its requests
        if: steps.detect.outputs.found == 'true'
        run: |
          # Every ResourceSet a cloud's overlay deploys, rendered from that
          # cloud's sample, and each HelmRelease there templated at its pinned
          # chart with the socle's values: a container with no cpu, memory or
          # ephemeral-storage request fails here (docs/clouds/gcp/sizing.md).
          # A third render, aws with every `ha` input on (argocd's Redis HA
          # and replicas, metrics-server's), checks the containers only HA
          # brings. These renders are not kubeconform'd: the step above
          # validates the same objects.
          export CHART_CACHE=/tmp/charts
          yq '(.. | select(tag == "!!map" and has("ha")) | .ha) = true' \
            oci/.ci/inputs-sample.yaml > /tmp/inputs-sample-ha.yaml
          render() { # <cloud> <inputs> <out-dir>
            local split="/tmp/requests-overlay-$1" f
            mkdir -p "${split}" "$3"
            kubectl kustomize --load-restrictor LoadRestrictionsNone "oci/clusters/$1" \
              | awk -v out="${split}" 'BEGIN { n = 0 } /^---$/ { n++; next } { print > (out "/" n ".yaml") }'
            for f in "${split}"/*.yaml; do
              flux-operator build rset -f "${f}" --inputs-from "$2" > "$3/$(yq '.metadata.name' "${f}").yaml"
            done
          }
          render aws oci/.ci/inputs-sample.yaml requests/aws
          render gcp oci/.ci/inputs-sample-gcp.yaml requests/gcp
          render aws /tmp/inputs-sample-ha.yaml requests/aws-ha
          rc=0
          for dir in requests/aws requests/gcp requests/aws-ha; do
            echo "==> ${dir}" | tee -a requests.out
            .github/scripts/check-catalog-requests.sh "${dir}" | tee -a requests.out || rc=1
          done
          exit "${rc}"
      - name: Summary
        if: always() && steps.detect.outputs.found == 'true'
        run: |
          {
            echo "### kubeconform"
            echo "Rendered, child ResourceSets' resources included, each cloud's"
            echo "patched modules from its own sample (\`flux-operator build rset\` + \`helm template\`, strict):"
            echo '```'
            tail -1 kubeconform-rendered.out 2>/dev/null || echo "did not run"
            echo '```'
            echo "Artifact templates (\`oci/catalog\`, \`oci/clusters\`, missing schemas ignored):"
            echo '```'
            tail -1 kubeconform-oci.out 2>/dev/null || echo "did not run"
            echo '```'
            echo "Requests (aws, gcp, then aws with ha — every container of every chart, templated):"
            echo '```'
            grep -v '^::error::' requests.out 2>/dev/null || echo "did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # webapp and cronjob (#83): their values schemas, written from one set of
  # definitions; their helm-unittest suites, which came before the templates
  # (values, failing tests, then templates); every fixture's render, under
  # helm lint, kubeconform and the kyverno_policies module's policies.
  charts:
    name: Helm charts — schemas, helm-unittest, kubeconform, Kyverno
    runs-on: ubuntu-24.04
    env:
      HELM_VERSION: 4.2.4
      HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
      HELM_UNITTEST_VERSION: 1.2.1
      # The version kyverno_policies' engine runs (oci/catalog/kyverno).
      KYVERNO_VERSION: 1.19.1
      KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
      FLUX_OPERATOR_VERSION: 0.60.0
      FLUX_OPERATOR_SHA256: dd7d504bf02117fc8625ef7e71fe757473a9d69cc1d6369586d0e3ae19e40e01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The values schemas are up to date
        run: python3 .github/scripts/charts-schema.py --check
      - name: Install Helm and helm-unittest
        run: |
          curl -sSLo /tmp/helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          sudo tar xzf /tmp/helm.tgz -C /usr/local/bin --strip-components 1 linux-amd64/helm
          helm version
          # The plugin carries no provenance; its install hook checks the
          # binary against the release's own checksum file.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "v${HELM_UNITTEST_VERSION}" --verify=false
      - name: helm-unittest
        run: |
          # Both charts run, whichever fails first.
          rc=0
          for chart in webapp cronjob; do
            helm dependency build "charts/${chart}"
            helm unittest "charts/${chart}" | tee -a unittest.out || rc=1
          done
          exit "${rc}"
      - name: helm lint and kubeconform every fixture's render
        run: |
          mkdir -p rendered
          for chart in webapp cronjob; do
            for fixture in "charts/${chart}"/ci/*-values.yaml; do
              helm lint --strict "charts/${chart}" --values "${fixture}"
              helm template shop "charts/${chart}" --namespace shop --values "${fixture}" \
                > "rendered/${chart}-$(basename "${fixture}" -values.yaml).yaml"
            done
          done
          docker run --rm -v "${PWD}/rendered:/work/rendered" -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary \
            -schema-location default \
            -schema-location \
            'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/ | tee kubeconform.out
      - name: Install the Kyverno CLI and flux-operator
        run: |
          python3 -m pip install --user --require-hashes -r .github/requirements-yamllint.txt
          curl -sSLo /tmp/kyverno.tgz \
            "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  /tmp/kyverno.tgz" | sha256sum -c -
          sudo tar xzf /tmp/kyverno.tgz -C /usr/local/bin kyverno
          curl -sSLo /tmp/flux-operator.tgz \
            "https://github.com/controlplaneio-fluxcd/flux-operator/releases/download/v${FLUX_OPERATOR_VERSION}/flux-operator_${FLUX_OPERATOR_VERSION}_linux_amd64.tar.gz"
          echo "${FLUX_OPERATOR_SHA256}  /tmp/flux-operator.tgz" | sha256sum -c -
          sudo tar xzf /tmp/flux-operator.tgz -C /usr/local/bin flux-operator
      - name: Every fixture's pods pass the kyverno_policies module's policies
        run: python3 .github/scripts/charts-kyverno.py | tee kyverno.out
      - name: Summary
        if: always()
        run: |
          {
            echo "### Helm charts"
            echo '```'
            grep -E '^(Charts|Test Suites|Tests):' unittest.out || echo "helm-unittest did not run"
            tail -1 kubeconform.out 2>/dev/null || echo "kubeconform did not run"
            cat kyverno.out 2>/dev/null || echo "Kyverno did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One scan, one gate. On same-repo PRs and pushes to main the SARIF is
  # uploaded and GitHub's native "Code scanning results / Trivy" check is
  # THE gate (with inline annotations on the diff). Fork PRs can never get
  # security-events: write, so for them this job itself gates on
  # HIGH/CRITICAL instead.
  iac-security:
    name: Trivy IaC security scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      CAN_UPLOAD: >-
        ${{ github.event_name == 'push' ||
        github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy misconfiguration scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned above the action's default (v0.70.0), whose GKE adapter
          # panics on a grouped root's null labels (opentofu/clusters/gcp).
          version: v0.75.0
          scan-type: config
          scan-ref: .
          # Ignores for YAML manifests, which take no inline #trivy:ignore.
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Upload SARIF to code scanning
        if: env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
      - name: Gate on HIGH/CRITICAL (fork PRs only — no code scanning there)
        if: env.CAN_UPLOAD != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Trivy secret scan (always gates — a leaked secret is never a finding to triage)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
      - name: Summary
        run: |
          {
            echo "### Trivy IaC scan"
            if [ "${CAN_UPLOAD}" = "true" ]; then
              echo "SARIF uploaded — the gate is the native \"Code scanning results / Trivy\" check (inline annotations on the diff)."
            else
              echo "Fork PR: no code scanning available — this job gated on HIGH/CRITICAL directly. ✅"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
