---
# The socle artifact: oci/ pushed to GHCR and signed, and the release cycle.
#   push to main    → <next>-alpha.N. VERSION is the last release; <next> is
#                     what the conventional commits since it call for (fix →
#                     patch, feat → minor, breaking → minor before 1.0.0),
#                     computed by .github/scripts/compute-tag.sh exactly as
#                     release-please computes it. Signed by main, run through
#                     the e2e proofs; then release-please refreshes its release
#                     PR for the commits that passed.
#   push elsewhere  → 0.0.0-<branch>.<sha>, a SemVer pre-release: sorts below
#                     any release, never matches >=1.0.0, deletable
#                     (cleanup-artifacts.yaml).
#   merge of the release PR → release-please tags the commit and publishes the
#                     GitHub release; the alpha that same push produced gets
#                     the version as a second tag. Same digest, same signature,
#                     nothing rebuilt. A release tag is never overwritten.
# Flux verifies the signature against the workflow identity on every
# reconciliation; the bootstrap module trusts main by default.
name: Publish artifact

on:
  push:
    branches: ['**']

permissions:
  contents: read

# One group per ref. On main, never cancelled: runs are serialised, so the
# alpha, its proofs, the release PR refresh and a promotion never interleave.
# On any other branch the new push wins: the run of a commit that was just
# replaced proves nothing, and finishing it holds the branch's runners for a
# quarter of an hour (measured: a re-push queued 10 min behind its
# predecessor's last e2e job). The branch tag is per commit, so cancelling
# a run leaves no half-written artifact behind — only a tag nobody pulls.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The packages are named after the repository that builds them, and not
# written out: a fork publishes to its own namespace instead of failing on
# ours. OCI names are lowercase, GitHub's need not be, and an expression
# cannot lowercase — so each job sets them in its first step (GITHUB_ENV).
env:
  REGISTRY: ghcr.io

# `shell: bash` runs every step with -o pipefail: a failure on the left of a
# pipe (`| tee`, `| python3`) fails the step instead of vanishing behind the
# right-hand command's exit code. The unspecified default, `bash -e`, does not.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Push and sign oci/
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      kind: ${{ steps.tag.outputs.kind }}
      subject: ${{ steps.identity.outputs.subject }}
      cosign_identity: ${{ steps.identity.outputs.cosign_identity }}
    steps:
      - name: Name the packages after this repository
        run: |
          {
            echo "REPOSITORY=${GITHUB_REPOSITORY,,}/flux-modules"
            echo "MODULES_REPOSITORY=${GITHUB_REPOSITORY,,}/opentofu-modules"
            echo "CHARTS=${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_ENV"
      # Full history and tags: compute-tag.sh reads the commits since the last
      # release to name the next version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | crane auth login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      # On main the script names the next version from the commits since the
      # last release and asks the registry for its highest alpha. It fails
      # loudly when the registry cannot answer: publishing on doubt is how a
      # tag gets overwritten.
      - name: Compute the tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: .github/scripts/compute-tag.sh >> "$GITHUB_OUTPUT"
      - name: The identity Flux will verify against
        id: identity
        env:
          REF: ${{ github.ref }}
        run: |
          subject="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-artifact.yaml@${REF}"
          # The same identity as the e2e roots' cosign_identity variable: two
          # anchored regexes, every dot escaped, and doubled because OpenTofu
          # parses the -var value as an HCL string before the regex exists.
          issuer_re='^https://token\\.actions\\.githubusercontent\\.com$'
          subject_re="^$(printf '%s' "$subject" | sed 's/[.]/\\\\./g')\$"
          {
            echo "subject=$subject"
            echo "cosign_identity={issuer=\"$issuer_re\",subject=\"$subject_re\"}"
          } >> "$GITHUB_OUTPUT"
      - name: Push oci/ as an OCI artifact
        id: push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The tests travel with the modules in the repository, not in the
          # artifact: Flux syncs clusters/<cloud>, and a tests/ folder there
          # would only add bytes to every pull.
          out="$(flux push artifact "oci://$REGISTRY/$REPOSITORY:$TAG" \
            --path=./oci \
            --ignore-paths='**/tests/**' \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output=json)"
          digest="$(printf '%s' "$out" | python3 -c 'import sys,json; print(json.load(sys.stdin)["digest"])')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign, keyless
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$REPOSITORY@$DIGEST"
      - name: Verify what was just signed
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SUBJECT: ${{ steps.identity.outputs.subject }}
          TAG: ${{ steps.tag.outputs.tag }}
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          cosign verify "$REGISTRY/$REPOSITORY@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$SUBJECT" > /dev/null
          {
            echo "### Publish artifact ✅"
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` ($KIND) |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Signed as | \`$SUBJECT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The other half of the same release: the OpenTofu roots, as a module package
  # `tofu init` can pull. It cannot be the same artifact — an OCI tag holds one
  # manifest, and a modulepkg with an archive/zip layer is not a Flux
  # tar+gzip — nor the same pull: `tofu init` runs on the client's runner,
  # before the cluster Flux would reconcile from exists.
  #
  # The tag is `publish`'s, not computed again: each package counting its own
  # alphas would drift apart the first time one job is re-run and the other
  # not, and one socle_version would then pin two different commits. A re-run
  # of this job alone gets the same outputs from `publish`, so it re-pushes the
  # same tag from the same commit. Same promotion below, so both carry the
  # release at the same moment.
  #
  # OpenTofu does NOT verify OCI signatures, where Flux does on every
  # reconciliation. The signature only counts because the consumer runs cosign
  # verify before init — docs/reference/artifacts.md#verify-a-signature carries
  # that command.
  publish-modules:
    name: Push and sign the repository as a module package
    runs-on: ubuntu-24.04
    needs: [publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Name the package after this repository
        run: echo "REPOSITORY=${GITHUB_REPOSITORY,,}/opentofu-modules" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Only oras can set an artifactType, which is what OpenTofu looks for.
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | oras login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      # The whole commit, not only opentofu/: the roots call each other by
      # relative path, and a consumer picks one with //opentofu/<cloud>.
      # git archive carries exactly what the commit holds, and nothing a runner
      # left behind: no .terraform directory, no local edit.
      - name: Push the commit as a module package
        id: push
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          git archive --format=zip --output="modules.zip" "$GITHUB_SHA"
          unzip -l modules.zip | tail -1
          # artifactType and the single archive/zip layer are what make
          # OpenTofu recognise this. It accepts no other shape. The revision
          # annotation is what release.sh matches to find this commit's alpha.
          digest="$(oras push "$REGISTRY/$REPOSITORY:$TAG" \
            --artifact-type application/vnd.opentofu.modulepkg \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.created=$(git log -1 --format=%cI "$GITHUB_SHA")" \
            --format go-template='{{.digest}}' \
            "modules.zip:archive/zip")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign, keyless
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$REPOSITORY@$DIGEST"
      - name: Verify what was just signed
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SUBJECT: ${{ needs.publish.outputs.subject }}
          TAG: ${{ needs.publish.outputs.tag }}
          KIND: ${{ needs.publish.outputs.kind }}
        run: |
          cosign verify "$REGISTRY/$REPOSITORY@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$SUBJECT" > /dev/null
          {
            echo "### Publish modules ✅"
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` ($KIND) |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Signed as | \`$SUBJECT\` |"
            echo ""
            echo '```hcl'
            echo "source = \"oci://$REGISTRY/$REPOSITORY//opentofu/<cloud>?digest=$DIGEST\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Level 3: the artifact this push published, applied on floci's real k3s
  # and proven by Chainsaw — one job per catalog module, discovered from
  # oci/catalog/*/tests/e2e, plus the real root applied once. e2e.yaml says
  # what each job proves; its `e2e` job is the one context a ruleset can
  # require. It waits for the module package too: the upgrade job inits
  # from it, as a client does.
  e2e:
    name: e2e
    needs: [publish, publish-modules]
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read
      checks: write
    with:
      tag: ${{ needs.publish.outputs.tag }}
      subject: ${{ needs.publish.outputs.subject }}
      cosign_identity: ${{ needs.publish.outputs.cosign_identity }}

  # release-please keeps one release PR open against main: the next version
  # from the conventional commits since the last release, the CHANGELOG, and
  # every `# x-release-please-version` stamp. It runs after the proofs, so the
  # PR only ever advances to a commit whose alpha converged on floci. On the
  # push that merges that PR it tags the commit and publishes the GitHub
  # release instead, and `promote` below gives the alpha its release tag.
  # Needs the repository setting "Allow GitHub Actions to create and approve
  # pull requests" (Settings → Actions → General).
  #
  # Under the socle-release GitHub App once vars.RELEASE_APP_ID names it (#61,
  # M1): what GITHUB_TOKEN pushes and opens starts no workflow, so the release
  # PR got no CI at all — its pull_request runs ended action_required and
  # no Publish artifact ran on its branch. Under the App, the release PR
  # runs pr-static, integration and Publish artifact like any branch: its
  # pre-release is built, signed and proven before the merge that releases.
  # The App needs contents and pull-requests write on this repository, its
  # key in secrets.RELEASE_APP_PRIVATE_KEY. Without it, GITHUB_TOKEN as before.
  release-please:
    name: Release PR, or release
    runs-on: ubuntu-24.04
    needs: [publish, publish-modules, e2e]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
      html_url: ${{ steps.rp.outputs.html_url }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        if: vars.RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Summary
        env:
          CREATED: ${{ steps.rp.outputs.release_created }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          if [ "$CREATED" = true ]; then
            echo "### Release \`$TAG\` published — promoting its alpha below" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PR" ]; then
            url="$(printf '%s' "$PR" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("url",""))')"
            echo "### Release PR refreshed: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release PR: nothing user-facing since the last release" >> "$GITHUB_STEP_SUMMARY"
          fi

  # webapp and cronjob (#83), as Helm OCI charts at
  # ghcr.io/do-now-io/charts/<chart>, socle-lib bundled into each. Built at
  # the release, unlike the two packages above: a chart carries its version
  # inside (Chart.yaml), so an alpha given the release tag would still
  # announce itself as the alpha. The release commit's Chart.yaml already
  # says VERSION — release-please stamps it — and that is what is packaged.
  # Signed as main, like the alpha the release promotes. A chart version is
  # never pushed twice.
  publish-charts:
    name: Push and sign the charts
    runs-on: ubuntu-24.04
    needs: [publish, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      HELM_VERSION: 4.2.4
      HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
    steps:
      - name: Name the packages after this repository
        run: |
          {
            echo "REPOSITORY=${GITHUB_REPOSITORY,,}/flux-modules"
            echo "MODULES_REPOSITORY=${GITHUB_REPOSITORY,,}/opentofu-modules"
            echo "CHARTS=${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Helm and log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: |
          curl -sSLo /tmp/helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
          sudo tar xzf /tmp/helm.tgz -C /usr/local/bin --strip-components 1 linux-amd64/helm
          printf '%s' "$TOKEN" | helm registry login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      - name: Package, push, sign and verify each chart
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SUBJECT: ${{ needs.publish.outputs.subject }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ "$RELEASE_TAG" = "$version" ] \
            || { echo "::error::release tag '$RELEASE_TAG' is not VERSION ('$version')"; exit 1; }
          {
            echo "### Charts \`$version\` ✅"
            echo "| Chart | Digest |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p dist
          for chart in webapp cronjob; do
            ref="oci://$REGISTRY/$CHARTS/$chart"
            if helm show chart "$ref" --version "$version" > /dev/null 2>&1; then
              echo "::error::$ref $version is already pushed — a chart version is never overwritten"
              exit 1
            fi
            helm dependency build "charts/$chart"
            helm package "charts/$chart" --destination dist
            out="$(helm push "dist/$chart-$version.tgz" "oci://$REGISTRY/$CHARTS" 2>&1)"
            echo "$out"
            digest="$(printf '%s\n' "$out" | sed -n 's/^Digest: //p')"
            [ -n "$digest" ] || { echo "::error::no digest from helm push for $chart"; exit 1; }
            cosign sign --yes "$REGISTRY/$CHARTS/$chart@$digest"
            cosign verify "$REGISTRY/$CHARTS/$chart@$digest" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$SUBJECT" > /dev/null
            echo "| \`$ref:$version\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

  # The release itself: no rebuild, no new signature. The alpha `publish`
  # produced for this very commit gains the version release-please just
  # tagged. release.sh refuses when the tag is not this commit's VERSION,
  # when the version is already in the registry as another digest, and when
  # no alpha was built from this commit. The same digest passes, so a re-run
  # after a failure between the two packages finishes the release.
  promote:
    name: Promote this commit's alpha to the release
    runs-on: ubuntu-24.04
    needs: [publish, publish-modules, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the packages after this repository
        run: |
          {
            echo "REPOSITORY=${GITHUB_REPOSITORY,,}/flux-modules"
            echo "MODULES_REPOSITORY=${GITHUB_REPOSITORY,,}/opentofu-modules"
            echo "CHARTS=${GITHUB_REPOSITORY_OWNER,,}/charts"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | crane auth login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      - name: Tag the commit's alpha with the release version
        id: release
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: .github/scripts/release.sh >> "$GITHUB_OUTPUT"
      # The same promotion for the modules package, from the same script and
      # the same commit. A release where only one of the two carries the
      # version would leave socle_version pinning half a socle.
      - name: Tag the commit's module alpha with the same version
        id: release_modules
        env:
          REPOSITORY: ${{ env.MODULES_REPOSITORY }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: .github/scripts/release.sh >> "$GITHUB_OUTPUT"
      # The alpha was signed by this push to main, so the release carries
      # main's identity — the one the bootstrap module trusts by default.
      - name: The release still verifies as main
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ALPHA: ${{ steps.release.outputs.alpha }}
          DIGEST: ${{ steps.release.outputs.digest }}
          SUBJECT: ${{ needs.publish.outputs.subject }}
          RELEASE_URL: ${{ needs.release-please.outputs.html_url }}
          MODULES_ALPHA: ${{ steps.release_modules.outputs.alpha }}
          MODULES_DIGEST: ${{ steps.release_modules.outputs.digest }}
        run: |
          cosign verify "$REGISTRY/$REPOSITORY:$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$SUBJECT" > /dev/null
          cosign verify "$REGISTRY/$MODULES_REPOSITORY:$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$SUBJECT" > /dev/null
          {
            echo "### Release \`$TAG\` ✅"
            echo "| Artifact | Promoted from | Digest |"
            echo "|---|---|---|"
            echo "| \`$REPOSITORY\` | \`$ALPHA\` | \`$DIGEST\` |"
            echo "| \`$MODULES_REPOSITORY\` | \`$MODULES_ALPHA\` | \`$MODULES_DIGEST\` |"
            echo ""
            echo "Both signed as \`$SUBJECT\`."
            echo ""
            echo "Release: $RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
