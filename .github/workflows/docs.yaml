---
# The documentation site (site/, content in docs/), on GitHub Pages:
#   https://do-now-io.github.io/socle/       latest: the last release
#   https://do-now-io.github.io/socle/dev/   dev: main, bannered as unreleased
# Both go into one Pages artifact, rebuilt on every deploy.
#
#   pull request          the strict build of the PR's docs: a broken link or
#                         anchor, a page outside the navigation or an include
#                         that does not resolve fails it. Nothing deployed.
#   push to main          dev rebuilt from main; latest rebuilt from the last
#                         release tag.
#   Publish artifact done the release is tagged by release-please inside that
#                         workflow, with the GITHUB_TOKEN, so no `release` or
#                         tag event ever reaches this one. Its completion on
#                         main is the signal; the run deploys only when the
#                         commit it built carries a release tag.
# Until the first release, the root serves main too, and says so.
#
# Needs Settings → Pages → Source: GitHub Actions.
name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish artifact]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their superseded runs. Deploys queue in one group and
# are never cancelled half-way.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'docs-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `shell: bash` runs every step with -o pipefail: a failure on the left of a
# pipe (`| tee`, `| python3`) fails the step instead of vanishing behind the
# right-hand command's exit code. The unspecified default, `bash -e`, does not.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the site (strict)
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      # Tags: the latest build is made from the last release's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      # A release tag is X.Y.Z (release-please-config.json: no `v`); the last
      # one whose tree holds the site is what `latest` serves.
      - name: Find the last release
        id: release
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag=""
          for t in $(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'); do
            if git cat-file -e "${t}:site/package.json" 2>/dev/null; then tag="${t}"; break; fi
          done
          deploy=true
          if [ "${EVENT}" = pull_request ]; then
            deploy=false
          elif [ "${EVENT}" = workflow_run ] && ! git tag --points-at "${RUN_SHA}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # That push to main already deployed dev; only a release changes
            # what the site serves.
            deploy=false
          fi
          {
            echo "tag=${tag}"
            echo "released=$([ -n "${tag}" ] && echo true || echo false)"
            echo "deploy=${deploy}"
          } >> "$GITHUB_OUTPUT"
          echo "### Docs: last release \`${tag:-none yet}\`, deploy: ${deploy}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build dev (this commit)
        if: github.event_name != 'workflow_run' || steps.release.outputs.deploy == 'true'
        working-directory: site
        env:
          SOCLE_CHANNEL: dev
          SOCLE_REF: main
          SOCLE_RELEASED: ${{ steps.release.outputs.released }}
        run: |
          npm ci --ignore-scripts
          npm run build
          mkdir -p ../_site
          mv dist ../_site/dev
          echo "dev: $(find ../_site/dev -name index.html | wc -l | tr -d ' ') pages, strict build ✅" >> "$GITHUB_STEP_SUMMARY"
      - name: Build latest (the last release, or main until there is one)
        if: steps.release.outputs.deploy == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SOCLE_CHANNEL: latest
          SOCLE_RELEASED: ${{ steps.release.outputs.released }}
        run: |
          src="${PWD}"
          if [ -n "${TAG}" ]; then
            src="${RUNNER_TEMP}/latest"
            git worktree add --detach "${src}" "${TAG}"
          fi
          cd "${src}/site"
          npm ci --ignore-scripts
          SOCLE_REF="${TAG:-main}" npm run build
          cp -R dist/. "${GITHUB_WORKSPACE}/_site/"
          echo "latest: built from \`${TAG:-main}\` ✅" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.release.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
