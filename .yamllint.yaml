---
# yamllint configuration for the Socle repository.
# Kept close to defaults; deviations are documented inline.
extends: default

ignore:
  - .git/
  # The documentation site's dependencies, installed by `npm ci` in site/.
  - site/node_modules/
  # The bootstrap envelope's templates carry one Helm expression ({{- toYaml
  # ... }}) that is not a YAML node. They are checked by rendering them —
  # helm template + kubeconform in pr-static.yaml. Chart.yaml stays linted.
  - opentofu/*/manifests/templates/
  # Upstream rules and dashboards, copied as they are: their lines are the
  # upstream's, and .github/scripts/upstream-monitoring.sh checks they stay so.
  - oci/catalog/*/monitoring/awesome-prometheus-alerts.yaml
  - oci/catalog/*/monitoring/dashboard-*.yaml
  # The same for the StorageClass chart; tofu test checks its values.
  - opentofu/bootstrap/storage-class/templates/

rules:
  # Manifests with long image references or URLs need some headroom.
  line-length:
    max: 140
  # GitHub Actions uses "on:" as a mapping key, which the default
  # truthy rule flags as a boolean.
  truthy:
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
