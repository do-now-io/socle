---
# yamllint configuration for the Socle repository.
# Kept close to defaults; deviations are documented inline.
extends: default

ignore:
  - .git/
  # Helm templates are Go templates that happen to end in .yaml: `{{- if }}`
  # at the start of a line is not a YAML node, and no linter setting makes it
  # one. They are checked by rendering them instead — `helm template` in the
  # module's own test path. Only templates/ is exempt; a chart's Chart.yaml
  # and values.yaml are real YAML and stay linted.
  - opentofu/*/chart/templates/

rules:
  # Manifests with long image references or URLs need some headroom.
  line-length:
    max: 140
  # GitHub Actions uses "on:" as a mapping key, which the default
  # truthy rule flags as a boolean.
  truthy:
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
