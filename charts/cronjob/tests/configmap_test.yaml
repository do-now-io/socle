suite: configmap
templates:
  - configmap.yaml
release:
  name: billing
  namespace: billing
values:
  - ../ci/minimal-values.yaml
tests:
  - it: renders no ConfigMap by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one ConfigMap per entry, named <release>-<name>, its data as written
    set:
      configMaps:
        - name: config
          data:
            APP_DEBUG: "false"
            logback.xml: |
              <configuration/>
        - name: templates
          data:
            welcome.html: <h1>Hello</h1>
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: billing-config
        documentIndex: 0
      - equal:
          path: data
          value:
            APP_DEBUG: "false"
            logback.xml: |
              <configuration/>
        documentIndex: 0
      - equal:
          path: metadata.name
          value: billing-templates
        documentIndex: 1
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: billing
            app.kubernetes.io/instance: billing
            app.kubernetes.io/component: cronjob

  - it: refuses two ConfigMaps with the same name
    set:
      configMaps:
        - name: config
          data: {A: "1"}
        - name: config
          data: {B: "2"}
    asserts:
      - failedTemplate:
          errorPattern: "configMaps: two named config"
