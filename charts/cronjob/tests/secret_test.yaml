suite: secret
templates:
  - secret.yaml
release:
  name: billing
  namespace: billing
values:
  - ../ci/minimal-values.yaml
tests:
  - it: renders no Secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one Opaque Secret per entry, named <release>-<name>, its values in stringData
    set:
      secrets:
        - name: api-key
          stringData:
            API_KEY: change-me
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: billing-api-key
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData
          value:
            API_KEY: change-me
      - notExists:
          path: data
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: billing
            app.kubernetes.io/instance: billing
            app.kubernetes.io/component: cronjob

  - it: refuses two Secrets with the same name
    set:
      secrets:
        - name: api-key
          stringData: {A: "1"}
        - name: api-key
          stringData: {B: "2"}
    asserts:
      - failedTemplate:
          errorPattern: "secrets: two named api-key"
