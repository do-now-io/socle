suite: serviceaccount
templates:
  - serviceaccount.yaml
release:
  name: billing
  namespace: billing
values:
  - ../ci/minimal-values.yaml
tests:
  - it: renders the release's own ServiceAccount, its token not mounted
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: billing
      - equal:
          path: automountServiceAccountToken
          value: false
      - notExists:
          path: metadata.annotations
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: billing
            app.kubernetes.io/instance: billing
            app.kubernetes.io/component: cronjob

  - it: mounts the token and copies the annotations when set
    set:
      serviceAccount:
        automountServiceAccountToken: true
        annotations:
          example.com/identity: billing@example.com
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
      - equal:
          path: metadata.annotations
          value:
            example.com/identity: billing@example.com
