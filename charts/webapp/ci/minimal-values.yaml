# The fewest values webapp renders with: every required key, nothing else.
image:
  registry: ghcr.io/acme
  repository: shop
  tag: 1.0.0
port: 8080
livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http
resources:
  requests:
    cpu: 250m
    memory: 256Mi
securityContext:
  runAsUser: 1000
