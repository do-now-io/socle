# Every key of webapp set: every optional object rendered.
image:
  registry: ghcr.io/acme
  repository: shop
  tag: 1.2.3
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: regcred
commonEnv:
  - name: MAIL_FROM
    value: contact@example.com
env:
  - name: LOG_LEVEL
    value: info
  - name: API_KEY
    valueFrom:
      secretKeyRef:
        name: shop-api-key
        key: API_KEY
port: 8080
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /ready
    port: http
  failureThreshold: 3
resources:
  requests:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 1Gi
  limits:
    memory: 256Mi
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  netBindService: true
routes:
  - name: api
    parentRefs:
      - name: public
        namespace: gateway-system
        sectionName: https
    hostnames:
      - app.example.com
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /api
  - name: admin
    parentRefs:
      - name: private
        namespace: gateway-system
        sectionName: https
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /admin
commonEnvFrom:
  - configMapRef:
      name: shop-config
envFrom:
  - secretRef:
      name: shop-database
    prefix: DB_
volumes:
  - name: config
    configMap:
      name: shop-config
  - name: data
    persistentVolumeClaim:
      claimName: shop-data
volumeMounts:
  - name: config
    mountPath: /config
  - name: data
    mountPath: /data
configMaps:
  - name: config
    data:
      APP_DEBUG: "false"
secrets:
  - name: api-key
    stringData:
      API_KEY: change-me
externalSecrets:
  - name: database
    secretStoreRef:
      kind: SecretStore
      name: my-store
    data:
      - secretKey: PASSWORD
        remoteRef:
          key: shop/db
          property: password
persistence:
  - name: data
    size: 1Gi
serviceAccount:
  automountServiceAccountToken: true
  annotations:
    example.com/identity: shop
nodeSelector:
  kubernetes.io/arch: amd64
tolerations:
  - key: example.com/dedicated
    operator: Equal
    value: shop
    effect: NoSchedule
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: example.com/pool
              operator: In
              values: [apps]
topologySpread:
  whenUnsatisfiable: DoNotSchedule
replicas: 3
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0
command: [/app/shop]
args: [--port=8080]
reloader:
  enabled: true
metrics:
  enabled: true
  port: 9090
  path: /metrics
terminationGracePeriodSeconds: 25
