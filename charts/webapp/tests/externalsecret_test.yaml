suite: externalsecret
templates:
  - externalsecret.yaml
release:
  name: shop
  namespace: shop
values:
  - ../ci/minimal-values.yaml
tests:
  - it: renders no ExternalSecret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one ExternalSecret per entry, writing the Secret <release>-<name>
    set:
      externalSecrets:
        - name: database
          secretStoreRef:
            kind: ClusterSecretStore
            name: secret-manager
          data:
            - secretKey: PASSWORD
              remoteRef:
                key: shop/db
                property: password
            - secretKey: USER
              remoteRef:
                key: shop/db
                property: user
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: shop-database
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: secret-manager
      - equal:
          path: spec.target
          value:
            name: shop-database
      - equal:
          path: spec.data
          value:
            - secretKey: PASSWORD
              remoteRef:
                key: shop/db
                property: password
            - secretKey: USER
              remoteRef:
                key: shop/db
                property: user
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: shop
            app.kubernetes.io/instance: shop
            app.kubernetes.io/component: webapp

  - it: refuses two ExternalSecrets with the same name
    set:
      externalSecrets:
        - name: database
          secretStoreRef: {kind: SecretStore, name: a}
          data: [{secretKey: A, remoteRef: {key: a}}]
        - name: database
          secretStoreRef: {kind: SecretStore, name: b}
          data: [{secretKey: B, remoteRef: {key: b}}]
    asserts:
      - failedTemplate:
          errorPattern: "externalSecrets: two named database"
