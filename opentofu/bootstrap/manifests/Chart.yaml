apiVersion: v2
name: socle
# Equals VERSION. The helm provider re-applies a local chart only when its
# version or its values change, so a template fix ships with a release bump.
version: 0.2.1 # x-release-please-version
description: >-
  The objects the socle bootstrap deposits: the client's inputs, the root
  source and, while kube.gitops is on, the credential of the client's
  repository. Helm is the applier here, not the templater; its expressions
  only carry values through.
