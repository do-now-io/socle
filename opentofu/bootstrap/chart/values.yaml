---
# Every value is supplied by the module. The defaults here exist so that
# `helm template` on the chart alone renders something readable, not so that
# anyone installs it by hand.
commonLabels:
  app.kubernetes.io/part-of: socle

sync:
  name: socle
  kind: OCIRepository
  url: ""
  ref: ""
  digest: ""
  path: "."
  interval: 1m
  targetNamespace: ""
  pullSecret: ""
  prune: true
  wait: true
  timeout: 5m

verify:
  enabled: false
  identity: null
