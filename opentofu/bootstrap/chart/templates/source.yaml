{{- $ns := .Release.Namespace -}}
apiVersion: source.toolkit.fluxcd.io/v1
kind: {{ .Values.sync.kind }}
metadata:
  name: {{ .Values.sync.name }}
  namespace: {{ $ns }}
  labels:
{{ toYaml .Values.commonLabels | indent 4 }}
spec:
  interval: {{ .Values.sync.interval }}
  url: {{ .Values.sync.url }}
{{- if eq .Values.sync.kind "OCIRepository" }}
  ref:
{{- if .Values.sync.digest }}
    digest: {{ .Values.sync.digest }}
{{- else }}
    tag: {{ .Values.sync.ref | quote }}
{{- end }}
{{- if .Values.sync.pullSecret }}
  secretRef:
    name: {{ .Values.sync.pullSecret }}
{{- end }}
{{- if .Values.verify.enabled }}
  # What the FluxInstance sync block cannot express. Checked on every
  # reconciliation, not once at install.
  verify:
    provider: cosign
{{- if .Values.verify.identity }}
    matchOIDCIdentity:
      - issuer: {{ .Values.verify.identity.issuer | quote }}
        subject: {{ .Values.verify.identity.subject | quote }}
{{- end }}
{{- end }}
{{- else }}
  ref:
    branch: {{ .Values.sync.ref | quote }}
{{- if .Values.sync.pullSecret }}
  secretRef:
    name: {{ .Values.sync.pullSecret }}
{{- end }}
{{- end }}
