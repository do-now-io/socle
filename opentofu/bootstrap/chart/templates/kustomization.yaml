apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ .Values.sync.name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ toYaml .Values.commonLabels | indent 4 }}
spec:
  interval: {{ .Values.sync.interval }}
  path: {{ .Values.sync.path | quote }}
  sourceRef:
    kind: {{ .Values.sync.kind }}
    name: {{ .Values.sync.name }}
  # Garbage collection on: an object dropped from the artifact has to leave
  # the cluster, or a version bump would only ever add.
  prune: {{ .Values.sync.prune }}
  wait: {{ .Values.sync.wait }}
  timeout: {{ .Values.sync.timeout }}
{{- if .Values.sync.targetNamespace }}
  # For manifests that carry no namespace of their own — the other thing the
  # FluxInstance sync block cannot express.
  targetNamespace: {{ .Values.sync.targetNamespace }}
{{- end }}
