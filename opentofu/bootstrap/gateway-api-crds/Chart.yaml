apiVersion: v2
name: gateway-api-crds
description: >-
  The Kubernetes Gateway API, standard channel, as a Helm envelope so that
  OpenTofu can apply it before Cilium — whose operator reads these CRDs once,
  at start-up. templates/standard-install.yaml is the upstream release asset,
  verbatim; .github/scripts/check-gateway-api-crds.sh fails CI when it is not.
  In templates/, not crds/, so that a version bump upgrades them.
type: application
# The Gateway API release this envelope carries. Bump appVersion and version
# together with local.gateway_api_version in ../cilium.tf, to the version the
# pinned Cilium minor documents — no other.
version: 1.6.1
appVersion: v1.6.1
